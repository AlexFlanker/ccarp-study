{d:6,m:0,qe:"At the requirements workshop for a claims-processing assistant, which single question most shapes the architecture?",qz:"理赔处理助手的需求工作坊上，哪一个问题对架构的塑造作用最大？",oe:["Which model vendor does the organization prefer?","Should responses be formal or conversational in tone?","What are the peak volume, latency SLA, data sensitivity, and audit requirements?","Which team will maintain the system after launch?"],oz:["组织倾向于哪家模型供应商？","回复语气应该正式还是口语化？","峰值量级、延迟 SLA、数据敏感级别与审计要求分别是什么？","上线后由哪个团队维护？"],a:[2],re:"C — non-functional requirements dictate the skeleton: sync versus async, deployment boundary, logging design, model tier. A matters but is a swappable component decision downstream of requirements. B is a real UX requirement that adjusts prompts, not architecture. D is a genuine operational concern that shapes handoff planning — asked later, it changes little about the design itself.",rz:"C——非功能需求决定骨架：同步还是异步、部署边界、日志设计、模型档位。A 重要，但那是需求确定之后的可替换组件决策；B 是真实的体验需求，调整的是提示词不是架构；D 是真实的运营关切，影响交接规划——晚点问也几乎不改变设计本身。"},
{d:6,m:0,qe:"You chose RAG over fine-tuning. The CTO challenges it in review: fine-tuning would learn our voice better. A decision is needed this week; you have eval data. Strongest response?",qz:"你选了 RAG 而非微调。CTO 在评审会上质疑：「微调更能学到我们的语言风格」。本周必须定案；你手上有评测数据。最有力的回应？",oe:["Walk through the ADR: both options against the criteria (freshness, cost, maintainability), with your eval data, and record the decision with its revisit conditions","Cite industry adoption statistics showing most teams choose RAG","Defer to the CTO's preference and switch to fine-tuning","Propose a two-week spike building both to compare directly"],oz:["过一遍 ADR：两个方案对照标准（数据新鲜度、成本、可维护性）+ 你的评测数据，记录决策与复议条件","引用行业采用率统计：多数团队都选 RAG","尊重 CTO 的倾向，改走微调","提议花两周把两条路都做出来直接对比"],a:[0],re:"A — decisions defended by criteria and data, recorded with revisit conditions, survive challenges without becoming battles. B is real evidence of a weak kind: popularity is not fit for your constraints. C abandons the architect's duty to present evidence — deference is not alignment. D is a legitimate de-risking spike when time permits and data is absent; the stem gives you eval data and a one-week deadline.",rz:"A——用标准+数据为决策辩护、连同复议条件一并记录，经得起挑战又不变成争斗。B 是真实但弱质证据：流行度不等于契合你的约束；C 放弃了架构师呈证的职责——顺从不是对齐；D 在时间允许且缺数据时是正当的验证性 spike，而题干说了：数据你有，时限一周。"},
{d:6,m:0,qe:"A business sponsor insists on 100% accuracy before launch of a document classifier. The realistic ceiling on your eval is 96%. Best path forward?",qz:"业务发起人坚持文档分类器「100% 准确才能上线」。评测显示现实天花板是 96%。最佳推进路径？",oe:["Accept a contractual penalty clause for any misclassification to give the sponsor assurance","Propose replacing the LLM with a deterministic rules engine to reach exactness","Commit to reaching 100% through continued prompt iteration before launch","Reframe as an error budget: quantify the cost of each error type, route low-confidence cases to human review, and agree launch criteria on the combined system"],oz:["接受合同违约金条款：凡误分类即赔付，给发起人吃定心丸","提议改用确定性规则引擎替代 LLM 以达到精确","承诺上线前通过持续调优把准确率做到 100%","改用错误预算框架：量化每类错误的代价，低置信样本转人工复核，按「人机组合系统」商定上线标准"],a:[3],re:"D — the honest, workable frame: probabilistic core plus human tail can meet a business-level guarantee even though the model alone cannot. A is a real commercial instrument that transfers cost without reducing error — and prices an impossible promise. B is genuinely correct for rule-expressible domains; document classification with natural-language variance is not one, or rules would already work. C commits to a number no iteration can honestly reach — the origin of broken trust later.",rz:"D——诚实且可行的框架：概率核心+人工兜底的组合系统，可以在模型单体做不到时满足业务级保证。A 是真实的商业工具，转移成本但不减少错误——而且是在为一个不可能的承诺定价；B 在规则可表达的领域是真正确解——自然语言变体的文档分类若能用规则，早就用上了；C 承诺了一个任何调优都到不了的数字——日后信任破裂的起点。"},
{d:6,m:0,qe:"Your provider occasionally degrades (elevated latency) a few hours per quarter. A customer wants a 2-second p95 SLA in the contract. Responsible position?",qz:"上游模型服务每季度会有几小时的延迟劣化。客户要求在合同里写 p95 2 秒的 SLA。负责任的立场是？",oe:["Build a multi-provider abstraction layer first so the SLA can be met unconditionally","Commit to the target with a defined degraded mode (cached answers, lighter model, human fallback) and explicit service levels during degradation","Sign the unconditional 2-second SLA and rely on penalty credits when breached","Offer the SLA on p50 instead, which current performance already meets"],oz:["先建多供应商抽象层，让 SLA 可被无条件满足","承诺目标值，同时定义降级模式（缓存应答/轻量模型/人工兜底）及降级期间的服务标准","签下无条件的 2 秒 SLA，违约时用赔付抵偿","把 SLA 改按 p50 承诺——现有表现已能达标"],a:[1],re:"B — honest engineering: a target plus a designed, disclosed degraded mode the customer can plan around. A is real architecture that genuinely mitigates provider risk — a quarter-plus of engineering, wrong as a contract-signing precondition, right as a roadmap item. C converts known upstream behavior into guaranteed breaches; credits compensate rather than serve. D games the metric — p50 hides exactly the tail the customer cares about.",rz:"B——诚实的工程立场：目标值+设计好的、透明的降级模式，客户可据此规划。A 是真实架构、确实能对冲供应商风险——但那是一个季度以上的工程量，作为签约前置条件是错的，作为路线图项目是对的；C 把已知的上游行为变成必然违约，赔付是补偿不是服务；D 是在玩指标——p50 藏起来的恰是客户在意的尾部。"},
{d:6,m:0,qe:"Pilot users report issues in a group chat; two months later most were never addressed and users are disengaging. Which mechanism fixes this durably?",qz:"试点用户在群里反馈问题；两个月后大多数从未被处理，用户开始流失。哪种机制能长效解决？",oe:["A quarterly satisfaction survey with reported metrics","A dedicated feedback email inbox replacing the group chat","A feedback loop with an owner: structured intake, weekly triage, reproducible cases into the eval set, and closure notices back to reporters","An FAQ page addressing the most common complaints"],oz:["季度满意度调查并汇报指标","设专用反馈邮箱，替代群聊渠道","有专人负责的反馈闭环：结构化收集、每周分诊、可复现问题进评测集、处理结果回执给反馈人","上线 FAQ 页面，回应最常见的抱怨"],a:[2],re:"C — the failure is structural: no ownership, no triage, no closure loop. A is a real listening instrument at the wrong frequency — quarterly aggregates cannot drive weekly fixes. B swaps channels while the actual gap (nobody processes the input) remains. D addresses symptoms users already found — static answers, no path from report to fix.",rz:"C——败因是结构性的：没有负责人、没有分诊、没有闭环回执。A 是真实的倾听工具但频率不对——季度聚合驱动不了每周的修复；B 只是换了渠道，真正的缺口（没人处理输入）原样保留；D 回应的是用户已经发现的症状——静态答案，缺少从报告到修复的路径。"},
{d:6,m:2,qe:"(Select 2) Handing the system to an ops team, which two artifacts are essential for them to run it independently?",qz:"（多选，选2项）系统移交运维团队，哪两项交付物是他们独立运维的必需品？",oe:["A runbook mapping each alert to diagnosis steps and escalation paths","The original architecture pitch deck presented to leadership","Access to the versioned prompt registry and the evaluation dashboard","A recorded walkthrough video of the codebase"],oz:["Runbook：每个告警对应的诊断步骤与升级路径","当初向管理层汇报的架构 PPT","版本化 prompt 注册表与评测面板的访问权","代码库讲解的录屏视频"],a:[0,2],re:"A enables incident response; C enables safe change management — the two capabilities operations must own. B and D are genuinely useful onboarding context, but neither tells anyone what to do at 3 a.m. or how to ship a prompt change safely.",rz:"A 支撑事故响应；C 支撑安全的变更管理——这正是运维必须接手的两种能力。B、D 是真实有用的入门背景材料，但都回答不了「凌晨三点告警了怎么办」和「怎么安全地上一个 prompt 变更」。"},
{d:6,m:0,qe:"After a compelling demo, an executive wants org-wide rollout next month. The system has no production evals yet. Your move?",qz:"一场惊艳的演示后，高管拍板下个月全组织推广。系统目前还没有任何生产评测。你的动作？",oe:["Propose a scoped pilot with predefined success criteria and an eval baseline, positioning full rollout as the pilot's exit decision","Roll out behind a feature flag to everyone with monitoring dashboards watching quality","Accelerate: dedicate the month to building evals while marketing prepares the launch","Decline the timeline and restate the risks of premature rollout"],oz:["提议限定范围的试点：预设成功标准+评测基线，把全量推广定位为试点的出口决策","上功能开关向全员放量，用监控面板盯住质量","加速并行：这个月专注补评测，市场部同步筹备发布","拒绝该时间表，重申过早推广的风险"],a:[0],re:"A — converts enthusiasm into a structured decision path with data as the gate; leadership keeps momentum, the org keeps safety. B is real deployment hygiene — flags limit blast radius but a full-population rollout without evals means monitoring must catch what no baseline defines. C runs marketing and validation in parallel, coupling announcement pressure to unproven results. D may be factually right and organizationally weakest: a no without an alternative loses the room.",rz:"A——把热情转化为结构化决策路径，数据是闸门；管理层保住势头，组织保住安全。B 是真实的发布卫生——开关能控爆炸半径，但没有评测基线的全员放量，等于让监控去捕捉一个从未被定义的「异常」；C 让宣传与验证并行，把发布压力焊在未经证明的结果上；D 事实上可能对、组织上最弱：只有否定没有替代方案，会输掉整个房间。"},
{d:6,m:0,qe:"Three months post-launch, the system runs stably. What does mature lifecycle management look like now?",qz:"上线三个月，系统运行平稳。此时成熟的生命周期管理长什么样？",oe:["Transition the project to closure and reassign the team to new initiatives","Scheduled drift reviews (input mix, retrieval freshness, cost trends), a feedback-to-eval pipeline, and a prioritized iteration backlog with an owner","Maintain the system in keep-the-lights-on mode, handling tickets as they arise","Begin planning version 2.0 with a redesigned architecture"],oz:["项目转入结项，团队调配到新项目","定期漂移复盘（输入构成/检索时效/成本趋势）+ 反馈进评测集的管道 + 有负责人的迭代待办","进入维持模式，有工单就处理","启动 2.0 版本规划，重新设计架构"],a:[1],re:"B — LLM systems degrade silently as the world shifts; lifecycle management means instrumented vigilance plus deliberate iteration. A is standard project management for finite deliverables — an LLM service is not one. C is reactive maintenance: real, common, and blind to drift until users complain. D is warranted when the current architecture demonstrably limits you; stable operation three months in is not that evidence.",rz:"B——世界在变，LLM 系统会静默劣化；生命周期管理=带仪表的警觉+有意识的迭代。A 是有限交付物的标准项目管理——LLM 服务不是有限交付物；C 是反应式维护：真实、普遍、并且在用户抱怨之前对漂移全盲；D 在现有架构被证明成为瓶颈时才有依据——上线三个月的平稳运行不是那个证据。"},
{d:7,m:0,qe:"A 60-repo organization wants Claude Code to follow each repo's own conventions with zero per-developer setup. Which mechanism?",qz:"一个 60 仓库的组织希望 Claude Code 遵循每个仓库各自的规范，且开发者零配置。哪种机制？",oe:["A comprehensive org-wide standards file distributed to every machine by device management","Personal user-level configuration maintained by each developer from a wiki template","A quarterly onboarding session teaching the conventions","Repo-committed project memory: CLAUDE.md plus scoped rules files, versioned with the code they govern"],oz:["组织级统一规范文件，由设备管理系统下发到每台机器","每位开发者按 wiki 模板维护个人用户级配置","每季度一次的规范培训课","仓库内提交的项目级记忆：CLAUDE.md + 作用域规则文件，与其约束的代码同库同版本"],a:[3],re:"D — conventions differ per repo, so they must live and version with each repo; cloning delivers them automatically. A is real infrastructure for org-wide invariants (security baselines) — a single global file cannot express 60 repos' distinct conventions. B works briefly and drifts individually, exactly what zero-setup was meant to prevent. C transfers knowledge to humans; the tool reads configuration, not memories of a slide deck.",rz:"D——规范因仓库而异，就必须与各仓库同生共版本，clone 即得。A 是组织级不变量（如安全基线）的真实基础设施——但一个全局文件表达不了 60 个仓库各自的规范；B 短期可用、随后各自漂移，恰是「零配置」要消灭的东西；C 把知识传给人——而工具读的是配置，不是培训的记忆。"},
{d:7,m:0,qe:"A CI pipeline should run Claude Code to review every PR automatically and post findings. Which invocation pattern is correct?",qz:"CI 流水线要用 Claude Code 自动审查每个 PR 并回帖结果。哪种调用姿势正确？",oe:["Headless mode (-p) with a restricted allowed-tools set and structured output the pipeline parses","Interactive mode driven by an expect script that answers the prompts","A full-permission containerized session so nothing blocks the review","Have the pipeline open a review request assigned to an on-call engineer"],oz:["Headless（-p）+ 受限的 allowed-tools + 流水线可解析的结构化输出","交互模式，由 expect 脚本自动应答各种提示","容器里跑全权限会话，确保审查不被任何限制卡住","流水线开一个评审请求，指派给值班工程师处理"],a:[0],re:"A — headless is the designed non-interactive path; restricted tools and parseable output make it safe and automatable. B is a real automation technique for legacy CLIs — brittle here and bypasses the supported mode. C solves blocking by removing the guardrails that make automated review safe in CI. D is a valid human process that abandons the automation objective.",rz:"A——headless 是官方设计的非交互路径；受限工具+可解析输出让它既安全又可自动化。B 是对付老式 CLI 的真实自动化技巧——在这里脆弱且绕开了受支持的模式；C 用拆掉护栏的方式解决卡住问题，恰恰拆掉了 CI 里自动审查赖以安全的东西；D 是正当的人工流程，但放弃了自动化目标本身。"},
{d:7,m:0,qe:"A shared dependency-audit skill dumps thousands of scan lines into the invoking developer's main conversation, degrading it. Best fix?",qz:"团队共享的依赖审计 skill 每次把数千行扫描输出灌进使用者的主对话，严重劣化上下文。最佳修复？",oe:["Cap the skill's output at a maximum line count","Schedule audits to run outside working hours","Run the skill in a forked, isolated context that returns only a structured summary","Split the skill into several smaller skills run separately"],oz:["给 skill 输出设置最大行数上限","把审计安排在非工作时间运行","让 skill 在 fork 出的隔离上下文运行，只回传结构化摘要","把 skill 拆成几个更小的 skill 分别运行"],a:[2],re:"C — architectural isolation: the noise never enters the main context, and the developer gets the signal. A is a real mitigation that truncates arbitrarily — the cut lines may be the findings that mattered. B misreads the problem as scheduling; the context damage happens whenever it runs. D distributes the same total output across more invocations — several medium dumps instead of one large one.",rz:"C——架构级隔离：噪声根本不进入主对话，开发者只拿到信号。A 是真实的缓解手段，但截断是任意的——被切掉的行可能恰是要紧的发现；B 把问题误读成排期问题，上下文损伤与几点运行无关；D 把同样的总输出摊到更多次调用——从一次大灌变成几次中灌。"},
{d:7,m:2,qe:"(Select 2) Rolling Claude Code out to 300 engineers, which two controls give safety without destroying productivity?",qz:"（多选，选2项）向 300 名工程师推广 Claude Code，哪两个控制既守住安全又不牺牲生产力？",oe:["Individual discretion for senior engineers to configure their own safeguards","A managed permission baseline defining allowed tools, with audited repo-level exceptions","Shared pre-execution hooks that block destructive command patterns before they run","Disabling all command execution org-wide until further review"],oz:["资深工程师自行裁量、各自配置防护","受管控的权限基线（定义允许的工具），例外走仓库级声明并可审计","共享的执行前 hook，在危险命令模式运行前拦截","全组织禁用一切命令执行，等待进一步评审"],a:[1,2],re:"B gives a governable default with a legitimate exception path; C adds deterministic prevention at the point of execution. A is how many orgs actually operate — discretion does not scale to 300 people and leaves no audit trail. D is maximal safety at near-total productivity cost; a lockdown is a pause, not an operating model.",rz:"B 提供可治理的默认值和正当的例外通道；C 在执行点上加确定性拦截。A 是许多组织的真实现状——但裁量权无法扩展到 300 人，也不留审计痕迹；D 用接近全损的生产力换最大安全；封禁是暂停键，不是运行模式。"},
{d:4,m:0,qe:"Last sprint shipped a prompt rewrite, a retriever top-k change, and a model minor-version bump together. Quality dropped and the team disagrees on the cause. How do you attribute it?",qz:"上个迭代同时上线了 prompt 重写、检索 top-k 调整和模型小版本升级。质量下滑，团队对原因各执一词。如何归因？",oe:["Roll all three changes back immediately and restore the last known-good state","Inspect production logs for the change most correlated with failing requests","Survey affected users about which behavior changed most noticeably","Re-run the eval suite in a controlled matrix, varying one factor at a time from the previous baseline"],oz:["立即回滚全部三项变更，恢复到最近的已知良好状态","翻生产日志，找与失败请求相关性最高的那项变更","调研受影响用户：哪种行为变化最明显","在受控矩阵下重跑评测：从旧基线出发，每次只变一个因子"],a:[3],re:"D — attribution requires isolation; a one-factor-at-a-time matrix over the eval suite pinpoints the culprit cheaply and offline. A is the right emergency move when losses are mounting — it restores service but answers nothing, and the team re-ships blind. B is real observability work; correlation across simultaneous changes is precisely what it cannot untangle. C captures perception, which lags and conflates the three changes just as the logs do.",rz:"D——归因需要隔离；对评测套件做「一次只变一个因子」的矩阵重跑，离线低成本锁定元凶。A 是损失扩大时正确的应急动作——恢复了服务但什么也没回答，团队之后仍是盲改重上；B 是真实的可观测性工作，但「同时上线的变更之间的相关性」恰恰是它解不开的；C 采集的是感知，滞后且和日志一样把三项变更混在一起。"}
]},
{id:"II",ne:"Set II · Reinforcement",nz:"Set II · 强化卷",time:80,qs:[
{d:1,m:0,qe:"A publisher localizes 400-page manuals into three languages. Chapters are independent, but terminology must be consistent across the whole book. Time-to-market matters. Best architecture?",qz:"出版商要把 400 页手册本地化为三种语言。章节相互独立，但全书术语必须一致。上市时间很重要。最佳架构？",oe:["Sequential chapter-by-chapter translation so each chapter sees all prior context","Sectioning parallelization per chapter with a shared glossary injected, plus a final consistency pass","One long-context call translating the entire book at once","Orchestrator-workers where a lead model decides how to split the work"],oz:["逐章串行翻译，让每章都能看到之前的全部上下文","按章节切分并行（每个分片注入共享术语表），最后跑一遍一致性核对","单次长上下文调用，一口气翻完整本书","Orchestrator-workers：由主模型自行决定如何拆分"],a:[1],re:"B — independence makes chapters parallelizable; the glossary plus final pass handles the one cross-cutting constraint. A genuinely maximizes context continuity and is right when chapters depend on each other — here they do not, and serial processing forfeits the deadline. C concentrates failure into one giant call and strains output limits; a mid-book error costs the whole run. D fits when the partition is unknown; the chapter structure already gives you the split for free.",rz:"B——章节独立即可并行，术语表+终检恰好处理唯一的横切约束。A 确实最大化上下文连续性，在章节相互依赖时是正解——此处不依赖，串行白白牺牲工期；C 把失败集中进一次巨型调用且逼近输出上限，书中段出错整场重来；D 适合切分方式未知的场景——章节结构已经免费给了你切法。"},
{d:1,m:0,qe:"A startup builds a form-processing app: 90% of fields are fixed-format (IDs, dates, amounts); 10% are free-text remarks needing interpretation. An engineer proposes an LLM agent handling every field. Better design?",qz:"初创公司做表单处理应用：90% 字段是固定格式（编号、日期、金额），10% 是需要理解的自由文本备注。有工程师提议全部字段交给 LLM Agent。更好的设计是？",oe:["A single LLM call that extracts all fields together for simplicity","An agent with validation tools that decides field by field","Deterministic parsers for fixed-format fields; LLM only for the free-text remarks","An evaluator-optimizer loop to drive extraction accuracy up"],oz:["为简单起见，用单次 LLM 调用统一抽取所有字段","带校验工具的 Agent，逐字段自行决策","固定格式字段用确定性解析器；LLM 只处理自由文本备注","用 evaluator-optimizer 循环拉高抽取准确率"],a:[2],re:"C — deterministic problems deserve deterministic code: cheaper, exact, testable; the LLM earns its cost only where interpretation is required. A is a defensible prototype shortcut that pays inference tax and accepts probabilistic errors on fields regex would parse exactly. B adds agency where no decision-making exists — every field's handling is knowable upfront. D is a quality mechanism for tasks with quality gradients; a mis-parsed date is not improved by iteration, it is prevented by a parser.",rz:"C——确定性问题就该用确定性代码：更便宜、精确、可测试；LLM 只在需要理解处才配得上它的成本。A 是说得过去的原型捷径，但为正则就能精确解析的字段付推理税、接受概率性错误；B 在不存在决策的地方引入自主性——每个字段怎么处理事先就完全可知；D 是为有质量梯度的任务准备的机制；解析错的日期不靠迭代改良，靠解析器预防。"},
{d:1,m:0,qe:"Daily investor summaries are generated at high volume, and a compliance error in even one summary is costly. Human review of all output is not feasible. Which architecture adds verification affordably?",qz:"投资者摘要每天大批量生成，任何一份出合规错误代价都很高。全量人工审核不可行。哪种架构能低成本加上验证？",oe:["A separate critic model with the compliance checklist gates every summary; failures are blocked and routed for repair","Have the generator model re-check its own output in the same conversation before sending","Upgrade generation to the most capable model so errors become rare","Human review of a random 5% sample of summaries"],oz:["独立的 critic 模型按合规清单把关每份摘要：不过关即拦截并转入修复","生成模型在同一对话里自查一遍再发出","升级到最强模型做生成，让错误变得罕见","对 5% 摘要做随机人工抽审"],a:[0],re:"A — an independent checker with fresh context avoids anchoring and gates every item, at model prices rather than human prices. B is real and cheap, but same-conversation self-review defends its own reasoning — detection rates are consistently poor. C reduces error frequency without adding any verification; rare-but-unverified fails the stated stakes. D is legitimate quality sampling — it measures the error rate but lets 95% of errors through unexamined.",rz:"A——带全新上下文的独立审查器避免锚定偏差，且按模型价格而非人力价格把关每一份。B 真实又便宜，但同对话自查会为自己的推理辩护——检出率一贯差；C 降低错误频率却不增加任何验证，「罕见但未经验证」过不了题干的风险要求；D 是正当的质量抽样——它量得出错误率，也放过了 95% 未经检视的错误。"},
{d:1,m:0,qe:"An underwriting workload arrives in unpredictable bursts within the day; results are needed within hours, not seconds. The sync API fleet is sized for average load and falls over during bursts. Best fix?",qz:"核保工作负载在一天内不可预测地突发到达；结果几小时内给出即可，不需要秒级。同步 API 集群按平均负载配置，突发时被打垮。最佳修复？",oe:["Autoscale the synchronous fleet to absorb the worst observed burst","Impose per-client rate limits so bursts cannot form","Pre-generate results speculatively during idle periods","Queue the work and process asynchronously (batch where possible), keeping sync capacity for interactive traffic"],oz:["自动扩容同步集群，吸收观测到的最大突发","对各客户端限流，让突发无法形成","空闲时段投机性地预生成结果","工作进队列异步处理（能批则批），同步容量留给交互流量"],a:[3],re:"D — hours-level tolerance is the definition of queue-and-batch territory; the burst problem dissolves and unit cost drops. A is real and appropriate for latency-critical bursts — here you would pay peak capacity to win seconds nobody asked for. B protects the platform by degrading the business: the work still must be done, limits just delay it unpredictably. C is a genuine technique when inputs are predictable; underwriting requests cannot be guessed in advance.",rz:"D——小时级容忍度就是「排队+批处理」的定义域：突发问题自行消解，单位成本还下降。A 真实且适用于延迟敏感的突发——在这里等于花峰值容量去赢没人要的几秒；B 靠牺牲业务保护平台：活还是那些活，限流只是让它不可预测地迟到；C 在输入可预测时是真招——核保请求没法提前猜。"},
{d:1,m:0,qe:"A tutoring product must recall each student's progress and weak areas across sessions spanning months. Which memory design is sound?",qz:"辅导类产品要在跨越数月的多次会话中记住每个学生的进度与薄弱点。哪种记忆设计是健全的？",oe:["Keep one continuous conversation per student alive indefinitely","Structured external memory per student, written at session end and injected as a summary at session start","Periodically fine-tune the model on each student's interaction history","Replay the student's full session history into context at each start"],oz:["为每个学生维持一条永不关闭的连续对话","每个学生一份结构化外置记忆：会话结束时写入，下次开始时以摘要注入","定期用每个学生的交互历史微调模型","每次开场把该学生全部历史会话重放进上下文"],a:[1],re:"B — durable, queryable, controllable, and cheap: the canonical cross-session state design. A hits context limits within weeks and couples all state to one fragile thread. C is a real personalization technique at cohort scale; per-student fine-tunes are economically and operationally indefensible. D works for a while, then cost and context growth scale linearly with tenure — the oldest students get the worst experience.",rz:"B——持久、可查询、可控、便宜：跨会话状态的标准设计。A 几周内就会撞上上下文上限，且把全部状态绑在一根脆弱的线程上；C 在群体层面是真实的个性化手段，按学生逐个微调在经济与运维上都站不住；D 能撑一阵，随后成本与上下文随在读时长线性膨胀——学龄最长的学生体验最差。"},
{d:1,m:2,qe:"(Select 2) Compared with a coded workflow, which two risks does an autonomous agent genuinely introduce?",qz:"（多选，选2项）相比代码编排的工作流，自主 Agent 真正额外引入的是哪两类风险？",oe:["Unbounded or hard-to-predict cost and step count per task","Loss of the ability to invoke external tools","Inability to benefit from prompt caching","A wider failure surface requiring guardrails and stop conditions"],oz:["单任务的成本与步数无上界、难以预测","失去调用外部工具的能力","无法再享受 prompt caching 的收益","失败面更宽，必须配护栏与停止条件"],a:[0,3],re:"A and D are the honest price of agency: loops decide their own length and can fail in ways fixed pipelines cannot. B is backwards — tool use is central to agents. C is false as stated: stable prefixes still cache in agentic loops; caching design gets harder, not impossible.",rz:"A、D 是自主性的真实代价：循环自己决定自己的长度，且会以固定管线不可能的方式失败。B 说反了——工具调用正是 Agent 的核心；C 的表述不成立：代理循环里稳定前缀照样可缓存，只是缓存设计变难，不是消失。"},
{d:1,m:0,qe:"Choosing the first AI pilot among candidate workflows, which profile maximizes the chance of a credible, expandable win?",qz:"在候选工作流中挑第一个 AI 试点，哪种画像最可能拿下可信、可扩展的胜利？",oe:["The most strategically visible workflow the CEO mentioned in the all-hands","A rarely used internal workflow where failures would go unnoticed","High volume, an existing measurable baseline, and tolerance for occasional recoverable errors","The workflow with the highest per-transaction financial stakes"],oz:["CEO 在全员会上点名的最有战略曝光度的流程","一个几乎没人用、失败也无人注意的内部流程","高频、有现成可测基线、且个别可恢复错误可被容忍","单笔金额风险最高的流程"],a:[2],re:"C — volume gives fast learning, a baseline makes the win measurable, and error tolerance permits iteration. A has real organizational value (sponsorship, visibility) but visibility cuts both ways when the first version stumbles. B is safe in the worst way: too little usage to learn from or to prove anything. D maximizes what a pilot should minimize — the cost of the early mistakes that iteration requires.",rz:"C——高频带来快速学习，基线让胜利可度量，容错让迭代成为可能。A 有真实的组织价值（背书、曝光），但第一版一旦踉跄，曝光是双刃剑；B 安全得最糟糕：用量太小，既学不到东西也证明不了什么；D 把试点本应最小化的东西最大化了——迭代必然伴随的早期错误的代价。"},
{d:2,m:0,qe:"Query difficulty varies widely: 70% are simple lookups, 30% need multi-step reasoning. One model tier serves all today. Cost must drop without hurting hard-query quality. Design?",qz:"查询难度差异巨大：70% 是简单查询，30% 需要多步推理。目前一个模型档位通吃。要求降成本且不伤难题质量。设计？",oe:["Tiered routing: small model by default, escalate to the capable model on difficulty signals (confidence, classifier, or task type)","Move everything to the capable model and offset with caching","Move everything to the small model and accept some hard-query loss","Split traffic randomly between tiers and compare outcomes"],oz:["分层路由：默认小模型，按难度信号（置信度/分类器/任务类型）升级到强模型","全量用强模型，用缓存抵消成本","全量用小模型，接受难题上的部分损失","把流量随机分给两档，对比结果"],a:[0],re:"A — routing spends capability where difficulty is; the 70% easy majority funds the saving. B protects quality and forfeits the goal: caching offsets prefix cost, not per-token tier pricing. C achieves the saving by violating the stated quality constraint on exactly the queries that matter. D is an experiment design, not an operating architecture — useful once, wasteful as steady state.",rz:"A——路由把能力花在难度所在之处，70% 的简单多数贡献了节省。B 保住质量却放弃了目标：缓存抵消的是前缀成本，不是档位单价；C 靠违反题干的质量约束来实现节省，牺牲的恰是要紧的那些查询；D 是实验设计不是运行架构——用一次有价值，当常态就是浪费。"},
{d:2,m:0,qe:"Few-shot examples in a support-reply prompt keep leaking: the model copies example customer names and order numbers into real replies. Fix with least loss?",qz:"客服回复提示里的 few-shot 示例总是「渗漏」：模型把示例里的客户名、订单号抄进真实回复。损失最小的修复？",oe:["Remove the examples and rely on instructions alone","Wrap examples in clearly delimited sections with placeholder values and an explicit note that they are illustrative only","Add more examples so no single one dominates","Move the examples into the user message next to the query"],oz:["删掉示例，只靠指令","示例放进清晰分隔的区块，值全部占位符化，并显式注明「仅供示意」","增加示例数量，避免单个示例占主导","把示例挪进用户消息、紧挨查询放置"],a:[1],re:"B — structural delimitation plus placeholder values removes both the confusion and the leakable content; the teaching value stays. A stops the leak by discarding the mechanism that was improving format quality. C dilutes each example's pull but multiplies the pool of leakable details. D moves the examples closer to the query — proximity increases, not decreases, the copying pressure.",rz:"B——结构化分隔+占位符值，同时消除了混淆和可被抄走的内容，教学价值保留。A 用丢弃机制的方式止漏——那个机制本来在提升格式质量；C 稀释了单个示例的引力，却让可渗漏细节的池子变大；D 把示例挪得离查询更近——距离越近，抄写压力越大不是越小。"},
{d:2,m:0,qe:"An API endpoint needs the model's reply to begin immediately with the JSON payload — no preamble, ever. Which mechanism controls this most directly?",qz:"某 API 端点要求模型回复必须直接以 JSON 载荷开头——永远不要寒暄。哪种机制控制得最直接？",oe:["Add a firm instruction: respond with JSON only, no other text","Configure stop sequences to trim any trailing commentary","Strip non-JSON prefixes in a post-processing step","Prefill the assistant turn with the opening token of the expected structure"],oz:["加一条硬指令：只输出 JSON，不要任何其他文字","配置停止序列，截断尾部的多余评论","后处理阶段剥掉非 JSON 前缀","预填 assistant 轮的开头为目标结构的起始符"],a:[3],re:"D — prefilling determines the first emitted token by construction; the preamble becomes impossible rather than discouraged. A is standard practice that works most of the time — soft adherence with a failure tail. B is a real mechanism aimed at the wrong end: stop sequences cut what comes after, not before. C works and is genuinely common — an extra moving part that hides rather than prevents the behavior.",rz:"D——预填从构造上决定第一个输出 token：寒暄从「被劝阻」变成「不可能」。A 是大多数时候有效的标准做法——软性遵从，留着失败尾巴；B 是指向错误一端的真实机制：停止序列剪的是后面，不是前面；C 可行且确实常见——多一个活动部件，藏起行为而非阻止行为。"},
{d:2,m:0,qe:"One application hosts contract-clause extraction and marketing-slogan brainstorming. How should sampling temperature be configured?",qz:"同一个应用里既有合同条款抽取，又有营销口号头脑风暴。采样温度应如何配置？",oe:["Per-request: near-zero for extraction, elevated for ideation","A single global mid-value as a reasonable compromise","Zero everywhere for maximum reliability","Let each end user adjust temperature to taste"],oz:["按请求配置：抽取近 0，创意发散调高","全局取一个中间值作为合理折中","全部设 0，追求最大可靠性","把温度开放给终端用户自行调节"],a:[0],re:"A — temperature is a per-task control; determinism serves extraction, variance serves ideation. B is the real-world default of many codebases — it makes extraction noisier and brainstorms blander simultaneously. C optimizes half the workload and flattens the other half's purpose. D delegates an engineering parameter users lack the context to set; a real pattern for power tools, wrong for this pairing.",rz:"A——温度是任务级控制：确定性服务抽取，方差服务发散。B 是许多代码库的真实默认——结果是抽取更吵、创意更平，两头受损；C 优化了一半负载，压平了另一半的意义；D 把用户没有上下文去设的工程参数交给用户；对专业工具是真实模式，对这对组合是错的。"},
{d:2,m:0,qe:"A long-running analysis session will eventually exceed the context window. When should compaction happen, and how?",qz:"长时分析会话终将超出上下文窗口。压缩应该何时发生、如何发生？",oe:["Reactively when the limit is hit, letting the oldest messages drop","Continuously: summarize after every turn to keep the context minimal","Proactively at task milestones: summarize completed phases into structured notes while full detail is still available","Avoid compaction by switching to the largest-context model available"],oz:["被动等到达上限，让最早的消息自然掉出","持续压缩：每轮结束都总结一次，保持上下文最小","在任务里程碑处主动进行：趁细节还在，把已完成阶段压缩成结构化笔记","换最大上下文窗口的模型，从而避免压缩"],a:[2],re:"C — milestone compaction chooses what survives while everything is still in view; summaries are made from full information. A loses the oldest content silently — often the founding decisions — with no say in what goes. B is real overhead spent every turn and degrades in-progress reasoning by compressing prematurely. D postpones the ceiling at higher cost; long-running sessions meet any fixed limit eventually.",rz:"C——里程碑压缩在一切尚在视野内时决定「什么留下」：摘要是从全量信息中做出的。A 静默丢掉最老内容——常常是奠基性决策——且没有任何选择权；B 是每轮都付的真实开销，还会因过早压缩伤害进行中的推理；D 用更高成本推迟天花板；长时会话终会撞上任何固定上限。"},
{d:2,m:2,qe:"(Select 2) For prompt caching to actually deliver savings, which two conditions must hold?",qz:"（多选，选2项）要让 prompt caching 真正省钱，哪两个条件必须成立？",oe:["The static content keeps a byte-stable ordering ahead of dynamic content","Cache breakpoints are placed after the stable blocks","Sampling temperature is set to zero","User messages are kept as short as possible"],oz:["静态内容以字节级稳定的顺序排在动态内容之前","缓存断点设置在稳定区块之后","采样温度设为 0","用户消息尽可能短"],a:[0,1],re:"Caching matches byte-stable prefixes up to breakpoints — A and B are the mechanism itself. C is a real quality/consistency knob with zero relation to cache hits. D reduces total tokens, which saves money generally but has nothing to do with whether the prefix cache hits.",rz:"缓存按「到断点为止的字节级稳定前缀」匹配——A、B 就是机制本身。C 是真实的质量/一致性旋钮，与缓存命中零相关；D 减少总 token，总体上省钱，但与前缀缓存是否命中无关。"},
{d:3,m:0,qe:"Legal RAG must quote exact clauses, but answers also need surrounding definitions that live outside the retrieved fragment. Retrieval precision is currently good. Which change?",qz:"法务 RAG 必须逐字引用条款，但回答还需要片段之外的相邻定义条款。目前检索精度不错。改哪里？",oe:["Enlarge chunks so more context fits inside each one","Raise top-k to pull more fragments per query","Summarize each retrieved chunk with its surrounding context","Parent-document retrieval: match on small chunks, supply the enclosing section to the model"],oz:["加大 chunk，让每块装进更多上下文","提高 top-k，每次查询取回更多片段","为每个检回的块生成带上下文的摘要","Parent-document 检索：用小块命中，向模型供给其所在的完整章节"],a:[3],re:"D — decouples match granularity from supply granularity: precise hits, complete sections, verbatim quoting preserved. A trades away the precision the stem says you currently have — bigger chunks blur matching. B fetches more fragments, not the specific enclosing context of the matched one. C is a real enrichment pattern whose summaries violate the verbatim-quote requirement.",rz:"D——把「匹配粒度」与「供给粒度」解耦：命中精确、章节完整、逐字引用不受损。A 拿题干里说「目前不错」的精度去交换——块变大，匹配变糊；B 取回的是更多片段，不是命中块所在的那段特定上下文；C 是真实的增强模式，但摘要恰恰违反逐字引用的要求。"},
{d:3,m:0,qe:"You migrated to a new embedding model but only re-embedded documents added after the cutover; older vectors remain from the previous model. Search quality is erratic. Correct remedy?",qz:"迁移到新 embedding 模型后，只对切换日之后的新文档做了嵌入，旧向量仍来自上一代模型。检索质量时好时坏。正确的补救？",oe:["Query both vector generations and merge results by raw similarity score","Re-embed the entire corpus with the new model version so all vectors share one space","Keep old vectors for old documents since those documents never changed","Raise top-k on the new-vector portion to compensate"],oz:["同时查询新旧两代向量，按原始相似度分数合并结果","用新模型版本全量重嵌入语料，让所有向量同处一个空间","旧文档内容没变过，保留旧向量即可","调高新向量部分的 top-k 来补偿"],a:[1],re:"B — similarity is only meaningful within one embedding space; a single query vector cannot be compared fairly against two generations. A names a real dual-index pattern but merges on raw scores across incompatible spaces — the scores are not commensurable. C misdiagnoses: the documents did not change, the geometry they are indexed in did; the query now lives in the new space. D amplifies retrieval from the healthy half while the old half stays mismatched.",rz:"B——相似度只在同一嵌入空间内才有意义；一个查询向量无法公平地对照两代向量。A 说的是真实的双索引模式，却用不可通约的原始分数跨空间合并——两边的分数不在一个量纲上；C 诊断错了：文档没变，变的是它们被索引进的几何空间——查询现在活在新空间里；D 放大的是健康那一半的检索，错配的另一半原样躺着。"},
{d:3,m:0,qe:"A pen test on your multi-tenant RAG SaaS shows tenant isolation depends on a filter parameter sent by the client application — modifiable by an attacker. Correct fix?",qz:"渗透测试显示：你的多租户 RAG SaaS 的租户隔离依赖客户端应用发送的过滤参数——攻击者可篡改。正确修复？",oe:["Harden the client application so the filter parameter cannot be tampered with","Encrypt the embeddings at rest with per-tenant keys","Enforce tenant scoping server-side in the retrieval layer, derived from the authenticated identity, or partition indexes per tenant","Issue separate API keys per tenant for accountability"],oz:["加固客户端应用，使过滤参数不可被篡改","用租户各自的密钥对向量做静态加密","在检索层服务端强制租户作用域（由认证身份推导），或按租户物理分区索引","按租户签发独立 API key 以便追责"],a:[2],re:"C — isolation must be enforced on the trusted side, derived from authenticated identity, or made structural via partitioning. A invests in the untrusted side; client hardening raises effort but any client-supplied control remains bypassable. B is a real at-rest protection — irrelevant at query time when the service itself reads across tenants. D improves attribution and rate control; accountability does not scope what a query can reach.",rz:"C——隔离必须在可信侧执行、由认证身份推导，或用物理分区变成结构性事实。A 把投资砸在不可信一侧；客户端加固抬高门槛，但凡是客户端提供的控制都仍可绕过；B 是真实的静态保护——查询时服务自己在跨租户读取，加密帮不上；D 改善归因与限流；「能追责」并不限定一次查询「能摸到哪」。"},
{d:3,m:0,qe:"Your agent must react to ticket-status changes in a third-party system. Polling every 10 seconds creates load and still misses nothing-happened windows. The vendor offers signed webhooks. Design?",qz:"Agent 需要对第三方系统的工单状态变化做出反应。每 10 秒轮询一次既造负载、多数时候又空转。对方提供带签名的 webhook。怎么设计？",oe:["Consume webhooks with signature verification as the primary trigger, plus a low-frequency reconciliation poll for missed events","Keep polling but shorten the interval for faster reaction","Consume the webhooks without verification since the source is a trusted vendor","Cache poll responses so repeated polls are cheaper"],oz:["以验签后的 webhook 为主触发，辅以低频对账轮询兜底防丢事件","继续轮询，但缩短间隔以更快反应","来源是可信供应商，直接消费 webhook、不做验签","缓存轮询响应，让重复轮询更便宜"],a:[0],re:"A — event-driven with verification and a reconciliation net is the standard reliable pattern: timely, low-load, tamper-resistant. B doubles down on the identified waste to buy marginal latency. C works until it does not: unauthenticated endpoints accept forged events from anyone who finds the URL; trust in the vendor is not authentication of the caller. D optimizes the cost of the wrong mechanism.",rz:"A——事件驱动+验签+对账兜底是标准可靠模式：及时、低负载、防伪造。B 在已被认定为浪费的机制上加倍投入，换取边际延迟；C 在出事前都好用：无认证端点接受任何找到 URL 的人伪造的事件——「信任供应商」不等于「认证了调用方」；D 优化的是错误机制的成本。"},
{d:3,m:0,qe:"Your client receives frequent 429 responses from a downstream API during peaks. The correct client-side behavior is:",qz:"高峰期你的客户端频繁收到下游 API 的 429 响应。正确的客户端行为是：",oe:["Retry immediately up to three times, then surface the error","Distribute requests across multiple API keys to raise the effective limit","Reduce the payload size of each request to lighten the load","Exponential backoff with jitter, honoring Retry-After, with a local queue to smooth bursts"],oz:["立即重试最多三次，仍失败则抛出错误","把请求分散到多个 API key 上，以抬高有效限额","缩小每个请求的载荷来减轻负载","指数退避+抖动，遵循 Retry-After 头，并用本地队列削峰"],a:[3],re:"D — the polite-client triad: back off, add jitter to avoid synchronized retries, respect the server's own guidance, and smooth your bursts locally. A is ubiquitous real code that amplifies pressure at exactly the wrong moment. B is a real workaround pattern that typically violates the provider's terms and collapses when detected. C confuses payload size with request rate — 429 meters the latter.",rz:"D——礼貌客户端三件套：退避、加抖动避免整齐划一的重试洪峰、遵循服务端自己的指示，并在本地削峰。A 是随处可见的真实代码，却在最糟的时刻放大压力；B 是真实存在的绕限手法，通常违反服务条款，被识别即崩塌；C 把载荷大小和请求速率搞混了——429 计量的是后者。"},
{d:3,m:0,qe:"An agent has five tools; three of them (search_kb, query_db, web_search) get confused with each other, causing wrong-tool calls. Which fix comes first?",qz:"Agent 只有五个工具，其中三个（search_kb、query_db、web_search）经常互相混淆导致误调用。先做哪个修复？",oe:["Scope tools by task mode so fewer are visible per request","Rewrite the three descriptions to state distinct purposes, inputs, and when-to-use / when-not-to-use guidance","Force the correct tool per request with tool_choice","Merge the three into one search tool with a source parameter"],oz:["按任务模式收窄作用域，每次少暴露几个","重写三者的描述：明确各自用途、输入，以及何时该用/不该用","用 tool_choice 按请求强制指定正确工具","把三个合并成一个带 source 参数的搜索工具"],a:[1],re:"B — at five tools the choice space is tiny; confusion among three semantically adjacent tools is a description problem, and description quality is the first lever. A is the right medicine for large tool counts — with five tools it treats the wrong disease. C works when the caller knows the answer, which is exactly what the agent is supposed to determine. D is legitimate consolidation for genuinely homogeneous operations; here it relocates the same three-way choice into a parameter.",rz:"B——五个工具的选择空间极小；三个语义相邻工具的混淆是描述问题，描述质量是第一杠杆。A 是工具数量大时的对症药——五个工具时治的是错病；C 在调用方已知答案时有效，而「判断该用哪个」正是 Agent 的本职；D 是对真正同质操作的正当合并；此处只是把同一个三选一搬进了参数里。"},
{d:3,m:0,qe:"Your assistant consumes another team's agent API. They ship breaking schema changes with little notice. What prevents silent breakage most effectively?",qz:"你的助手消费另一团队的 Agent API。对方常在几乎不通知的情况下上线破坏性 schema 变更。哪种手段最能防止「静默破坏」？",oe:["Pin to the current API version and never upgrade","Build an adapter layer that translates their responses into your schema","Consumer-driven contract tests running in both teams' CI, plus an agreed deprecation window","Schedule quarterly integration testing between the teams"],oz:["锁定当前 API 版本，永不升级","建一个适配层，把对方响应翻译成你的 schema","消费者驱动的契约测试进双方 CI，外加约定的弃用缓冲期","两团队每季度做一次集成测试"],a:[2],re:"C — the contract becomes executable: their CI fails before a breaking change ships, and the window gives consumers time. A is a real freeze tactic that works until the pinned version reaches end-of-life — deferral, not prevention. B genuinely reduces coupling and eases migrations, but the adapter itself breaks silently when upstream semantics change. D catches breakage up to a quarter late; the stem asks to prevent, not eventually notice.",rz:"C——契约变成可执行的东西：破坏性变更在对方 CI 里先红，缓冲期给消费方时间。A 是真实的冻结战术，锁定版本走到生命周期尽头前都有效——是推迟，不是预防；B 确实降低耦合、便于迁移，但上游语义一变，适配层自己就是那个静默坏掉的东西；D 最多晚一个季度才发现——题干要的是预防，不是「终会注意到」。"},
{d:3,m:2,qe:"(Select 2) Users searching exact identifiers (SKU-88213, ERR_CONN_RESET) get poor results from your dense-retrieval search. Which two changes target this directly?",qz:"（多选，选2项）用户搜索精确标识符（SKU-88213、ERR_CONN_RESET）时，纯向量检索效果差。哪两项改动直接对症？",oe:["Switch to a larger dense embedding model","Add a cross-encoder reranker over the dense results","Add a lexical (BM25) index and fuse it with dense results","Canonicalize identifier formats at ingest (case, dashes, zero-padding) so exact matches align"],oz:["换更大的向量嵌入模型","在向量结果之上加 cross-encoder 精排","加词法（BM25）索引，与向量结果做融合","入库时规范化标识符格式（大小写/连字符/补零），让精确匹配可对齐"],a:[2,3],re:"Exact tokens are lexical-search territory (C), and matching only works if both sides share a canonical form (D). A strengthens semantic matching — identifiers carry almost no distributional semantics regardless of model size. B reorders candidates the dense retriever found; when the right document never enters the pool, reranking has nothing to save.",rz:"精确 token 是词法检索的地盘（C），而匹配成立的前提是两侧共享规范形态（D）。A 强化的是语义匹配——标识符无论模型多大都几乎不携带分布语义；B 重排的是向量检回的候选，正确文档根本没进池子时，精排无米下锅。"},
{d:4,m:0,qe:"A support-deflection bot needs its success metrics defined. Which metric design is healthiest?",qz:"客服自助解决（deflection）机器人要定成功指标。哪种指标设计最健康？",oe:["North-star deflection rate paired with guardrail metrics (CSAT on deflected tickets, reopen rate)","Deflection rate alone as a single clear target for the team","Average tokens per conversation, to keep efficiency visible","The model's score on public customer-service benchmarks"],oz:["北极星指标 deflection rate，搭配护栏指标（被自助解决工单的 CSAT、重开率）","只用 deflection rate 一个清晰目标","每会话平均 token 数，保持效率可见","模型在公开客服基准上的得分"],a:[0],re:"A — a north star drives direction while guardrails catch the gaming path (deflecting users who then churn or reopen). B is attractively simple and precisely how metrics get gamed: the bot learns to close tickets, not solve them. C is a real efficiency metric that says nothing about whether customers were helped. D measures the model in a lab, not your system in production.",rz:"A——北极星给方向，护栏堵住刷指标的路（把用户「劝退」后流失或重开）。B 简洁诱人，也正是指标被玩坏的标准方式：机器人学会的是关工单，不是解决问题；C 是真实的效率指标，但对「客户是否被帮到」只字不提；D 量的是实验室里的模型，不是生产里的你的系统。"},
{d:4,m:0,qe:"Offline eval scores stay green while production complaints climb over six weeks. Which addition fixes the blind spot?",qz:"六周以来离线评测持续全绿，生产投诉却不断攀升。补上哪块能消除盲区？",oe:["Expand the offline eval set with more synthetic edge cases","Online quality monitoring with sampled production scoring, and a pipeline refreshing the eval set from live traffic","Re-tune the prompt now since users are clearly unhappy","Re-verify the eval harness for scoring bugs"],oz:["用更多合成边界样例扩充离线评测集","线上质量监控：对生产流量抽样打分，并用真实流量持续刷新评测集","用户显然不满了，先把 prompt 调一版再说","复查评测框架是否有打分 bug"],a:[1],re:"B — the eval set froze a past distribution while production moved; only live sampling and refresh close that gap structurally. A enlarges the same frozen snapshot — synthetic cases encode what you already imagine, not what traffic became. C changes the system with no diagnosis; green offline scores mean you cannot even measure whether the change helps. D is legitimate hygiene worth an hour — but a harness bug would typically show anomalies, not a clean six-week divergence pattern.",rz:"B——评测集冻结的是过去的分布，而生产在移动；只有线上抽样+持续回流能在结构上闭合缺口。A 扩充的仍是同一张冻结快照——合成样例编码的是你已能想象的，不是流量已变成的；C 无诊断地改系统，且离线全绿意味着你连「改了有没有用」都量不出来；D 是值得花一小时的正当卫生检查——但框架 bug 通常表现为异常值，不是干净利落的六周分歧曲线。"},
{d:4,m:0,qe:"You must automatically measure whether RAG answers are supported by their retrieved sources. Which evaluation approach is standard?",qz:"需要自动衡量 RAG 答案是否被其检索来源所支撑。哪种评测方法是标准做法？",oe:["N-gram overlap (BLEU/ROUGE) between the answer and the source passages","A hard cap on answer length to discourage unsupported elaboration","Ask the generating model to attach a confidence score to each answer","Claim-level faithfulness checks: a judge verifies each answer assertion against the retrieved passages, plus citation coverage"],oz:["计算答案与来源段落的 n-gram 重叠（BLEU/ROUGE）","对答案长度设硬上限，抑制无依据的展开","让生成模型为每个答案附上自评置信度","断言级忠实度校验：judge 逐条核对答案断言是否被检回段落支撑，并统计引用覆盖率"],a:[3],re:"D — faithfulness is an assertion-by-assertion property; judge verification against sources plus citation coverage is the standard recipe. A measures surface overlap: a fully faithful paraphrase scores low, a fluent copy of an irrelevant passage scores high. B correlates weakly at best — short answers hallucinate too. C is real but unreliable: models are poorly calibrated judges of their own grounding (the independent-review lesson).",rz:"D——忠实度是逐条断言的属性；judge 对照来源核对+引用覆盖率是标准配方。A 量的是表面重叠：完全忠实的转述得低分，流畅照抄无关段落反而得高分；B 至多弱相关——短答案一样会幻觉；C 真实但不可靠：模型对自身 grounding 的自评校准很差（独立审查的教训）。"},
{d:4,m:0,qe:"Finance demands accurate chargeback of LLM spend to product features. Today one API key serves everything. What is required?",qz:"财务要求把 LLM 开销精确分摊到各产品功能。目前一个 API key 通吃所有调用。需要什么？",oe:["Per-request attribution: tag calls with feature and tenant metadata, aggregate token usage into a cost ledger","Estimate the split by sampling a week of traffic per quarter","Review the monthly provider invoice and divide by team headcount","Create separate API keys per department"],oz:["请求级归因：调用打上 feature/租户元数据标签，按 token 用量聚合成成本台账","每季度抽样一周流量，估算各功能占比","按月看服务商账单，按团队人数分摊","按部门拆分独立 API key"],a:[0],re:"A — chargeback accuracy requires attribution at the unit of spend: the request. B is a real estimation approach that is fine for directional insight, not for finance-grade chargeback that must survive audit. C allocates by a variable unrelated to usage. D is coarse-grained attribution that helps — departments are not features, and one department runs many features.",rz:"A——分摊要精确，就必须在开销的最小单位（请求）上归因。B 是真实的估算方法，看方向可以，过不了财务审计级的分摊；C 用一个与用量无关的变量做分配；D 是有帮助的粗粒度归因——但部门不是功能，一个部门跑着许多功能。"},
{d:4,m:0,qe:"An A/B test of two prompts will decide a quarter's roadmap. Which experimental practice is correct?",qz:"两版 prompt 的 A/B 测试将决定一个季度的路线图。哪种实验实践是正确的？",oe:["Check results daily and stop as soon as p < 0.05 appears","Run for exactly one calendar week as per team convention","Pre-register the sample size from a power analysis; evaluate only when reached, with corrections if peeking early","Run until one variant leads on the dashboard by a visible margin"],oz:["每天看结果，一旦 p<0.05 立即停止","按团队惯例固定跑满一个自然周","用功效分析预先注册样本量；到量才评估，提前看数则做相应校正","跑到某一版在看板上肉眼可见地领先为止"],a:[2],re:"C — decisions of this weight need pre-registered power and disciplined stopping; that is what makes the verdict trustworthy. A is the classic peeking fallacy — repeated looks inflate false positives far above 5%. B is a real convention that ignores whether a week yields the needed sample for your effect size — may be far too short or wastefully long. D formalizes eyeballing; visible margins on dashboards are routinely noise.",rz:"C——决定季度路线图的实验需要预注册功效与有纪律的停止规则，结论才可信。A 是经典的「偷看谬误」——反复看数把假阳性率抬到远超 5%；B 是真实的团队惯例，但完全不管一周是否凑够你的效应量所需样本——可能太短也可能白跑；D 把肉眼判断制度化；看板上的「明显领先」经常就是噪声。"},
{d:4,m:2,qe:"(Select 2) A judge model compares two systems' answers pairwise. Which two controls are essential for a fair comparison?",qz:"（多选，选2项）judge 模型对两个系统的答案做成对比较。哪两个控制是公平比较的必需品？",oe:["Always place the incumbent system first for consistency","Randomize the presentation order of the two answers across trials","Blind the judge to which system produced which answer","Use the same model as generator and judge for aligned standards"],oz:["为了一致性，固定把现网系统放在第一位","在多次试验中随机化两个答案的呈现顺序","对 judge 隐藏「哪个答案出自哪个系统」","生成和评审用同一个模型，保证标准一致"],a:[1,2],re:"Position bias and identity bias are the two documented judge failure modes; B and C neutralize them. A institutionalizes position bias in the name of consistency. D invites self-preference — a judge systematically favoring its own style; a real setup people use, and a known source of skew.",rz:"位置偏好与身份偏好是 judge 的两大已记录失效模式；B、C 正对冲之。A 以一致性之名把位置偏好制度化；D 引入自恋偏好——judge 系统性偏爱自家风格；这是真实存在的用法，也是已知的偏差来源。"},
{d:4,m:0,qe:"Quality dropped, but slice analysis shows the regression is confined to one intent (refund inquiries); the other nine intents are stable. Best response?",qz:"整体质量下滑，但切片分析显示回归只集中在一个意图（退款咨询）；其余九个意图稳定。最佳处置？",oe:["Roll back the entire release to the previous version","Rewrite the shared system prompt to improve all intents at once","Collect two more weeks of data to confirm the pattern","Build a focused eval slice for that intent, fix and verify against it, leaving the healthy intents untouched"],oz:["整体回滚到上一版本","重写共享系统提示，一次性提升所有意图","再收集两周数据确认该模式","为该意图建立聚焦的评测切片，针对性修复并在切片上验证，不动健康的九个意图"],a:[3],re:"D — localized regressions deserve localized fixes with slice-level verification; global changes risk the stable majority. A is the right emergency lever when damage is broad or cause unknown — here the blast radius is one intent and rollback undoes unrelated improvements. B couples a targeted problem to nine untargeted risks through the shared prompt. C delays with little gain: slice attribution already established the pattern.",rz:"D——局部回归配局部修复+切片级验证，全局改动会拿稳定的多数去冒险。A 是损害面大或原因不明时的正确应急杆——此处爆炸半径就一个意图，回滚还会撤销无关的改进；B 通过共享提示词，把一个定向问题耦合成九个非定向风险；C 收益甚微的拖延：切片归因已经确立了模式。"},
{d:5,m:0,qe:"Different employee roles must see different agent capabilities (finance sees reports, interns see public docs only). Where is this properly enforced?",qz:"不同员工角色应看到不同的 Agent 能力（财务能查报表，实习生只能查公开文档）。这应该在哪里正确地强制执行？",oe:["In the system prompt: describe each role's permissions and instruct the model to enforce them","At the gateway/tool layer: the authenticated role determines which tools and data scopes are even attached","Via a lookup tool the model calls to check the user's role before acting","Through post-hoc audits that flag out-of-role actions weekly"],oz:["在系统提示里描述各角色权限，并指示模型自行执行","在网关/工具层：按认证角色决定挂载哪些工具与数据范围","提供一个查询工具，模型行动前自行调用核实用户角色","靠每周事后审计，标记越权行为"],a:[1],re:"B — authorization is infrastructure: the model should never possess capabilities the user lacks; then no persuasion can unlock them. A makes the enforcement point a component that can be argued with — prompts guide behavior, they are not a security boundary. C is a real pattern for informational role context, but self-enforcement leaves the tool attached and invocable. D detects violations after data already moved — audit is necessary, never the enforcement.",rz:"B——授权是基础设施：模型从一开始就不该持有用户没有的能力，如此任何话术都解锁不了。A 把执行点放在一个可以被说服的组件上——提示词引导行为，但不是安全边界；C 是提供角色上下文的真实模式，但自我执行意味着工具仍然挂着、仍然可调；D 在数据已经流走之后才发现越权——审计必要，但永远不是执行本身。"},
{d:5,m:0,qe:"Ops needs request logs to debug production issues; the logs currently contain customer ID numbers and phone numbers in plain text. Balanced fix?",qz:"运维需要请求日志排查生产问题；日志目前明文包含客户证件号和手机号。平衡的修复是？",oe:["Keep full logs but restrict access to a small senior group","Stop logging request content altogether","Redact or tokenize PII at write time, set retention TTLs, and gate log access behind roles with audit","Hash the user identifiers and leave other fields as they are"],oz:["保留完整日志，但把访问权限收紧到少数资深人员","彻底停止记录请求内容","写入时对 PII 脱敏/令牌化，设置保留期 TTL，日志访问走角色权限+审计","只对用户标识做哈希，其余字段原样保留"],a:[2],re:"C — debuggability and privacy coexist: structure-preserving redaction keeps logs useful, TTL bounds exposure, access control governs the rest. A is a real minimization of audience, not of data: one compromised senior account exposes everything, and the PII still sits in storage. B solves privacy by destroying operability — a last resort, not a balance. D covers identifiers while phone numbers remain plaintext, and unsalted hashes of low-entropy IDs are reversible in practice.",rz:"C——可调试性与隐私可以共存：保结构的脱敏让日志仍然有用，TTL 限定暴露时长，访问控制管住其余。A 是对「受众」而非「数据」的真实最小化：一个资深账号失陷即全量暴露，PII 也仍躺在存储里；B 用摧毁可运维性的方式解决隐私——是最后手段，不是平衡；D 盖住了标识符，手机号仍是明文，且低熵 ID 的无盐哈希实践中可被还原。"},
{d:5,m:0,qe:"Your product embeds LLM answers into customer-facing advice. Which transparency practice is required, not optional?",qz:"你的产品把 LLM 答案嵌入面向客户的建议中。哪种透明度实践是必须而非可选的？",oe:["Clear in-context disclosure that AI generated the content, with stated limitations and an escalation path to a human","A disclosure clause included in the terms of service","AI-generated labels available on request through support","Internal watermarking of generated text for provenance tracking"],oz:["使用场景内的清晰披露：内容由 AI 生成、说明局限性、并提供转人工通道","在服务条款里加入披露条款","用户向客服询问时可获知内容是否 AI 生成","对生成文本做内部水印以便溯源"],a:[0],re:"A — meaningful transparency reaches the person at the moment of reliance: visible disclosure, honest limits, a way out to a human. B is a real legal layer that approximately nobody reads at decision time — necessary for counsel, insufficient for users. C inverts the duty: the burden lands on users who did not know to ask. D is a legitimate internal control for provenance and leak tracing; it informs your org, not your customer.",rz:"A——有意义的透明必须在「依赖发生的时刻」触达当事人：可见的披露、诚实的局限、转人工的出路。B 是真实的法律层，但决策时刻几乎没人读——对法务必要，对用户不足；C 把义务倒置：负担落在不知道「该问」的用户身上；D 是溯源与泄漏追踪的正当内部控制——它告知的是你的组织，不是你的客户。"},
{d:5,m:0,qe:"Your provider ships a new model version; behavior will differ in subtle ways across your workloads. Change-management response?",qz:"上游服务商发布了新模型版本；它在你各类负载上的行为会有微妙差异。变更管理上的正确响应？",oe:["Stay pinned to the current version for as long as the provider allows","Adopt immediately since provider testing already covers quality","Switch a low-traffic workload first and watch dashboards for a week","Run the full eval suite against the new version, stage the rollout with rollback ready, and only then retire the old version"],oz:["在服务商允许的期限内一直锁定当前版本","服务商已充分测试，直接切换即可","先切一个低流量负载，盯一周监控看板","先用完整评测套件跑新版本，灰度切换并备好回滚，然后才退役旧版"],a:[3],re:"D — model versions are dependencies: evaluate against your workloads, stage, keep a rollback path. A is a real stabilization tactic that only defers the migration until it becomes forced and rushed at end-of-life. B outsources your quality bar — provider testing covers general capability, not your prompts and edge cases. C is a reasonable instinct that substitutes monitoring for measurement: dashboards catch crashes, not subtle behavior shifts your evals would.",rz:"D——模型版本就是依赖项：用你自己的负载评测、灰度切换、留好回滚。A 是真实的稳定策略，但只是把迁移推迟到停服前被迫仓促进行；B 把你的质量门槛外包了——服务商测的是通用能力，不是你的提示词和边界情况；C 是合理直觉，却用监控替代了测量：看板抓得住崩溃，抓不住你的评测才能发现的细微行为漂移。"},
{d:5,m:2,qe:"(Select 2) An agent can read local files and make web requests. Which two controls most directly block the read-secrets-then-exfiltrate chain?",qz:"（多选，选2项）某 Agent 既能读本地文件又能发网络请求。哪两个控制最直接地阻断「读密钥→外传」链路？",oe:["An egress allowlist restricting network destinations to approved domains","A system-prompt rule stating that secrets must never be transmitted","A policy that blocks or requires approval for network calls after sensitive-file access in the same session","A cap on the maximum length of any single outbound request"],oz:["出站白名单：网络目的地仅限已批准域名","系统提示规则：明确规定绝不允许传输机密","会话内策略：访问敏感文件之后的网络调用被阻断或需审批","限制单次出站请求的最大长度"],a:[0,2],re:"A blocks the destination side; C breaks the causal chain itself (taint-style control). B is a real soft layer — exactly what injection is designed to override. D is a real throttle that fragments exfiltration into more requests rather than preventing it.",rz:"A 封住目的地一侧；C 直接打断因果链本身（污点式控制）。B 是真实的软层——恰恰是注入攻击被设计来覆盖的那一层；D 是真实的限流手段，只会把外泄拆成更多次请求，并不阻止外泄。"},
{d:5,m:0,qe:"A red team demonstrates your agent's system prompt can be extracted through crafted dialogue. What is the correct security posture?",qz:"红队演示：通过精心构造的对话可以套取你 Agent 的系统提示词。正确的安全姿态是？",oe:["Rewrite the prompt with obfuscated phrasing that is harder to extract verbatim","Treat the prompt as non-secret by design: move credentials and sensitive logic out of it, keep enforcement in the tool/policy layer","Add terms of service prohibiting extraction attempts","Append stronger warnings inside the prompt against revealing itself"],oz:["把提示词改写得晦涩难懂，让逐字套取更困难","按「提示词本就非机密」来设计：凭证与敏感逻辑移出提示词，强制力放在工具/策略层","在服务条款中禁止套取行为","在提示词内追加更强硬的「不得自我泄露」警告"],a:[1],re:"B — assume extraction is possible and make it harmless: nothing secret lives in the prompt, and controls hold regardless. A is security through obscurity — raises attacker effort without changing the outcome. C is a real legal deterrent with no technical effect on a determined or external attacker. D fights prompt injection with more prompt — the same class of defense that just failed.",rz:"B——假定提示词可被套取，并让套取变得无害：提示词里没有秘密，控制力在工具/策略层照常成立。A 是靠隐晦求安全——抬高攻击者成本，不改变结局；C 是真实的法律威慑，对铁了心或外部的攻击者没有技术效力；D 用更多提示词去对抗提示词注入——正是刚刚失效的那一类防御。"},
{d:6,m:0,qe:"At project kickoff for a document-triage system, the sponsor says success means it works well. What must the architect drive before build starts?",qz:"文档分诊系统启动会上，发起人说「成功就是它好用」。开工前架构师必须推动什么？",oe:["Lock the delivery date so the team has a clear deadline","Choose the model and platform so procurement can start","Operationalize success: agreed measurable definitions (e.g., triage accuracy threshold, turnaround time, review rate) signed by the sponsor","Secure the budget envelope for the first year"],oz:["先锁定交付日期，让团队有明确期限","先定模型与平台，让采购流程启动","把成功可操作化：与发起人签认可测量的定义（如分诊准确率阈值、周转时间、人工复核率）","先敲定第一年的预算额度"],a:[2],re:"C — vague success guarantees a dispute at launch; measurable, signed definitions are the architect's first deliverable. A, B, and D are all real kickoff activities — but a date, a platform, and a budget for an undefined target just deliver the wrong thing on time, on stack, and on budget.",rz:"C——模糊的「成功」保证上线时有一场争议；可测量、经签认的定义是架构师的第一个交付物。A、B、D 都是真实的启动动作——但为一个未定义的目标锁日期、定平台、批预算，只会准时、按栈、按预算地交付一个错的东西。"},
{d:6,m:0,qe:"Your provider announced end-of-life for the model version your customers rely on, ten months out. Professional customer communication looks like:",qz:"服务商宣布你客户所依赖的模型版本将在十个月后停服。专业的客户沟通应是：",oe:["Proactive migration plan: parity evaluation results on the successor, a staged timeline, and a rollback commitment during transition","Upgrade silently at a low-traffic time since the successor is better on benchmarks","Notify customers of the deadline and let each schedule their own migration","Negotiate extended support and keep customers on the current version"],oz:["主动的迁移方案：继任版本的对齐评测结果+分阶段时间表+过渡期回滚承诺","趁低流量时段静默升级——继任版本在基准上本就更强","把停服时间通知客户，让各家自行安排迁移","与服务商谈延长支持，让客户继续留在当前版本"],a:[0],re:"A — evidence, timeline, and a safety net turn a forced change into a managed one. B is how silent regressions reach customers: benchmark superiority does not guarantee behavior parity on their workloads. C is real notice-giving that outsources the risk assessment customers cannot perform. D is a legitimate bridge tactic that buys months — as the whole plan it just moves the cliff.",rz:"A——证据+时间表+安全网，把被迫的变更变成受管理的变更。B 是静默回归抵达客户的标准路径：基准占优不等于在客户负载上行为对齐；C 是真实的告知义务，却把客户无力自行完成的风险评估外包给了客户；D 是能买来几个月的正当过渡手段——作为完整方案它只是挪动了悬崖的位置。"},
{d:6,m:0,qe:"Two weeks before launch, the support team that will co-work with the AI has never seen it. Enablement priority?",qz:"上线前两周，将与 AI 协作的客服团队还从未见过它。赋能的优先级是什么？",oe:["A technical overview of the model architecture and training approach","Train on failure modes (what hallucination looks like), takeover criteria, and how to report bad cases into the feedback loop","A launch-week newsletter introducing the new assistant","Access to the vendor's product documentation portal"],oz:["一次模型架构与训练方法的技术讲解","训练失效模式识别（幻觉长什么样）、接管标准、以及如何把坏案例报入反馈环","发布周的新助手介绍通讯","开通供应商产品文档门户的访问权"],a:[1],re:"B — the humans in the loop are part of the safety system; they need to recognize failure, know when to take over, and feed the loop. A is genuinely interesting context with near-zero operational value for a support agent mid-ticket. C and D are real communication and reference channels — awareness and documentation do not build the judgment skills the first bad answer will demand.",rz:"B——环内的人是安全体系的一部分：要能认出失效、知道何时接管、会把坏案例喂回反馈环。A 是真实有趣的背景知识，对工单处理中的客服几乎没有操作价值；C、D 是真实的传播与资料渠道——「知道有这回事」和「有文档可查」都替代不了第一个坏答案到来时需要的判断力。"},
{d:6,m:0,qe:"Product wants three new capabilities next sprint; reliability has missed its target for two consecutive weeks. How does the architect frame the conversation?",qz:"产品方希望下个迭代上三个新能力；而可靠性指标已连续两周未达标。架构师应如何组织这场对话？",oe:["Commit to both tracks in parallel to keep stakeholders satisfied","Escalate to leadership to arbitrate between product and engineering","Propose a permanent split: half capacity to features, half to reliability","Invoke the pre-agreed error budget: budget is spent, so capacity shifts to reliability until back within target — then feature velocity resumes"],oz:["两条线并行推进，让各方都满意","上升到管理层，请其在产品与工程之间裁决","提议永久性五五开：一半容量做功能，一半做可靠性","启用事先约定的错误预算机制：预算已耗尽，容量转向可靠性直至回到目标内——之后恢复功能节奏"],a:[3],re:"D — the error budget converts this recurring fight into a pre-agreed rule: spent budget pauses features, restored budget releases them. A satisfies everyone in the meeting and no one at the incident review. B is a real escalation path — reaching for it here signals the team lacks an operating agreement, and leadership will improvise one. C is a real capacity policy that ignores state: it over-invests in reliability when healthy and under-invests during genuine crises.",rz:"D——错误预算把这场反复发生的争执变成事先约定的规则：预算耗尽即暂停功能，恢复达标即释放节奏。A 让会议室里人人满意、事故复盘时无人满意；B 是真实的上升通道——此刻动用它等于宣告团队没有运行规则，管理层只能临场即兴造一个；C 是无视状态的真实容量策略：健康时过度投入可靠性，真正危机时又投入不足。"},
{d:6,m:2,qe:"(Select 2) Which two items in a design document most reduce later disputes with stakeholders?",qz:"（多选，选2项）设计文档里哪两项内容最能减少与干系人的后期争议？",oe:["The team's staffing plan and vacation calendar","Explicit assumptions and known limitations (supported languages, document types, data freshness window)","An inspiring product vision narrative","Quantified non-functional commitments with measurement method (latency percentiles, availability, cost ceiling)"],oz:["团队的排班与休假日历","显式的假设与已知局限（支持语言、文档类型、数据新鲜度窗口）","鼓舞人心的产品愿景叙事","量化的非功能承诺及其测量口径（延迟分位、可用性、成本上限）"],a:[1,3],re:"Disputes cluster where expectations were implicit: B bounds what the system claims to do, D bounds how well and how it will be measured. A is real project information that belongs in project management tooling. C has real motivational value and zero adjudication value when parties disagree about behavior.",rz:"争议聚集在「预期只存在于默会中」的地方：B 划定系统声称能做什么的边界，D 划定做到什么程度、如何测量。A 是真实的项目信息，该放在项目管理工具里；C 有真实的激励价值——当各方对系统行为发生分歧时，裁决价值为零。"},
{d:6,m:0,qe:"Designing the pilot for a new AI workflow, which cohort choice yields the most decision-useful evidence?",qz:"为新 AI 工作流设计试点，哪种用户群选择能产出最有决策价值的证据？",oe:["A representative cross-section of real users with predefined success criteria and an exit decision date","The friendliest early adopters who volunteered enthusiastically","Your single largest customer, to maximize the value of a win","An open beta available to anyone interested"],oz:["有代表性的真实用户横截面 + 预设成功标准 + 明确的出口决策日期","最热情报名的友好早期用户","最大的单一客户——赢了价值最大","向所有感兴趣者开放的公开测试"],a:[0],re:"A — pilots exist to predict general rollout; representativeness plus predefined criteria makes the evidence transferable. B is the common real-world default and the classic bias: enthusiasts tolerate friction and inflate satisfaction. C concentrates risk on the relationship you least want to damage, and one account's workflow is not the population. D maximizes reach and destroys measurement — self-selected users, no controlled cohort, no clean read.",rz:"A——试点的存在意义是预测全面推广；代表性+预设标准让证据可迁移。B 是现实中最常见的默认，也是经典偏差：热心者容忍摩擦、抬高满意度；C 把风险压在你最不想伤害的关系上，且单一客户的工作流不代表总体；D 触达最大化、测量被摧毁——自选用户、无受控群组、读不出干净结论。"},
{d:7,m:0,qe:"Two upcoming Claude Code tasks: (1) a mechanical rename across 900 files; (2) restructuring the payment module's error handling. How should execution modes differ?",qz:"两个即将执行的 Claude Code 任务：（1）900 个文件的机械化重命名；（2）支付模块错误处理的结构重构。执行模式应如何区分？",oe:["Use plan mode for both since review never hurts","Run both headless since both are well-specified","Run the rename headless for throughput; use plan mode on the payment work so a human approves the approach first","Do the rename manually and let Claude Code handle the payment refactor autonomously"],oz:["两个都开 plan mode——多审总没坏处","两个都 headless——反正规格都写清楚了","重命名走 headless 追求吞吐；支付重构开 plan mode，先让人批准方案再动手","重命名手工做，支付重构交给 Claude Code 自主完成"],a:[2],re:"C — match oversight to risk: mechanical low-risk work runs unattended; high-blast-radius changes get human approval of the plan. A spends scarce review attention where it adds nothing, training reviewers to rubber-stamp. B treats specification clarity as risk equivalence — the payment module's failure cost is categorically different. D inverts the allocation: humans grinding mechanical work while the risky change runs autonomously.",rz:"C——按风险分配监督：机械低危工作无人值守地跑；爆炸半径大的变更先由人批准方案。A 把稀缺的审查注意力花在毫无增益处，训练出「盖章式」审查者；B 把「规格写得清楚」当成「风险等价」——支付模块的失败代价在量级上完全不同；D 把分配整个倒过来：人去磨机械活，高危变更反而自主放行。"},
{d:7,m:0,qe:"New developers should get the team's MCP servers working immediately after cloning, but secrets must never enter the repository and no extra tooling may be required. Mechanism?",qz:"新开发者 clone 仓库后应立即可用团队的 MCP 服务器，但机密绝不能进仓库，也不允许引入额外工具链。用什么机制？",oe:["Store tokens in a shared vault document that developers paste in during onboarding","Commit the config with secrets encrypted in-repo via a git encryption tool","Let each developer maintain a personal MCP configuration outside the repo","Commit the project-level MCP config with environment-variable placeholders; developers supply values via their local environment"],oz:["把令牌放在共享保险库文档里，入职时由开发者手动粘贴","用 git 加密工具把机密加密后随仓库提交","让每位开发者在仓库之外自行维护个人 MCP 配置","提交项目级 MCP 配置，密钥用环境变量占位符；开发者在本地环境中提供取值"],a:[3],re:"D — committed config with env placeholders delivers clone-and-go while secrets stay personal and out of history. A is a real onboarding pattern: manual, drift-prone, and the paste step invites secrets landing in the wrong files. B names real tooling (git-crypt/SOPS) — excluded by the stated no-extra-tooling constraint, and encrypted secrets in history still demand careful key ceremony. C avoids the secret problem by abandoning the shared, versioned config goal entirely.",rz:"D——提交的配置+环境变量占位符，实现 clone 即用，机密留在个人环境、不进历史。A 是真实的入职模式：手工、易漂移，且「粘贴」这个动作本身就在邀请机密落进错误的文件；B 点名的是真实工具（git-crypt/SOPS）——被题干「不引入额外工具链」排除，且历史中的加密机密仍需要谨慎的密钥仪式；C 用放弃「共享且版本化的配置」这一目标的方式回避了机密问题。"}
]},
{id:"III",ne:"Set III · Hard sprint",nz:"Set III · 高难冲刺卷",time:45,qs:[
{d:1,m:0,qe:"An evaluator-optimizer loop raised content quality 15% but averages 4 iterations per item; at full volume the cost is untenable. Preserve most of the gain while cutting most of the cost:",qz:"Evaluator-optimizer 循环把内容质量提升了 15%，但平均每条要迭代 4 轮；放到全量上成本不可接受。如何保住大部分收益、砍掉大部分成本？",oe:["Cap the loop at one iteration for every item","Confidence-gated routing: a light scorer screens outputs; only low-scoring or high-risk items enter the optimization loop","Reserve the loop for a random 20% sample of items","Batch the optimization iterations through the discounted async API"],oz:["把所有条目的迭代上限压到 1 轮","置信度门控路由：轻量评分器先筛，只有低分/高风险条目进入优化循环","随机抽 20% 的条目走优化循环","把优化迭代改走折扣异步批处理 API"],a:[1],re:"B — most items pass on the first try; gating spends iterations only where the scorer detects deficiency, keeping most of the 15% at a fraction of the cost. A is a real cost cap that hits every hard item equally — exactly the items needing multiple rounds lose the most. C cuts cost proportionally but selects blindly: 80% of deficient items ship unimproved. D is a genuine price lever when latency allows; it discounts the waste instead of eliminating it.",rz:"B——多数条目一次即过；门控只在评分器发现缺陷处花迭代，用一小部分成本保住大部分 15%。A 是真实的成本上限，但对所有难例一视同仁——恰恰是需要多轮的条目损失最大；C 成本按比例降，选择却是盲的：80% 有缺陷的条目原样出厂；D 是延迟允许时的真实价格杠杆——它给浪费打折，而不是消灭浪费。"},
{d:1,m:0,qe:"Two agents collaborate via a shared free-form scratchpad. Incidents show overwritten conclusions and decisions made on stale reads. The architectural fix:",qz:"两个 Agent 通过一块共享的自由读写便签协作。事故记录显示结论被互相覆盖、决策基于过期读取。架构级修复是：",oe:["Instruct both agents to re-read the scratchpad immediately before every write","Grow the scratchpad so entries are appended rather than overwritten","Replace shared mutable state with ownership: partitioned state per agent, explicit versioned messages between them (or an orchestrator merging)","Serialize all access through a locking mechanism on the scratchpad"],oz:["在提示中要求两个 Agent 每次写入前都立刻重读一遍便签","扩大便签容量，让内容以追加代替覆盖","取消共享可变状态，改为所有权模型：各自持有分区状态，交互走显式的带版本消息（或由编排者统一合并）","为便签加锁机制，把所有访问串行化"],a:[2],re:"C — this is a distributed-systems problem; ownership plus message passing removes the race by construction. A is check-then-act with a window still open between read and write — the same race, politely requested. B prevents overwrites but not stale reads, and unbounded append burns context while burying the current truth. D is a real concurrency tool: locks serialize access yet stale-read decisions persist, and lock discipline across LLM turns is fragile.",rz:"C——这是分布式系统问题；所有权+消息传递从构造上消灭竞态。A 是 check-then-act：读与写之间窗口依旧敞开——同一个竞态，只是被礼貌地请求了一下；B 防了覆盖防不了过期读取，无界追加还烧上下文、把「当前事实」埋进历史；D 是真实的并发工具：锁能串行化访问，但基于过期读的决策照旧，而且跨 LLM 轮次维持锁纪律非常脆弱。"},
{d:1,m:0,qe:"An agent pilot succeeded; scaling it 10x reveals unpredictable per-task cost (some tasks loop 40+ steps). Finance demands predictable unit economics. Architectural evolution?",qz:"Agent 试点成功；放大 10 倍后暴露出单任务成本不可预测（部分任务循环 40+ 步）。财务要求可预测的单位经济性。架构应如何演进？",oe:["Mine the transcripts for the stable majority paths, carve them into fixed workflows, and reserve the agent for the genuinely open-ended tail","Set a hard step budget per task and terminate at the cap","Negotiate committed-use pricing so cost per token drops","Fine-tune the model on successful transcripts to shorten trajectories"],oz:["从运行转录中挖出稳定多数路径，固化为固定工作流，Agent 只留给真正开放式的长尾","设定每任务硬性步数预算，到顶即终止","谈判承诺用量折扣，降低单 token 价格","用成功轨迹微调模型，让路径变短"],a:[0],re:"A — at scale, most agent traffic follows repeated patterns; converting them to workflows makes the majority deterministic in cost while agency survives where it earns its keep. B creates predictability by truncating exactly the tasks that need more steps — cost certainty purchased with failure. C lowers the price of unpredictability without reducing it; a real procurement lever, orthogonal to the architecture. D is a real optimization with real cost — trajectory-shortening is neither guaranteed nor a substitute for structural predictability.",rz:"A——规模化后多数 Agent 流量走的是重复模式；把它们固化为工作流，多数成本变为确定，自主性留在它真正创造价值的长尾。B 用截断「恰好需要更多步数的任务」来制造可预测——拿失败换确定性；C 降低了不可预测性的单价，却没减少不可预测性——真实的采购杠杆，与架构正交；D 是真实但有代价的优化——轨迹缩短既无保证，也替代不了结构性可预测。"},
{d:1,m:0,qe:"A travel agent completes flight, hotel, then payment; a run fails after payment succeeded but confirmation write failed. Users get charged with no booking. Correct pattern?",qz:"旅行 Agent 依次完成机票、酒店、支付；某次运行在支付成功后、确认写入失败时中断。用户被扣款却没有订单。正确的模式是？",oe:["Retry the whole flow from the beginning when any step fails","Wrap all four steps inside one atomic transaction","Alert operations to manually reconcile failed runs","Saga-style compensation: each step registers a compensating action (refund, release hold) executed on downstream failure, with idempotent retries"],oz:["任一步失败就从头重试整个流程","把四个步骤包进一个原子事务","失败运行告警给运维人工对账","Saga 补偿模式：每一步登记补偿动作（退款、释放占位），下游失败即执行补偿，重试保持幂等"],a:[3],re:"D — cross-system multi-step flows cannot be atomic; sagas make partial failure a designed state with an exit. A re-executes payment on retry — the double-charge amplifier, unless idempotency was designed in, which is the actual work D does. B is the correct instinct inside one database; airlines, hotels, and processors share no transaction coordinator. C is a real operational backstop that turns a design gap into permanent toil at scale.",rz:"D——跨系统多步流程做不到原子性；Saga 把部分失败变成有出口的设计内状态。A 重试会再次执行支付——双重扣款放大器，除非幂等已被设计好，而那正是 D 在做的工作；B 在单库内是正确直觉——航司、酒店、支付方之间不存在共享的事务协调者；C 是真实的运维兜底，会把设计缺口固化成规模化的重复劳动。"},
{d:2,m:0,qe:"A 60k-token stable knowledge base is cached, yet cache hit rate is near zero. Inspection finds the request template injects the current timestamp at the top of the system prompt. Explain and fix:",qz:"6 万 token 的稳定知识库已配置缓存，但命中率接近 0。检查发现请求模板会在系统提示最顶部注入当前时间戳。解释并修复：",oe:["The knowledge base exceeds the cacheable size limit — split it into two cached segments","Caching matches byte-stable prefixes; a changing first line invalidates everything after it — move volatile fields after the static blocks (or coarsen their granularity)","The TTL is too short for your traffic pattern — request a longer-lived cache","Timestamps are fine but the format is non-deterministic — standardize the format"],oz:["知识库超过了可缓存的大小上限——拆成两段分别缓存","缓存按字节级稳定前缀匹配；首行一变，其后全部失效——把易变字段移到静态区块之后（或粗化其粒度）","TTL 相对你的流量模式太短——申请更长的缓存存活期","时间戳没问题，是格式不确定——把格式标准化"],a:[1],re:"B — prefix matching is positional: the earliest changing byte poisons every subsequent token; volatile-last ordering (and per-hour rather than per-second granularity if the timestamp is needed early) restores hits. A misattributes: size limits would cap what caches, not zero out hits. C — TTL explains decay between sparse requests, not near-zero hits under active traffic. D standardizing format still changes the value every request; determinism of format is not stability of content.",rz:"B——前缀匹配是位置性的：最早变化的字节污染其后全部 token；易变内容后置（若确需时间戳，可把粒度粗化到小时级）即可恢复命中。A 归因错了：大小上限会限制「能缓存多少」，不会把命中清零；C——TTL 解释的是稀疏请求间的缓存衰减，解释不了活跃流量下的近零命中；D 把格式标准化后，值仍然每次请求都在变；格式确定≠内容稳定。"},
{d:2,m:0,qe:"Growing few-shot examples from 6 to 30 improved eval accuracy 0.4% while adding 9k tokens per request. The professional decision process is:",qz:"few-shot 示例从 6 个加到 30 个，评测准确率只提升 0.4%，每请求却多花 9k token。专业的决策过程是：",oe:["Keep all 30 since any accuracy gain compounds at scale","Cut to zero examples since the marginal value has clearly collapsed","Measure the accuracy-per-token curve, find the knee, and keep the smallest diverse set near it — reallocating context budget to higher-value content","Move the examples into the cached prefix so their cost stops mattering"],oz:["30 个全留——任何准确率提升在规模化后都会复利","裁到零示例——边际价值显然已经崩塌","测出「准确率-token」曲线，找到拐点，保留拐点附近最小且多样的示例集——把上下文预算重配给更高价值的内容","把示例挪进缓存前缀，让它们的成本不再重要"],a:[2],re:"C — curve, knee, smallest diverse set: the decision is empirical, and context is an opportunity-cost budget. A misapplies compounding: 0.4% may be inside eval noise, while the token cost is real on every request. B overcorrects from diminishing marginal value to zero total value — the first few examples carried most of the gain. D is a real cost mitigation that leaves latency, context ceiling, and attention dilution untouched; cached tokens still occupy the window.",rz:"C——曲线、拐点、最小多样集：这是个经验性决策，而上下文是有机会成本的预算。A 错用了复利：0.4% 可能就在评测噪声带内，而 token 成本每次请求都真实发生；B 从「边际价值递减」过度修正到「总价值为零」——最初几个示例贡献了大部分收益；D 是真实的成本缓解，但延迟、上下文上限、注意力稀释一个都没解决；缓存的 token 依然占据窗口。"},
{d:3,m:0,qe:"Retrieval metrics: recall@20 is 96% (right passage almost always in the top 20), but the model receives top-5 and answer quality is poor. The missing component is:",qz:"检索指标：recall@20 达 96%（正确段落几乎总在前 20），但供给模型的是 top-5，答案质量差。缺的组件是：",oe:["A reranker that reorders the top-20 candidates so the right passages reach the top-5 window","A stronger embedding model to improve first-stage retrieval","Expanding the supply window from top-5 to top-20","Query expansion to diversify the candidate pool"],oz:["Re-ranker：对 top-20 候选重排，让正确段落进入 top-5 供给窗口","更强的 embedding 模型，提升第一段检索","把供给窗口从 top-5 直接扩到 top-20","查询扩展，让候选池更多样"],a:[0],re:"A — the diagnosis is precise: candidates are recalled but misordered; reranking is the component built for exactly this gap. B strengthens a stage already performing at 96% — spend where the failure is. C is a real workaround that feeds 4x more tokens, adds distractor passages, and degrades grounding — treating a ranking problem as a bandwidth problem. D diversifies recall, which was never the deficient property.",rz:"A——诊断已经很精确：候选被召回了，只是排序不对；精排正是为这个缺口而生的组件。B 强化的是一个已经做到 96% 的阶段——钱要花在失败发生处；C 是真实的绕法，但供给 token 翻 4 倍、混入干扰段落、劣化 grounding——把排序问题当带宽问题治；D 让召回更多样，而多样性从来不是短板。"},
{d:3,m:0,qe:"Contract chunks are dense with anaphora (the Company, said Agreement, such date); retrieval frequently surfaces passages about the wrong party. Embedding-side remedy?",qz:"合同文本块里充满指代（「本公司」「该协议」「上述日期」）；检索经常召回讲错主体的段落。嵌入侧的对症补救是？",oe:["Increase chunk overlap so referents appear alongside their pronouns more often","Contextual retrieval: prepend each chunk with a short generated summary of its document and section before embedding, so referents resolve","Add a keyword index over party names as a hybrid signal","Instruct the answering model to double-check party identity before responding"],oz:["加大块间重叠，让先行词更常与代词同块出现","Contextual retrieval：嵌入前为每个块前置一段所属文档/章节的简短生成摘要，让指代得以消解","为主体名称建关键词索引，作为 hybrid 信号","要求作答模型在回复前二次核对主体身份"],a:[1],re:"B — the chunk embeds without knowing whose contract it belongs to; prepended context injects the identity into the vector itself. A helps borderline cases probabilistically but referents defined pages earlier stay unresolved regardless of overlap. C is real and useful when queries contain party names — it does not fix the vectors, and generic queries still mismatch. D operates after retrieval already surfaced the wrong party's clauses; the model verifies against the wrong evidence.",rz:"B——文本块在嵌入时并不知道自己属于谁的合同；前置上下文把主体身份注入向量本身。A 对临界情况有概率性帮助，但几页之前定义的先行词无论怎么重叠都解不了；C 在查询里含主体名时真实有用——但它修不了向量，泛化查询照样错配；D 发生在检索已经召回错误主体条款之后；模型是在对着错误证据做核对。"},
{d:3,m:2,qe:"(Select 2) A multi-tenant gateway calls downstream services with its own powerful credential on behalf of tenants; a crafted request just read another tenant's data (confused deputy). Which two changes fix the class of vulnerability?",qz:"（多选，选2项）多租户网关用自己的高权凭证代表租户调用下游服务；一次构造请求刚刚读到了别家租户的数据（confused deputy）。哪两项改动能修复这一类漏洞？",oe:["Per-request token exchange: the gateway trades the caller's identity for a downstream token scoped to that tenant","Short-lived, audience-restricted downstream tokens that each service validates","Enforce TLS on every hop between gateway and services","Rotate the gateway's master credential on a tighter schedule"],oz:["请求级令牌交换：网关用调用方身份换取限定该租户范围的下游令牌","短时效、受众（audience）受限的下游令牌，且每个服务各自校验","网关与服务间每一跳强制 TLS","更高频地轮换网关的主凭证"],a:[0,1],re:"The deputy is confused because downstream sees one omnipotent identity; A restores per-tenant identity per request, B makes tokens unusable outside their intended audience and window. C secures the channel — the legitimate channel was used in the attack. D shortens the life of a credential that remains omnipotent while alive.",rz:"代理人之所以「混淆」，是因为下游只看到一个全能身份；A 让每次请求恢复租户级身份，B 让令牌出了预期受众与时窗即失效。C 保护的是信道——攻击走的恰是合法信道；D 缩短的是一个「活着时依旧全能」的凭证的寿命。"},
{d:3,m:0,qe:"A third-party MCP server marks its tools readOnlyHint: true. Your security team asks whether agents may therefore call them without restriction. Correct position?",qz:"某第三方 MCP 服务器给自家工具标注了 readOnlyHint: true。安全团队问：是否因此可以让 Agent 不受限制地调用它们？正确立场是？",oe:["Yes for read-only tools, since the protocol guarantees the hint's accuracy","Yes if the server is fetched over TLS from the vendor's official registry","No third-party MCP servers should be used in any environment","Annotations are the server's self-declaration, not an enforced boundary — apply your own policy controls and verify actual behavior before trusting"],oz:["可以：协议保证了只读注解的准确性","可以：只要通过 TLS 从官方注册表获取该服务器","任何环境都不应使用第三方 MCP 服务器","注解是服务方的自我声明，不是被强制执行的边界——先套用自己的策略控制并验证实际行为，再谈信任"],a:[3],re:"D — hints are metadata supplied by the party you are deciding whether to trust; enforcement must live client-side, with behavioral verification for anything sensitive. A misstates the protocol: hints are advisory by design, nothing validates them. B authenticates provenance and transport — a real supply-chain control that says nothing about what the code does. C is a real posture for high-security enclaves, but as a general answer it discards the ecosystem instead of governing it.",rz:"D——hint 是「你正在决定是否信任的那一方」提供的元数据；强制力必须在客户端一侧，敏感场景还要做行为验证。A 说错了协议：hint 在设计上就是建议性的，没有任何机制校验它；B 认证的是来源与传输——真实的供应链控制，但对「代码实际做什么」一言不发；C 是高安环境的真实姿态，作为一般答案它是抛弃生态而不是治理生态。"},
{d:4,m:2,qe:"(Select 2) After three months of tuning against the same frozen eval set, offline scores rose 12 points while production quality is flat. Which two changes restore the eval's meaning?",qz:"（多选，选2项）对着同一套冻结评测集调了三个月，离线分涨了 12 分，线上质量纹丝不动。哪两项改动能恢复评测的意义？",oe:["Enlarge the existing frozen set with more items of the same vintage","Raise the pass threshold so the suite is harder to satisfy","Maintain a held-out set that is never used for tuning decisions, rotated periodically","Continuously sample fresh production cases into the evaluation pool"],oz:["把现有冻结集扩充更多「同一年代」的题目","抬高通过阈值，让套件更难被满足","维护一套从不用于调优决策的保留集（holdout），并定期轮换","持续从生产流量采样新鲜案例进评测池"],a:[2,3],re:"Twelve offline points with flat production is Goodhart in action: the team optimized the artifact, not the ability. C restores an untouched yardstick; D keeps the eval anchored to today's distribution. A adds more of what is already overfit to. B makes an invalid measure harder to pass — rigor applied to the wrong instrument.",rz:"离线涨 12 分、线上纹丝不动，就是活生生的 Goodhart：团队优化的是那件测量工具，不是能力本身。C 恢复一把未被污染的尺子；D 让评测锚定在今天的分布上。A 往已被过拟合的东西里加更多同款；B 让一个失效的度量「更难通过」——把严格用在了错误的仪器上。"},

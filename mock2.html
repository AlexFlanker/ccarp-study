{d:4,m:0,qe:"An A/B test shows the new prompt winning 52% of pairwise comparisons after 180 samples. The PM wants to declare victory. Statistically sound reading?",qz:"A/B 显示新 prompt 在 180 个成对比较中胜率 52%。产品经理想宣布获胜。统计上站得住的解读是？",oe:["A 2-point edge at n=180 is well within noise; run a power analysis for the detectable effect size and collect accordingly before deciding","The lead is real but small — ship it since any improvement counts","Extend the test by one more week and decide on whichever side leads then","Declare victory: 52% beats 50% and the sample exceeds 100"],oz:["n=180 时 2 个点的领先完全在噪声带内；先做功效分析确定可检测效应量，按需收集样本再决策","领先虽小但是真实的——有提升就该上","再延长一周，届时谁领先就选谁","可以宣布获胜：52% 大于 50%，样本也超过了 100"],a:[0],re:"A — the confidence interval on 52% at n=180 spans 50% comfortably; power analysis tells you what sample the decision actually needs. B assumes the direction is signal; at this n, direction is a coin still spinning. C adds time without a stopping rule — the same noise will wander across 50% repeatedly. D applies folk thresholds; sample size adequacy depends on effect size, not on a round number.",rz:"A——n=180 时 52% 的置信区间从容地横跨 50%；功效分析告诉你这个决策实际需要多少样本。B 把方向当成了信号；这个样本量下，方向是一枚还在旋转的硬币；C 加时间不加停止规则——同样的噪声会在 50% 两侧反复游走；D 用的是民间阈值；样本量是否充足取决于效应量，不取决于某个整数。"},
{d:4,m:0,qe:"Monthly quality tracking became incomparable: the LLM judge is set to always use the provider's latest model, which updated twice this quarter. Fix the measurement system:",qz:"月度质量追踪失去了可比性：LLM judge 被配置为始终使用服务商最新模型，而本季度它更新了两次。如何修好这套测量系统？",oe:["Keep using the latest judge since newer models evaluate more accurately","Average scores from the old and new judges during transition months","Pin the judge to a specific model version; when intentionally upgrading, re-score a reference set to re-baseline before comparing across the boundary","Switch to human review for all monthly scoring"],oz:["继续用最新 judge——新模型评得更准","过渡月份取新旧 judge 分数的平均值","把 judge 锁定到特定模型版本；确需升级时，先在参照集上重跑、重建基线，再做跨界比较","月度打分全部改为人工评审"],a:[2],re:"C — a measuring instrument must hold still while the measured thing changes; version pinning plus deliberate re-baselining preserves comparability across upgrades. A optimizes judge quality while destroying the time series — accuracy of an instrument is useless if the instrument keeps changing mid-experiment. B averages two different scales into a number on neither. D is the gold standard priced out of monthly full-volume use; the fix for drift is stabilization, not abandonment.",rz:"C——被测对象在变，测量仪器就必须稳住；版本锁定+有意升级时在参照集上重建基线，跨界仍可比。A 优化了 judge 的质量，毁掉了时间序列——实验中途不断更换的仪器，再准也没用；B 把两把不同的尺子平均成一个哪把尺都不属于的数；D 是被月度全量成本劝退的金标准；漂移的解法是把仪器稳定下来，不是把它扔掉。"},
{d:5,m:0,qe:"High-risk actions require human approval; approvers now face 400 requests daily and approve 99.7% within seconds. The control has decayed. Redesign?",qz:"高危动作需人工审批；审批人现在每天面对 400 条请求，99.7% 在数秒内点过。这道控制已经失效。如何重设计？",oe:["Add a second approver so every request needs two sign-offs","Introduce a mandatory 60-second review timer per request","Rotate approvers weekly to keep attention fresh","Re-tier by risk: automate the low-risk bulk with post-hoc sampling audits, batch similar mid-risk items, and reserve mandatory slow review for the genuinely high-risk few"],oz:["增加第二审批人，每条请求双人会签","每条请求强制 60 秒最短审看时间","审批人每周轮换，保持注意力新鲜","按风险重新分层：低危大头自动化+事后抽样审计，中危同类合并呈批，真正高危的少数保留强制性慢审"],a:[3],re:"D — a 99.7% seconds-fast approval rate means the queue is mostly noise; tiering returns human attention to the few decisions that deserve it. A doubles the cost of rubber-stamping: two tired signatures on the same unread request. B manufactures friction, not scrutiny — people wait 60 seconds and click the same button. C is a real freshness tactic for vigilance decay, but 400 daily requests will exhaust any rotation.",rz:"D——99.7% 秒批意味着队列里绝大多数是噪声；分层把人的注意力还给少数配得上它的决策。A 让盖章的成本翻倍：同一条没被读过的请求上多了一个疲惫的签名；B 制造的是摩擦不是审视——人们等完 60 秒点的还是同一个按钮；C 是对警觉衰减的真实换防战术，但每天 400 条会耗尽任何轮换。"},
{d:5,m:0,qe:"Your EU customers' data is processed through a US-region subprocessor that your DPA never mentions. Legal exposure and fix?",qz:"欧盟客户的数据经由一家美国区域的子处理商处理，而你的 DPA 从未提及此事。法律暴露与修复是？",oe:["Encrypt the data in transit to the US so the transfer becomes compliant","Cross-border transfer without safeguards plus subprocessor transparency failure: map data flows, pin EU-region processing or implement valid transfer mechanisms (e.g., SCCs), and update the DPA disclosures","Anonymize logs after processing so no personal data is retained abroad","Add a consent checkbox at signup covering international processing"],oz:["对传往美国的数据做传输加密，让传输合规","无保障的跨境传输+子处理商披露缺失：梳理数据流、锁定欧盟区域处理或落实有效传输机制（如 SCC），并更新 DPA 披露","处理完成后对日志匿名化，境外不留个人数据","注册时增加一个覆盖国际处理的同意勾选框"],a:[1],re:"B — two distinct violations need structural remedies: lawful transfer mechanics and honest subprocessor disclosure. A protects data in motion; GDPR governs where and under what safeguards processing happens, not just channel security. C addresses residue after the unlawful processing already occurred abroad. D — consent for cross-border transfers is a fragile, revocable basis and does not cure the disclosure failure; real lawyers reach for it last, not first.",rz:"B——两个独立的违规需要结构性补救：合法的传输机制+诚实的子处理商披露。A 保护的是传输中的数据；GDPR 管的是「处理发生在哪里、在什么保障下」，不只是信道安全；C 处理的是「违法处理已在境外发生之后」的残留；D——以同意作为跨境传输依据既脆弱又可随时撤回，也治不了披露缺失；真正的法务把它排在最后，不是最前。"},
{d:5,m:2,qe:"(Select 2) Which two items belong in the incident playbook for a production AI agent, prepared before launch?",qz:"（多选，选2项）生产 AI Agent 的事故手册（上线前就要备好）应包含哪两项？",oe:["A tested deactivation path: kill switch or capability flags with named owners authorized to pull them","A blameless postmortem template for use after resolution","A technical-debt backlog of components to refactor","A communication decision tree: who informs which customers and regulators, with pre-drafted templates"],oz:["经过演练的停用路径：kill switch/能力开关，及被授权执行的具名负责人","事故解决后使用的免责复盘模板","待重构组件的技术债清单","沟通决策树：由谁通知哪些客户与监管方，附预先起草的模板"],a:[0,3],re:"During an incident you need to stop the harm (A) and manage the disclosure (D) — both fail if improvised. B is a genuinely valuable practice for after resolution; putting it in the live playbook confuses response with retrospection. C is real engineering hygiene on a different timescale entirely.",rz:"事故进行中你需要止损（A）和管理对外披露（D）——两者一旦临场即兴都会失败。B 是真实且宝贵的实践，但属于解决之后；把它放进临战手册是把响应与回顾混为一谈；C 是完全另一个时间尺度上的真实工程卫生。"},
{d:5,m:0,qe:"Before launch, the release gate must cover safety measurably. Which formulation is actually operational?",qz:"上线前，发布门禁必须把「安全」变成可测量项。哪种表述真正可操作？",oe:["The security team reviews the system and signs off that it feels ready","The model vendor's safety documentation is on file and current","Defined thresholds on an adversarial suite: jailbreak success below X%, 100% block rate on the exfiltration red-team corpus, all high-risk tools behind approval — measured on every release candidate","No security incidents were observed during the beta period"],oz:["安全团队评审系统并签字确认「感觉可以上了」","模型供应商的安全文档已归档且为最新","对抗套件上的明确阈值：越狱成功率低于 X%、外泄红队用例 100% 拦截、高危工具全部走审批——每个候选版本都测","Beta 期间未观察到任何安全事件"],a:[2],re:"C — a gate is a measurement with a threshold, run on every candidate; anything else is ceremony. A contains real expertise expressed unfalsifiably — feels ready cannot be regression-tested. B documents the vendor's diligence about their model, not your system's behavior with your tools and data. D is survivorship evidence: absence of observed incidents under friendly beta traffic bounds nothing about adversarial conditions.",rz:"C——门禁=带阈值的测量，且每个候选版本都要跑；除此之外都是仪式。A 里有真实的专业性，却以不可证伪的方式表达——「感觉可以」没法做回归测试；B 记录的是供应商对其模型的尽职，不是你的系统带着你的工具和数据的行为；D 是幸存者证据：友好流量下「没观察到事件」对对抗条件不构成任何上界。"},
{d:6,m:0,qe:"The CEO saw a launch keynote and wants the flagship model swapped in this quarter. Your task-level evals show the current model equal or better on your workloads at 40% lower cost. The architect's strongest play:",qz:"CEO 看了发布会主旨演讲，要求本季度换上那款旗舰模型。你的任务级评测显示：现有模型在你们的负载上持平或更好，成本还低 40%。架构师最有力的打法是：",oe:["Present the task-level comparison (quality, cost, latency) with two live examples, recommend staying, and commit the new model to a quarterly re-evaluation list — recorded in an ADR","Switch as directed and monitor for regressions","Run the swap as a 50/50 production A/B for a quarter and let the data decide","Decline the request, citing the evaluation results"],oz:["呈上任务级对比（质量/成本/延迟）+两个现场实例，建议维持现状，并把新模型列入季度复评清单——以 ADR 记录","照办切换，上线后监控回归","把切换做成 50/50 生产 A/B 跑一个季度，让数据说话","援引评测结果，直接拒绝该要求"],a:[0],re:"A — evidence plus a face-saving path: the re-evaluation list honors the executive's interest while the ADR records why not now. B abandons the architect's evidentiary duty; monitoring finds regressions after customers do. C sounds rigorous but spends a quarter of production traffic and integration cost re-answering a question your evals already answered. D may be factually right and politically final — a no with no path forward converts a data conversation into a power conversation.",rz:"A——证据+台阶：季度复评清单尊重高管的关注，ADR 记下「为何此刻不换」。B 放弃了架构师的呈证职责；监控发现回归时客户已先发现；C 听着严谨，实则花一个季度的生产流量与集成成本，去重答一个评测已经答过的问题；D 事实上可能对、政治上是终局——没有出路的「不」，会把一场数据对话变成一场权力对话。"},
{d:6,m:0,qe:"A four-hour outage breached a customer's SLA last night. Their leadership is furious. The postmortem communication that rebuilds trust contains:",qz:"昨夜四小时故障导致某客户 SLA 违约，对方高层震怒。能重建信任的复盘沟通应包含：",oe:["An explanation that the root cause was the upstream model provider's degradation","A goodwill service credit exceeding the contractual requirement","Assurance that the team has been reminded to be more careful","A blameless factual timeline, root cause, why existing safeguards missed it, corrective actions with dates, and the compensation per contract — delivered proactively"],oz:["说明根因是上游模型服务商的服务劣化","超出合同要求的善意服务抵扣","保证团队已被提醒要更加小心","无指责的事实时间线、根因、现有防线为何漏过、带日期的整改项、按合同的补偿——主动送达"],a:[3],re:"D — trust rebuilds on transparency plus verifiable commitments; the why-safeguards-missed-it section is what distinguishes learning from apology. A may be factually true and remains your accountability — customers bought your SLA, not your vendor chain. B is a real goodwill gesture that, alone, prices the outage instead of preventing the next one. C promises vigilance, the one corrective that decays by next quarter.",rz:"D——信任靠透明+可验证的承诺重建；「防线为何漏过」那一节是学习与道歉的分水岭。A 可能属实，但责任仍是你的——客户买的是你的 SLA，不是你的供应链；B 是真实的善意，但单独使用等于给故障定价，而不是防止下一次；C 承诺的是「警觉」——所有整改项里衰减得最快的那种。"},
{d:6,m:0,qe:"Ops signed the handoff receipt; two weeks later the first incident still escalated straight back to the build team. What was missing from the handoff?",qz:"运维已在交接单上签收；两周后第一起事故仍然直接升级回了研发团队。交接缺了什么？",oe:["A more detailed runbook with screenshots for every procedure","Verified capability transfer: a shadow on-call rotation with the build team backing, and a game-day drill proving ops can execute the runbook alone","A recorded architecture walkthrough for asynchronous reference","A stricter SLA on ops response times"],oz:["一份更详细、每步都带截图的 runbook","经过验证的能力转移：研发陪跑的影子值班轮换+故障演练（game day），证明运维能独立跑通 runbook","一段可供异步查阅的架构讲解录像","对运维响应时效定更严格的 SLA"],a:[1],re:"B — handoff completes when the receiving team demonstrates independent execution under realistic pressure; documents transfer information, drills transfer capability. A and C improve the material without testing whether anyone can act on it at 3 a.m. D holds ops accountable for a capability nobody verified they received — stricter targets do not create competence.",rz:"B——交接的完成标准是接收方在真实压力下演示过独立处置；文档转移的是信息，演练转移的才是能力。A、C 改进的是材料，却没检验有没有人能在凌晨三点据此行动；D 用更严的指标去追责一项从未被验证已经交付的能力——收紧目标不会长出胜任力。"},
{d:7,m:0,qe:"Security wants outbound-network tools disabled by default across the whole org's Claude Code fleet; three platform teams have a legitimate need. Governance mechanism?",qz:"安全团队要求全组织的 Claude Code 默认禁用出站网络类工具；但三个平台团队有正当使用需求。治理机制？",oe:["Grant senior engineers discretion to enable the tools when they judge it safe","Enable org-wide but add monitoring and alerts on outbound calls","Centrally managed policy sets the default-off baseline; exceptions are declared in the three repos' committed configuration, approved via PR review and auditable","Keep the tools disabled for everyone until a quarterly security review"],oz:["授权资深工程师自行判断安全时启用","全组织开启，但对出站调用加监控与告警","集中管控策略设定默认禁用基线；例外由三个仓库在其提交的配置中声明，经 PR 评审批准、全程可审计","对所有人保持禁用，等季度安全评审再议"],a:[2],re:"C — default-safe with a governed, auditable exception path: security gets its baseline, the three teams get their tools, and every deviation has a review trail. A is trust-based governance that leaves no audit trail and scales exactly as far as individual judgment does. B inverts the control: everything allowed, violations noticed afterward — monitoring is evidence collection, not prevention. D achieves safety by blocking legitimate work for a quarter; a pause pretending to be a policy.",rz:"C——默认安全+受治理、可审计的例外通道：安全团队拿到基线，三个团队拿到工具，每个偏离都有评审痕迹。A 是基于信任的治理：不留审计痕迹，可扩展性止步于个人判断力；B 把控制反转了：先全放行、事后再发现——监控是取证不是预防；D 用封锁正当工作一个季度的方式实现安全；那是伪装成政策的暂停键。"}
]}
,
{id:"IV",ne:"Set IV · Exam-style (craft-calibrated)",nz:"Set IV · 全真Ⅱ（实考工艺校准）",time:120,qs:[
{d:1,m:0,qe:"A utility receives up to 30,000 outage reports on a storm day. Every report follows identical steps: parse the message, geocode the location, classify severity, create a dispatch ticket. The regulator audits individual classifications. Which architecture fits?",qz:"某电力公司风暴日单日接收多达 3 万条停电报告。每条报告步骤完全相同：解析消息、地理编码、severity 分级、生成派工单。监管机构会审计单条分级记录。哪种架构合适？",oe:["An autonomous agent that plans each report's handling from context","A fixed workflow of discrete, sequenced processing steps","A multi-agent design with reporter, dispatcher, and audit agents","One combined prompt that processes batches of 50 reports per call"],oz:["自主 Agent：按上下文为每条报告自行规划处理","固定工作流：离散的按序处理步骤","多 Agent 设计：报告、派工、审计三个代理","合并提示：每次调用批量处理 50 条报告"],a:[1],re:"Identical, auditable steps at volume are the fixed-workflow case. Why not: A adds planning variance where none is needed; C pays coordination overhead without distinct specialisms; D couples failures across a batch and blurs per-report audit.",rz:"步骤完全一致、量大、且需逐条审计——固定工作流的标准场景。其余：A 在不需要之处引入规划方差；C 没有真正的专业分工却要付协调开销；D 把 50 条的失败耦合在一起，还模糊了单条审计。"},
{d:1,m:0,qe:"An airline assistant rebooks passengers during disruptions. The right action depends on seat availability, fare rules, and hotel caps that are only discovered by querying systems mid-task, and each finding changes what to check next. Which pattern fits?",qz:"航空公司助手在航变期间为旅客改签。正确动作取决于座位余量、票规、酒店限额——这些只有在任务中途查询系统才能获知，且每个结果都会改变下一步该查什么。哪种模式契合？",oe:["A router dispatching each case to one of six rebooking templates","A fixed pipeline covering the most common disruption cases","Parallel evaluation of every rebooking option for every passenger","An agent that plans, queries systems, and adapts to each result"],oz:["路由器：把每个案例分发到六套改签模板之一","固定管线：覆盖最常见的航变情形","并行评估：为每位旅客枚举全部改签选项","Agent：规划、查询系统、并依每个结果调整下一步"],a:[3],re:"The path emerges from live lookups — the defining agent-loop signal. Why not: A and B both assume the path can be enumerated in advance; C explodes cost and still cannot react to what the queries reveal.",rz:"路径由实时查询逐步显现——正是 Agent 循环的判定信号。其余：A、B 都假设路径可事先枚举；C 成本爆炸，而且照样无法对查询结果做出反应。"},
{d:1,m:0,qe:"A game studio's QA prompt checks 30-page design docs for lore consistency, balance numbers, and tone in one call. Items get skipped and findings are shallow; the prompt has been reworded twice. What is the most effective next step?",qz:"游戏工作室的 QA prompt 用单次调用检查 30 页设计文档的世界观一致性、数值平衡与文风。存在跳项、结论浅的问题；提示词已改写两次。最有效的下一步？",oe:["Split into sequenced checks that pass structured findings forward","Feed the document twice so every section is seen","Fine-tune on past QA reports to internalise the standards","Move to the largest model with a maximum thinking budget"],oz:["拆成按序检查项，逐段传递结构化结论","把文档喂两遍，确保每节都被看到","用历史 QA 报告微调，让标准内化","换最大模型并给满 thinking 预算"],a:[0],re:"Skipped items and shallow findings on a long multi-part task is a decomposition signature. Why not: B repetition is not structure; C bakes in style, not coverage; D more capacity does not create the missing structure.",rz:"长多段任务上的跳项与浅结论是典型的「缺分解」特征。其余：B 重复不等于结构；C 内化的是文风、不是覆盖度；D 容量补不了结构缺失。"},
{d:1,m:0,qe:"A pharma team monitors literature for drug-safety signals. Which registries, journals, and trial databases matter varies by drug and emerges during the search itself. Which architecture matches?",qz:"药企团队监测文献中的药物安全信号。该查哪些注册库、期刊、试验数据库因药而异，且是在检索过程中才逐步显现的。哪种架构匹配？",oe:["A fixed weekly pipeline over a curated journal list","A single long-context call over all pre-fetched sources","A lead model spawning and aggregating dynamic research subtasks","Per-journal routers feeding specialised summarisers"],oz:["固定周更管线，跑一份精选期刊清单","单次长上下文调用，覆盖全部预取来源","主模型动态派生并汇总研究子任务","按期刊路由到各专门摘要器"],a:[2],re:"Unknowable, emergent subtasks are the orchestrator-workers case. Why not: A a curated list misses exactly the emergent sources; B assumes fetching is done when fetching is the task; D routing assumes categories are known up front.",rz:"子任务不可预知、检索中涌现——orchestrator-workers 的场景。其余：A 精选清单漏掉的恰是涌现的来源；B 假设取材已完成，而取材本身就是任务；D 路由假设类别事先已知。"},
{d:1,m:0,qe:"A hotel group has nine candidate AI use cases, from a concierge FAQ (high volume, measured baseline, recoverable errors) to a revenue-pricing engine (highest stakes). Which pilot maximises credible, expandable learning?",qz:"酒店集团有九个候选 AI 用例：从礼宾 FAQ（高频、有实测基线、错误可恢复）到收益定价引擎（风险最高）。选哪个试点能最大化可信、可扩展的学习？",oe:["The revenue-pricing engine, where the impact is largest","The use case with a measured baseline and recoverable errors","The CEO's personal suggestion, to guarantee sponsorship","All nine at once, to learn fastest across the portfolio"],oz:["收益定价引擎——影响最大","有实测基线且错误可恢复的用例","CEO 点名的那个——保证高层背书","九个同时上——组合学习最快"],a:[1],re:"Pilots exist to prove measurable value at bounded risk. Why not: A pairs the highest stakes with the least experience; C sponsorship is not evidence; D dilutes focus and confounds every lesson.",rz:"试点的意义是在有界风险下证明可测量的价值。其余：A 把最高风险和最少经验配成一对；C 背书不是证据；D 稀释兵力，九个变量搅在一起什么也学不清。"},
{d:1,m:0,qe:"An agricultural co-op wants Claude to answer member questions using commodity prices and weather that change daily. How should the model access this data?",qz:"农业合作社想让 Claude 用每日变化的大宗商品价格和天气数据回答成员问题。模型应如何获取这些数据？",oe:["Fine-tune quarterly on the latest price sheets","Add a disclaimer that answers may be out of date","Include the full price tables in every request","Retrieve from live price and weather feeds per query"],oz:["每季度用最新价格表微调一次","加免责声明：答案可能过期","每次请求都带上完整价格表","每次查询从实时价格与天气源检索"],a:[3],re:"Daily-changing facts are the canonical retrieval case. Why not: A is stale within days of each cycle; B accepts wrong answers instead of preventing them; C snapshots still go stale intraday and cost scales with table size.",rz:"每日变化的事实数据是检索增强的教科书场景。其余：A 每轮微调几天内就过期；B 是接受错误而不是防止错误；C 快照当天内照样过期，成本还随表格规模上涨。"},
{d:1,m:0,qe:"A warranty-claims agent has 28 tools across five domains. Selection accuracy fell from 96% to 81% as domains were added; two more domains are planned. What is the strongest recommendation?",qz:"保修理赔代理挂着横跨五个域的 28 个工具。随着域的增加，工具选择准确率从 96% 跌到 81%；还计划再加两个域。最有力的建议？",oe:["Freeze the tool count and decline the two new domains","Rewrite all 28 tool descriptions with usage examples","Split into domain agents behind a router","Adopt a larger model to absorb the added breadth"],oz:["冻结工具数量，拒绝新增两个域","为 28 个工具全部重写描述并补使用示例","拆分为路由器后面的领域专用代理","换更大的模型来消化增加的广度"],a:[2],re:"Accuracy declining as breadth grows marks an overloaded single agent; domain agents behind a router restore focus and make growth additive. Why not: A blocks the business need; B helps at the margin but not the structure; D pays more to meet the same ceiling later.",rz:"随广度增长而下滑的准确率标志单代理过载；路由+领域代理恢复聚焦，让增长变成加法。其余：A 挡住业务需求；B 只在边际上有效、动不了结构；D 花更多的钱，晚一点撞上同一块天花板。"},
{d:1,m:0,qe:"A customs-declaration triage system has run for four months. Dashboards track latency and spend, but nobody can say whether its risk classifications are right in production. What closes this gap?",qz:"报关分诊系统已运行四个月。看板追踪延迟与开销，但没人说得出它在生产中的风险分级到底对不对。什么能补上这个缺口？",oe:["Route sampled outputs and broker corrections into a labelled evaluation set","Add per-declaration cost attribution to the dashboards","Review the system prompt monthly against new regulations","Alert when daily volumes deviate from seasonal norms"],oz:["把抽样输出与报关员的纠错导入带标注的评测集","在看板上增加按单据的成本归因","每月对照新法规复查一次系统提示","日单量偏离季节常态即告警"],a:[0],re:"The missing element is the feedback stage: production correctness signals flowing into evaluable data. Why not: B attributes cost, not correctness; C reviews configuration, not outcomes; D watches volume, not quality.",rz:"缺的是反馈级：生产中的正确性信号回流为可评测数据。其余：B 归因的是成本不是正确性；C 复查的是配置不是结果；D 盯的是量不是质。"},
{d:1,m:2,qe:"(Select TWO) A fixed workflow has served a process well for a year. Which TWO observations most strongly signal it should be redesigned around an agent?",qz:"（多选，选2项）某固定工作流稳定服务了一年。哪两个观察最强烈地预示它应当重构为 Agent 架构？",oe:["A growing share of requests exits into exception handling the sequence never anticipated","Request volume has doubled quarter over quarter","Later steps increasingly depend on what earlier steps reveal at runtime","Budget now allows a more ambitious architecture","Industry publications describe agents as the direction of travel"],oz:["越来越多请求落入序列从未预想的异常处理分支","请求量逐季翻倍","后续步骤越来越依赖前序步骤在运行时揭示的内容","预算现在允许更有野心的架构","行业刊物把 Agent 描述为大势所趋"],a:[0,2],re:"Workflows crack when paths stop being enumerable and steps become interdependent at runtime. Why not: B is a scaling concern any pattern can absorb; D and E are resources and fashion — neither is a property of the problem.",rz:"当路径不再可枚举、步骤在运行时相互依赖，工作流就到极限了。其余：B 是任何模式都能吸收的扩容问题；D、E 是资源与风潮——都不是问题本身的属性。"},
{d:1,m:2,qe:"(Select TWO) Which TWO benefits does decomposing a monolithic prompt into sequenced stages actually deliver?",qz:"（多选，选2项）把单体 prompt 分解为按序阶段，实际能带来哪两项收益？",oe:["A guaranteed reduction in total token spend","Per-stage evaluation that localises failures to a specific step","Elimination of hallucination risk across the pipeline","No further need for prompt iteration once stages are set","Stages independently sized to different models and tools"],oz:["总 token 开销必然下降","阶段级评测：把失败定位到具体一步","流水线中的幻觉风险被消除","阶段定型后不再需要提示词迭代","各阶段可独立配不同的模型与工具"],a:[1,4],re:"Decomposition buys observability and right-sizing. Why not: A totals often rise slightly with per-stage overhead; C no structure eliminates hallucination; D stages still need iteration — just better-targeted iteration.",rz:"分解买到的是可观测性与按需配型。其余：A 总量常因阶段开销略升；C 没有任何结构能消除幻觉；D 阶段照样要迭代——只是迭代得更有靶子。"},
{d:1,k:"x",qe:"For each scenario, identify the workflow pattern in use. Options: prompt chaining, routing, parallel sectioning, evaluator-optimizer.",qz:"为每个场景识别所用的工作流模式。选项：链式（chaining）、路由（routing）、切分并行（sectioning）、生成-评审循环（evaluator-optimizer）。",scenE:["Invoices flow through extract, then validate, then post to the ledger, each step feeding the next.","Support tickets are first classified by language, then handled by language-specific pipelines.","A 400-page filing is split by section, summarised simultaneously, and the summaries merged.","Ad copy is regenerated until a compliance rubric scores it as passing.","Independent product pages are translated across locales at the same time each night."],scenZ:["发票依次经过抽取、校验、入账，每步喂给下一步。","支持工单先按语言分类，再交由对应语言的管线处理。","400 页申报文件按章节切分、同步摘要、再合并各章摘要。","广告文案反复重新生成，直到合规评分器判定通过。","相互独立的产品页每晚同时翻译到各语种。"],sopE:["prompt chaining","routing","parallel sectioning","evaluator-optimizer"],sopZ:["链式","路由","切分并行","生成-评审循环"],a:[0,1,2,3,2],re:"1 is a feed-forward sequence. 2 classifies then dispatches. 3 and 5 split independent units and process simultaneously. 4 iterates against an explicit scoring standard.",rz:"1 是逐级前馈序列；2 先分类再分发；3、5 把独立单元切开同步处理；4 对着显式评分标准迭代。"},
{d:2,m:0,qe:"A telco classifies 900k short messages daily; accuracy across model tiers ties at 94–95% on the eval set, and p95 must stay under 400 ms. Which strategy is most defensible?",qz:"电信公司每天分类 90 万条短消息；各档模型在评测集上准确率打平（94–95%），p95 必须低于 400ms。哪种策略最站得住？",oe:["The mid-tier model as the safe middle ground","The largest tier, since misroutes create downstream rework","The smallest tier that passes, with continuous evaluation","Rotate tiers weekly and compare the dashboards"],oz:["中档模型——安全的折中","最大档——误分流会造成下游返工","能达标的最小档+持续评测","各档每周轮换，对比看板"],a:[2],re:"With measured parity and hard latency pressure, the smallest passing tier wins — kept honest by continuous evaluation. Why not: A avoids the measurement that already decided; B pays for capability the eval says is not needed; D injects uncontrolled variance into production.",rz:"实测打平+硬性延迟压力下，能过线的最小档胜出——由持续评测守住底线。其余：A 回避了已经给出答案的测量；B 为评测证明不需要的能力买单；D 往生产里注入不受控方差。"},
{d:2,m:0,qe:"An underwriting assistant answers questions over 120-page policy PDFs that fit in context, but citations of exclusions from the middle pages are unreliable. What is the cheapest meaningful fix?",qz:"核保助手基于 120 页保单 PDF 答疑（全文装得下上下文），但对中部页码免责条款的引用不可靠。代价最小的有效修复？",oe:["Document first, question last, and quote clauses before answering","Chunk the PDF into a retrieval index with a reranker","A first pass that lists all exclusions, then a second that answers","Raise the output limit so answers can be more complete"],oz:["文档在前、问题在最后、作答前先引用条款原文","把 PDF 切块建检索索引并加精排","第一遍先列出全部免责条款，第二遍再作答","提高输出上限，让回答更完整"],a:[0],re:"Ordering and quote-first are the zero-cost levers for in-context recall. Why not: B adds infrastructure and retrieval-miss risk for a document that already fits; C is a real two-pass pattern at double cost — try the free fix first; D output length has nothing to do with mid-context recall.",rz:"排序+先引用后回答是零成本的窗口内召回杠杆。其余：B 为一份本就装得下的文档添置基础设施和漏检风险；C 是真实的两遍模式但成本翻倍——先试免费的；D 输出长度与中部召回无关。"},
{d:2,m:0,qe:"Prompt caching shows near-zero hits despite a stable 14k-token prompt. Investigation reveals the tool definitions are serialized in a nondeterministic order on each request. What is the fix?",qz:"提示稳定在 14k token，缓存命中却接近零。排查发现工具定义在每次请求中以不确定顺序序列化。修复是什么？",oe:["Trim the tool list until it fits within cache limits","Move the tool definitions after the user message","Request a longer time-to-live for cache entries","Serialize the tool definitions in a fixed, stable order"],oz:["裁剪工具列表，直到符合缓存大小限制","把工具定义挪到用户消息之后","为缓存条目申请更长的存活时间","以固定、稳定的顺序序列化工具定义"],a:[3],re:"Caching matches byte-stable prefixes; nondeterministic ordering makes every prefix unique. Why not: A size is not the failing constraint; B breaks the static-first structure caching depends on; C TTL explains decay between sparse calls, not zero hits under load.",rz:"缓存按字节级稳定前缀匹配；顺序不确定=每次前缀都是新的。其余：A 大小不是此处的约束；B 破坏缓存赖以工作的静态前置结构；C TTL 解释稀疏调用间的衰减，解释不了高负载下的零命中。"},
{d:2,m:0,qe:"Compliance letters must follow a niche citation format. A detailed written specification produces near-misses. What is the most effective refinement?",qz:"合规函件必须遵循一种小众引用格式。详尽的文字规范只能产出「接近但不对」的结果。最有效的打磨是？",oe:["Add a glossary defining every legal term used in the letters","Show two complete, correctly formatted exemplar letters","Generate freely, then reformat with a second model pass","Tighten the specification with stricter mandatory wording"],oz:["附一份术语表，定义函件中的每个法律术语","给出两封完整且格式完全正确的范例函件","先自由生成，再用第二遍模型调用重排格式","用更严格的强制性措辞收紧规范"],a:[1],re:"For format fidelity, showing beats telling: complete exemplars give a concrete target prose cannot. Why not: A vocabulary is not the failure mode; C is a real pattern that doubles cost and can drift content; D more prose for a prose-resistant problem.",rz:"格式保真上，示范胜于描述：完整范例给出文字给不了的具体靶子。其余：A 词汇不是失败模式；C 是真实模式但成本翻倍且可能漂移内容；D 用更多文字去治一个对文字免疫的问题。"},
{d:2,m:0,qe:"A migration session has run for three weeks and is nearing the context limit; decisions made in week one are being forgotten. Which context strategy is sound?",qz:"一个迁移会话已连续运行三周、逼近上下文上限；第一周做出的决定开始被遗忘。哪种上下文策略是健全的？",oe:["Milestone summaries plus an externalised decision log reloaded on demand","Switch to a larger-context model and continue as before","Let the oldest turns fall away and rely on the repository state","Restart from a fresh session at the start of each week"],oz:["里程碑摘要 + 外置决策日志，按需重新载入","换更大上下文的模型，照旧继续","让最早的轮次自然滑出，依靠代码仓库状态","每周一从全新会话重新开始"],a:[0],re:"Compaction plus external memory preserves the decisions themselves. Why not: B postpones the cliff at higher cost; C silently discards exactly the early decisions being lost; D resets everything weekly, rationale included.",rz:"压缩+外置记忆保住的正是那些决定本身。其余：B 花更多钱推迟悬崖；C 静默丢弃的恰是正在丢失的早期决定；D 每周清零一次，连决策依据一起。"},
{d:2,m:0,qe:"Extended thinking was enabled platform-wide. Complex planning tasks improved measurably; simple lookup endpoints now cost 2.3x with no accuracy gain. What should the architect conclude?",qz:"extended thinking 被全平台启用。复杂规划任务实测提升；简单查询端点成本变为 2.3 倍、准确率零增益。架构师应得出什么结论？",oe:["Remove extended thinking across the platform","Raise the thinking budget on lookups until benefits appear","Keep it everywhere so behaviour stays consistent","Enable it selectively where evaluations show benefit"],oz:["全平台移除 extended thinking","继续加大查询端点的思考预算，直到收益出现","全平台保留，保持行为一致性","按评测证明有收益的场景选择性启用"],a:[3],re:"Spend reasoning where reasoning is the bottleneck. Why not: A discards a measured win on planning; B there is no mechanism for gain on simple lookups; C buys consistency of cost, not of quality.",rz:"把推理花在推理是瓶颈的地方。其余：A 丢掉了规划任务上已实测的收益；B 简单查询根本不存在产生收益的机制；C 买到的是成本的一致性，不是质量的。"},
{d:2,m:2,qe:"(Select TWO) A prompt carries 26 few-shot examples (11k tokens). Which TWO changes cut per-request cost without sacrificing measured quality?",qz:"（多选，选2项）某提示带 26 个 few-shot 示例（11k token）。哪两项改动能在不牺牲实测质量的前提下降低单次成本？",oe:["Remove all examples and rely on instructions alone","Move the examples into the user turn instead","Prune to the minimal diverse set that keeps eval scores flat","Place the retained static examples inside the cached prefix","Compress the examples by stripping whitespace"],oz:["删掉全部示例，只留指令","把示例挪进用户轮","裁剪到「评测分数保持不变」的最小多样集","把保留的静态示例放进缓存前缀","删除空白字符来压缩示例"],a:[2,3],re:"Find the knee with evals, then cache what remains. Why not: A overshoots — some examples carry the measured gains; B relocates the same tokens; E saves a rounding error and hurts readability.",rz:"用评测找到拐点，再把留下的进缓存。其余：A 冲过头——部分示例承载着实测收益；B 同样的 token 换了个位置；E 省的是零头，还伤可读性。"},
{d:2,m:2,qe:"(Select TWO) Output feeds a zero-tolerance JSON parser. Which TWO mechanisms most strongly ensure valid output?",qz:"（多选，选2项）输出直接喂给零容错的 JSON 解析器。哪两种机制最能确保输出合法？",oe:["Schema-enforced structured output or a tool call with a defined schema","Temperature 0 combined with a strict formatting instruction","Generate twice and keep whichever response parses","A JSON repair library pass after generation","Prefill the assistant turn with the opening brace"],oz:["schema 强约束的结构化输出，或带定义 schema 的工具调用","temperature 0 加严格格式指令","生成两次，保留能解析的那次","生成后过一遍 JSON 修复库","预填 assistant 轮的开头大括号"],a:[0,4],re:"Constrain at the protocol level and anchor the first token. Why not: B reduces variance but guarantees nothing; C halves throughput for a coin flip; D is a real safety net that cannot restore missing required fields.",rz:"在协议层约束+锚定第一个 token。其余：B 降方差但不构成保证；C 用一半吞吐量换一次掷硬币；D 是真实的兜底，但补不回缺失的必填字段。"},
{d:3,m:0,qe:"A report-generation tool takes about 90 seconds, but tool calls time out at 30 seconds and the conversation blocks while it runs. Which redesign fits?",qz:"报表生成工具约需 90 秒，而工具调用 30 秒超时，运行期间对话被阻塞。哪种重设计合适？",oe:["Extend the client timeout to 120 seconds","Stream partial report content into the conversation as it generates","Cache generated reports so repeat requests return instantly","Split into a submit-job tool and a check-status tool"],oz:["把客户端超时延长到 120 秒","生成过程中把部分报表内容流式写进对话","缓存已生成报表，重复请求秒回","拆成「提交任务」与「查询状态」两个工具"],a:[3],re:"Long-running operations belong behind an async job pattern: submit returns a job id, status is polled, the conversation stays live. Why not: A raises the ceiling but still blocks; B streaming helps interactive output, not a tool result that arrives whole; C helps repeats — first requests still block for 90s.",rz:"长任务应放进异步作业模式：提交返回 job id、轮询状态、对话保持可用。其余：A 抬高了上限但照样阻塞；B 流式帮的是交互输出，帮不了整体到达的工具结果；C 只救重复请求——首次仍要卡 90 秒。"},
{d:3,m:0,qe:"A client application bursts at 50 requests/second against a provider limit of 10 sustained. Errors spike during every burst. What is the correct client-side design?",qz:"客户端应用以 50 rps 突发请求，而服务商可持续限额为 10 rps，每次突发都报错激增。正确的客户端设计是？",oe:["Retry each rejected request immediately until it succeeds","A client-side queue with token-bucket smoothing to the sustained rate","Distribute the burst across several API keys","Downgrade burst traffic to a smaller, faster model"],oz:["每个被拒请求立即重试直到成功","客户端队列 + 令牌桶，把流量平滑到可持续速率","把突发流量分散到多个 API key 上","突发流量降级到更小更快的模型"],a:[1],re:"Shape demand to supply: queue and smooth, and the errors disappear by construction. Why not: A amplifies pressure at the worst moment; C is a terms-of-service workaround that collapses when detected; D changes the model, not the request rate.",rz:"把需求整形到供给：排队+平滑，错误从构造上消失。其余：A 在最糟的时刻放大压力；C 是违反服务条款的绕限手法，被识别即崩；D 换的是模型，不是请求速率。"},
{d:3,m:0,qe:"Retrieval quality is disputed: one engineer blames chunking, another the embeddings, a third wants a reranker. No retrieval metrics exist. What comes first?",qz:"检索质量起了争议：一位工程师怪切块，一位怪嵌入模型，第三位想上精排。目前没有任何检索指标。第一步是什么？",oe:["Adopt hybrid retrieval, the most broadly effective upgrade","Re-chunk with structure awareness first, since chunking is upstream","Build a labelled retrieval evaluation and measure before changing components","Upgrade the embedding model, since embeddings anchor the pipeline"],oz:["先上混合检索——普适性最强的升级","先做结构感知重切块——切块在最上游","先建带标注的检索评测集，量完再动组件","先升级嵌入模型——嵌入是管道的地基"],a:[2],re:"Three plausible theories and zero measurements: build the instrument first, then let recall and precision arbitrate. Why not: A, B, and D are all real upgrades — chosen blind, any of them can spend weeks fixing the wrong stage.",rz:"三个都说得通的理论、零测量：先造仪器，让 recall 与 precision 来仲裁。其余：A、B、D 都是真实的升级——盲选任何一个，都可能花几周修一个没坏的环节。"},
{d:3,m:0,qe:"A RAG assistant retrieves both a KB article and a newer policy that contradict each other, and answers inconsistently between them. What is the architectural fix?",qz:"RAG 助手同时检回一篇 KB 文章和一份更新的政策文件，两者互相矛盾，回答在两者间摇摆。架构级修复是什么？",oe:["Authority and effective-date metadata with precedence rules, surfacing conflicts explicitly","Retrieve only from the policy corpus and drop the KB entirely","Let the model reconcile the conflict from context on each request","Lower top-k so only the single best-scoring source returns"],oz:["权威级别+生效日期 metadata 与优先级规则，冲突显式呈现","只检政策语料，彻底弃用 KB","让模型每次都在上下文里自行调和矛盾","调低 top-k，只返回得分最高的单一来源"],a:[0],re:"Source governance: rank authority, respect effective dates, and surface conflicts rather than hiding them. Why not: B discards KB value on the majority of non-conflicting queries; C is nondeterministic and unauditable; D hides the conflict behind a similarity score that knows nothing of precedence.",rz:"来源治理：分权威级、按生效日期、显式呈现冲突而不是掩盖。其余：B 在大多数不冲突的查询上白白丢掉 KB 的价值；C 不确定且不可审计；D 把冲突藏在一个对「优先级」一无所知的相似度分数后面。"},
{d:3,m:0,qe:"After a network timeout, an agent retried a purchase-order tool call and created three duplicate POs last month. Which mechanism prevents this class of failure?",qz:"网络超时后，代理重试采购单工具调用，上个月因此产生了三张重复采购单。哪种机制能杜绝这一类失败？",oe:["Ban retries on all write tools","Add a confirmation dialog before every write executes","Idempotency keys so a retried request creates at most one order","Queue all writes for human batch approval"],oz:["禁止所有写类工具重试","每次写操作执行前加确认弹窗","幂等键：同一请求重试至多创建一张采购单","所有写操作进队列，人工批量审批"],a:[2],re:"Exactly-once semantics over unreliable networks is what idempotency keys are for. Why not: A trades duplicates for lost writes on transient failures; B a human cannot see that this write is a retry of that one; D adds latency and workload, not deduplication.",rz:"在不可靠网络上实现「恰好一次」，幂等键正是为此而生。其余：A 用瞬时故障下的丢单换掉重复单；B 人看不出这次写入是那次的重试；D 增加的是延迟和工作量，不是去重。"},
{d:3,m:0,qe:"A vendor releases a 3072-dimension embedding model; you run 768 dimensions over 40M chunks today. Storage would grow 4x and query latency ~30%. How should the decision be made?",qz:"供应商发布了 3072 维嵌入模型；你现在是 768 维、4000 万块。升级后存储×4、查询延迟约+30%。这个决定该怎么做？",oe:["Adopt it: higher dimensions capture more meaning","Benchmark both on your retrieval golden set; upgrade only if measured recall justifies the cost","Decline it: dimension changes rarely matter in practice","Adopt it for new documents only, keeping existing vectors as they are"],oz:["直接升级：维度越高语义越丰富","在你自己的检索金标集上对测两者；只有实测召回配得上成本才升级","直接拒绝：维度变化在实践中影响不大","只对新文档启用新模型，存量向量保持原样"],a:[1],re:"The only relevant question is measured recall on your distribution versus a 4x bill. Why not: A dimensionality is a capacity claim, not a guarantee on your tasks; C equally unmeasured in the opposite direction; D mixes incompatible vector spaces — the classic migration failure.",rz:"唯一相关的问题是：在你的分布上的实测召回，对得起 4 倍账单吗。其余：A 维度是容量声明，不是对你任务的保证；C 是反方向的同样未经测量；D 混用不兼容的向量空间——经典的迁移事故。"},
{d:3,m:0,qe:"A CRM tool returns the full 200KB customer object graph on every call, crowding out the rest of the context. Where does the fix belong?",qz:"CRM 工具每次调用都返回完整的 200KB 客户对象图，把上下文其余部分挤掉。修复应落在哪里？",oe:["Summarise the tool output with a second model call before use","Adopt a larger context window to absorb the payloads","Have the model request the object in 20KB pages","Add server-side field selection and filter parameters to the tool"],oz:["用第二次模型调用先把工具输出摘要一遍","换更大的上下文窗口来吸收这些载荷","让模型按 20KB 分页请求对象","在工具服务端增加字段选择与过滤参数"],a:[3],re:"Return what the task needs — selection belongs at the source. Why not: A spends tokens to shrink tokens, lossily; B buys capacity for waste; C still ships the whole graph, just in slices, when fields were the problem.",rz:"只返回任务需要的——筛选应发生在源头。其余：A 花 token 去省 token，还有损；B 为浪费购买容量；C 整张对象图还是全运过来了，只是切了片——而问题出在字段。"},
{d:3,m:0,qe:"Two companies' agents will transact directly (quote, order, confirm). How should the connection authenticate?",qz:"两家公司的代理将直接交易（询价、下单、确认）。连接应如何认证？",oe:["Mutually authenticated, scoped service identities with signed requests","A shared API key exchanged by email and rotated quarterly","IP allowlisting between the two data centres","A site-to-site VPN with open routing between the networks"],oz:["双向认证的、限定范围的服务身份，请求带签名","邮件交换共享 API key，按季度轮换","两家数据中心之间做 IP 白名单","站点到站点 VPN，两网间开放路由"],a:[0],re:"Cross-organisation agents need workload identity: mutual authentication, scoped permissions, signed requests. Why not: B a shared secret has no per-request identity and travelled by email; C network location is not identity; D VPNs authenticate networks, then over-trust everything inside them.",rz:"跨组织代理需要工作负载身份：双向认证、范围受限、请求签名。其余：B 共享密钥没有请求级身份，还走了邮件；C 网络位置不等于身份；D VPN 认证的是网络，然后对网内的一切过度信任。"},
{d:3,m:0,qe:"A 200k window holds 12k system+tools, an 8k policy, ~30k growing history, and top-k=40 retrieval at 1.5k tokens per chunk (60k). Quality is degrading and overflows occur. What is the disciplined fix?",qz:"200k 窗口里装着 12k 系统+工具、8k 政策、约 30k 且持续增长的历史、top-k=40 的检索（每块 1.5k，共 60k）。质量在下滑且出现溢出。有纪律的修复是？",oe:["Reduce chunk size so all forty chunks still fit","Budget each context section explicitly; cap retrieval and summarise history to fit","Move to a model with a one-million-token window","Drop the policy document to free the space"],oz:["缩小块尺寸，让 40 块照样装下","为每段上下文设显式预算：检索设上限、历史做摘要压缩","换百万 token 窗口的模型","去掉政策文档腾出空间"],a:[1],re:"Context is a budget to allocate, not a bin to fill. Why not: A forty smaller fragments still crowd the window and add noise; C postpones the discipline at higher cost; D removes required grounding to make room for excess retrieval.",rz:"上下文是要分配的预算，不是往满里塞的桶。其余：A 40 个更小的碎片照样挤占窗口还添噪声；C 花更多钱推迟纪律问题；D 为了给过量检索腾地方，砍掉了必需的依据。"},
{d:3,m:2,qe:"(Select TWO) Retrieval returns passages from the right documents but the wrong sections. Which TWO changes target this directly?",qz:"（多选，选2项）检索能找对文档，但返回的是错误章节的段落。哪两项改动直接对症？",oe:["A larger, stronger embedding model","Structure-aware chunk boundaries aligned to the section hierarchy","Higher temperature during answer generation","Section-path metadata on chunks with query-time filtering","Doubling top-k so more passages are returned"],oz:["更大更强的嵌入模型","按章节层级对齐的结构感知切块边界","生成阶段调高 temperature","块上带章节路径 metadata，查询时过滤","top-k 翻倍，多返回一些段落"],a:[1,3],re:"Section precision comes from boundaries that respect structure and metadata that names the section. Why not: A and E add semantic strength or volume — neither encodes which section a chunk came from; C is a generation knob, unrelated to retrieval.",rz:"章节级精度来自尊重结构的边界+标明章节的 metadata。其余：A、E 增强的是语义强度或数量——都不编码「这块来自哪一节」；C 是生成端旋钮，与检索无关。"},
{d:3,m:2,qe:"(Select TWO) Which TWO error-design choices let an agent correct its own failed tool calls?",qz:"（多选，选2项）哪两种错误设计能让代理自行纠正失败的工具调用？",oe:["Return isError: false with an apologetic message","Map every failure to a generic 500 to simplify handling","Machine-readable category and isRetryable fields on every error","Silently retry everything server-side before responding","Actionable detail in the payload: valid ranges, expected formats"],oz:["返回 isError: false 附一句道歉文案","所有失败统一映射为通用 500，简化处理","每个错误带机器可读的类别与 isRetryable 字段","服务端先对一切静默重试再返回","载荷里给可行动细节：合法取值范围、期望格式"],a:[2,4],re:"Category tells the agent whether to retry; actionable detail tells it how to fix the call. Why not: A lies to the loop; B erases the signal the agent needs; D hides terminal failures and re-executes side effects.",rz:"类别告诉代理「要不要重试」，可行动细节告诉它「怎么改调用」。其余：A 对循环撒谎；B 抹掉了代理需要的信号；D 掩盖终局失败、还会重复执行副作用。"},
{d:3,k:"x",qe:"For each retrieval symptom, choose the most direct remedy. Options: hybrid lexical+dense retrieval, re-ranker, query rewriting, metadata filtering.",qz:"为每个检索症状选择最直接的处方。选项：词法+向量混合检索、精排（re-ranker）、查询改写、metadata 过滤。",scenE:["Exact error codes and SKUs return near-miss neighbours instead of the exact item.","Follow-up questions like 'and the second option?' retrieve nothing useful on their own.","The right passage is almost always in the top-20 but rarely in the top-5 supplied to the model.","Users asking about current policy keep receiving superseded versions.","Customers describe problems in lay terms while documentation uses engineering jargon."],scenZ:["精确报错码和 SKU 检回的是近似邻居，而不是那一条。","「那第二个方案呢？」这类追问单独检索时一无所获。","正确段落几乎总在前 20，但很少进入供给模型的前 5。","询问现行政策的用户总是收到已废止的版本。","客户用大白话描述问题，文档用工程术语。"],sopE:["hybrid lexical+dense","re-ranker","query rewriting","metadata filtering"],sopZ:["词法+向量混合","精排","查询改写","metadata 过滤"],a:[0,2,1,3,2],re:"Exact identifiers need lexical matching (1). Context-dependent and vocabulary-mismatched queries need rewriting (2, 5). Recalled-but-misordered needs the re-ranker (3). Version selection is a metadata property (4).",rz:"精确标识符要词法匹配（1）；依赖上下文与词汇错配的查询要改写（2、5）；已召回但排序不对要精排（3）；版本选择是 metadata 属性（4）。"},
{d:4,m:0,qe:"A gaming assistant's eval set was built entirely from English beta-tester queries. Launch covers 12 locales. What must change about the evaluation before launch?",qz:"游戏助手的评测集完全来自英语 beta 玩家的查询。上线将覆盖 12 个语种。上线前评测必须改什么？",oe:["Extend it with per-locale slices sampled from each target market","Nothing: the base model is multilingual by training","Machine-translate the existing English set into all twelve locales","Launch English-only first and defer the other locales"],oz:["扩展评测：从每个目标市场采样，建立分语种切片","不用改：基础模型本就多语言","把现有英文集机翻成十二个语种","先只上英文，其他语种推迟"],a:[0],re:"An eval must mirror the deployment distribution; per-locale slices expose locale-specific failures before users do. Why not: B a training-time claim is not a measurement of your task; C translation inherits the English set's blind spots and misses native phrasing; D a real scoping decision that answers the launch plan, not the measurement gap.",rz:"评测必须镜像部署分布；分语种切片让语种级失败先于用户暴露。其余：B 训练层面的宣称不等于对你任务的测量；C 机翻继承英文集的盲区、丢失母语者的真实措辞；D 是真实的收缩范围决策，回答的是上线计划、不是测量缺口。"},
{d:4,m:0,qe:"An LLM judge scores replies 1–10 for helpfulness. Scores drift between runs and calibration keeps slipping. Which evaluation design is more stable?",qz:"LLM judge 按 1–10 为回复的有用性打分。分数在多次运行间漂移，校准不断走偏。哪种评测设计更稳定？",oe:["Expand the rubric with finer-grained level descriptions","Average three judge runs for every item","Pairwise comparison against a fixed reference answer set","Fine-tune a dedicated scoring model on past ratings"],oz:["扩写评分标准，把每档描述写得更细","每条样本取三次 judge 运行的平均","与固定参照答案集做成对比较","用历史评分微调一个专用打分模型"],a:[2],re:"Absolute scales drift; relative judgments against fixed references are what stays stable. Why not: A more prose to interpret, same drift; B averaging reduces noise, not scale drift; D a heavy later-stage investment that still needs calibration.",rz:"绝对量尺会漂移；对固定参照的相对判断才稳定。其余：A 更多需要解读的文字、同样的漂移；B 平均掉的是噪声、不是量尺漂移；D 是重型后期投资，且照样需要校准。"},
{d:4,m:0,qe:"A rebuilt retrieval pipeline outperforms offline. The team wants production-distribution evidence without exposing users. Which practice fits?",qz:"重构后的检索管道离线表现更好。团队想拿到生产分布下的证据，但不暴露任何用户。哪种实践契合？",oe:["A/B it on half of production traffic immediately","Run it in shadow on live traffic and diff outputs offline","Rely on the offline suite and switch over","Pilot it with internal staff for a week"],oz:["立即对一半生产流量做 A/B","影子运行：在真实流量上并行跑，离线对比输出","离线套件已验证，直接切换","先让内部员工试用一周"],a:[1],re:"Shadow mode gives the production distribution at zero user risk — the intermediate step between offline and A/B. Why not: A exposes users before evidence exists; C offline distributions drift from production; D staff usage is not production traffic.",rz:"影子模式=生产分布+零用户风险——离线与 A/B 之间该有的台阶。其余：A 在证据存在前就暴露用户；C 离线分布与生产有偏差；D 员工用法不是生产流量。"},
{d:4,m:0,qe:"Cost analysis shows 70% of spend is output tokens: replies average 900 tokens where 200 would serve. What is the direct fix?",qz:"成本分析显示 70% 的开销在输出 token：回复平均 900 token，而 200 就够用。直接的修复是？",oe:["Move the workload to a cheaper model tier","Cache more aggressively across requests","Trim the system prompt to its essentials","Constrain response format and length, verifying quality on evals"],oz:["把负载迁到更便宜的模型档","跨请求更激进地做缓存","把系统提示精简到只留必需","约束回复格式与长度，用评测验证质量不降"],a:[3],re:"The driver is output verbosity; format and length constraints attack it at the source. Why not: A cuts the unit price and keeps the 4.5x verbosity; B and C are input-side levers aimed at an output-side cost.",rz:"成本驱动是输出冗长；格式与长度约束直击源头。其余：A 降的是单价、留着 4.5 倍的话痨；B、C 是输入侧杠杆，打不到输出侧的成本。"},
{d:4,m:0,qe:"p99 latency spikes periodically. Traces show timeouts followed by three immediate retries from many clients at once. What resolves the spikes?",qz:"p99 延迟周期性尖刺。trace 显示：超时后大量客户端同时立即重试三次。什么能消除尖刺？",oe:["Raise the timeout threshold so fewer calls trigger retries","Remove retries entirely from the clients","Cap retries with exponential backoff and jitter","Add service replicas to absorb the retry waves"],oz:["调高超时阈值，减少触发重试的调用","客户端彻底移除重试","限制重试次数并加指数退避+抖动","增加服务副本来吸收重试浪潮"],a:[2],re:"Synchronized immediate retries are a self-inflicted storm; backoff plus jitter desynchronizes them by design. Why not: A hides slowness and still stacks retries when it triggers; B trades storms for failures on every transient blip; D buys capacity to serve waste.",rz:"同步的立即重试是自造风暴；退避+抖动从设计上打散它们。其余：A 掩盖慢调用，触发时照样叠加；B 用每次瞬时抖动都失败换掉风暴；D 花钱购买「为浪费服务」的容量。"},
{d:4,m:0,qe:"A 2% canary (≈200 requests/day) must detect a 5-point quality drop within one day. It has missed two regressions. How should canary size be set?",qz:"2% 灰度（约 200 请求/日）需要在一天内检出 5 个点的质量下滑，但已漏过两次回归。灰度规模应如何确定？",oe:["From a power calculation for the effect size that must be caught","Keep 2% but extend the evaluation window to two weeks","Judge the canary on absolute user-complaint counts","Run the canary only during peak hours for denser data"],oz:["按「必须检出的效应量」做统计功效计算来定","维持 2%，把评估窗口拉长到两周","以用户投诉的绝对数量来评判灰度","只在高峰时段跑灰度，数据更密"],a:[0],re:"Detection is a sample-size problem: work backwards from the effect size and the deadline. Why not: B gains samples by violating the one-day detection requirement; C complaints lag and undercount; D a denser but biased window, still under-powered.",rz:"检出能力是样本量问题：从效应量与时限倒推。其余：B 用违反「一天内」要求的方式攒样本；C 投诉滞后且严重低估；D 更密但有偏的窗口，功效照样不足。"},
{d:4,m:0,qe:"An audit finds six eval items were pasted into the few-shot prompt months ago; suite scores have been inflated since. What is the correct response?",qz:"审计发现六条评测题几个月前被贴进了 few-shot 提示；此后套件分数一直虚高。正确的响应是？",oe:["Rotate the few-shot examples periodically from now on","Down-weight the six items in the aggregate score","Accept it: six items barely move the average","Quarantine prompt-embedded items from the eval and re-baseline"],oz:["从现在起定期轮换 few-shot 示例","把这六条在总分里降权","接受现状：六条题对平均分影响很小","把进过提示词的题隔离出评测集，并重建基线"],a:[3],re:"Contaminated items measure memorization, not capability; remove them and re-baseline history. Why not: A rotation spreads contamination to new items; B down-weighted memorization still counts; C the bias is systematic and directional, not noise.",rz:"被污染的题测的是记忆不是能力；移除并重建历史基线。其余：A 轮换把污染扩散到新题；B 降权后的记忆分照样计入；C 这是系统性、有方向的偏差，不是噪声。"},
{d:4,m:2,qe:"(Select TWO) Executive dashboards will feature LLM-judge quality scores. Which TWO practices make those scores trustworthy?",qz:"（多选，选2项）高管看板将展示 LLM-judge 质量分。哪两种做法让这些分数可信？",oe:["Report judge-human agreement rates alongside the scores","Pin the judge model and rubric version for each reporting period","Show the judge which system produced each answer","Use the production generator as its own judge","Raise judge temperature to capture diverse perspectives"],oz:["分数旁同时报告 judge 与人工的一致率","每个报告期锁定 judge 模型与评分标准版本","让 judge 知道每个答案出自哪个系统","让生产上的生成模型自己当 judge","调高 judge 温度以纳入多元视角"],a:[0,1],re:"Trust requires calibration evidence and a stable instrument. Why not: C invites identity bias; D self-preference bias by construction; E judge noise is not perspective.",rz:"可信=校准证据+稳定的测量仪器。其余：C 引入身份偏好；D 从构造上就是自恋偏好；E judge 的噪声不是「视角」。"},
{d:4,m:2,qe:"(Select TWO) A nightly job summarises 200k documents; results are needed within 24 hours. Which TWO levers cut cost most directly?",qz:"（多选，选2项）夜间任务摘要 20 万份文档，24 小时内出结果即可。哪两个杠杆最直接降本？",oe:["Stream outputs to reduce time-to-first-token","Use the largest model to avoid retry costs","Lower max output tokens regardless of summary quality","Submit through the discounted asynchronous batch API","Cache the shared static instruction prefix"],oz:["流式输出，降低首 token 时间","用最大模型以避免重试成本","不顾摘要质量、一律调低输出上限","走折扣价的异步批处理 API 提交","缓存共享的静态指令前缀"],a:[3,4],re:"Latency-tolerant bulk work is exactly what batch pricing and prefix caching are for. Why not: A a UX lever with zero cost effect; B raises cost on speculation; C a real lever applied blind to quality.",rz:"延迟宽容的批量工作正是批处理折扣与前缀缓存的用武之地。其余：A 是体验杠杆、成本零变化；B 靠猜测抬高成本；C 是真实杠杆、但被无视质量地滥用。"},
{d:4,k:"x",qe:"Choose the right grader for each evaluation need. Options: code-graded checks, LLM judge, human review.",qz:"为每个评测需求选择合适的判分器。选项：代码判分、LLM judge、人工评审。",scenE:["Verify outputs validate against the response JSON schema.","Score brand-tone alignment across 50,000 replies per week.","Produce the gold labels used to calibrate the automated judge.","Confirm every cited source ID exists in the retrieved set.","Assess a sample of borderline medical-advice responses for appropriateness."],scenZ:["校验输出是否符合响应 JSON schema。","为每周 5 万条回复的品牌语气契合度打分。","产出用于校准自动 judge 的金标标签。","确认每个被引来源 ID 都存在于检索结果集中。","评估一批处于边界的医疗建议回复是否恰当。"],sopE:["code-graded checks","LLM judge","human review"],sopZ:["代码判分","LLM judge","人工评审"],a:[0,1,2,0,2],re:"Mechanically decidable properties go to code (1, 4). Subjective quality at scale goes to a calibrated judge (2). Gold standards and high-stakes borderline judgments belong to humans (3, 5).",rz:"可机械判定的属性交给代码（1、4）；规模化的主观质量交给经校准的 judge（2）；金标与高风险边界判断归人类（3、5）。"},
{d:5,m:0,qe:"A finance agent summarises uploaded spreadsheets and can email reports externally. A red team hid instructions in cell comments directing exfiltration. Which defence addresses the root risk?",qz:"财务代理摘要上传的电子表格，并能对外邮件发送报告。红队在单元格批注里藏了指令，指挥数据外传。哪种防御针对根本风险？",oe:["Scan every upload with an injection classifier and reject flagged files","Treat file content strictly as data, and gate outbound email behind recipient allowlists and approval","Instruct the model to ignore any instructions found inside files","Accept only PDF uploads, which are harder to weaponise"],oz:["每份上传都过注入检测分类器，命中即拒收","文件内容一律当数据处理；对外邮件走收件人白名单+审批门","在提示中要求模型忽略文件内出现的任何指令","只接受 PDF 上传——更难被武器化"],a:[1],re:"Trust separation plus a hard gate on the dangerous action: content never becomes instructions, and email cannot leave without approval. Why not: A a real detection layer with a false-negative tail — supplement, not foundation; C the soft layer injections are built to defeat; D swapping formats does not change the trust model, and PDFs hide text just as well.",rz:"信任分离+对高危动作的硬门禁：内容永远成不了指令，邮件未经审批出不去。其余：A 是真实的检测层但有漏检尾巴——是补充不是地基；C 恰是注入被设计来击穿的那个软层；D 换格式不改变信任模型，PDF 藏字一样在行。"},
{d:5,m:0,qe:"A GDPR erasure request arrives. Personal data exists in source files and as embeddings in the vector store. Which design makes erasure actually work?",qz:"收到 GDPR 删除请求。个人数据既在源文件中，也以嵌入形式存在于向量库。哪种设计让删除真正可执行？",oe:["Anonymise future ingestion so the exposure shrinks over time","Delete the sources and let vectors age out with scheduled index rebuilds","Encrypt the vector store at rest with regularly rotated keys","Maintain document-to-vector mappings enabling verified cascade deletion"],oz:["对未来入库数据做匿名化，让暴露随时间缩小","删除源文件，让向量随例行重建索引自然淘汰","对向量库做静态加密并定期轮换密钥","维护文档→向量映射，支持可验证的级联删除"],a:[3],re:"Erasure must reach every copy on the requester's timeline, which requires a designed propagation path. Why not: A prospective only — stored data remains; B chains a legal deadline to an ops schedule; C protects against theft, not against retention.",rz:"删除必须在权利人的时限内触达每一份副本——这需要事先设计好的传播路径。其余：A 只管未来、存量原地不动；B 把法定时限拴在运维排期上；C 防的是被偷、不是「仍被保留」。"},
{d:5,m:0,qe:"A regulator may ask, months after the fact, exactly what an agent did and why during a disputed transaction. Which capability satisfies this?",qz:"监管方可能在数月后要求精确还原：争议交易中代理做了什么、为什么。哪种能力能满足？",oe:["Immutable decision logs capturing inputs, retrieved context, tool calls, and approvals","Aggregate metrics dashboards retained for two years","Thirty-day rolling transcripts balancing audit against privacy","Having the model generate an explanation of the case upon request"],oz:["不可篡改的决策日志：输入、检索上下文、工具调用、审批记录","留存两年的聚合指标看板","滚动保留 30 天的会话转录，平衡审计与隐私","需要时让模型对该案例生成一份解释"],a:[0],re:"Reconstruction demands contemporaneous, tamper-evident records of the decision path. Why not: B aggregates cannot answer a per-case question; C the dispute window outlives thirty days; D a fresh model guessing after the fact is narrative, not evidence.",rz:"还原要求「当时留下的、防篡改的」决策路径记录。其余：B 聚合数据回答不了单案问题；C 争议窗口远长于 30 天；D 事后让新模型猜一遍是叙事，不是证据。"},
{d:5,m:0,qe:"Your provider ships a model update that subtly shifts refusal behaviour across your workloads. What is the correct change-management posture?",qz:"上游服务商的模型更新让你各负载上的拒答行为发生微妙变化。正确的变更管理姿态是？",oe:["Pin the current version permanently to avoid all change","Adopt immediately: the vendor's QA covers regressions","Gate upgrades behind your own eval suite, staged rollout, and rollback","Wait a quarter for community reports before deciding"],oz:["永久锁定当前版本，回避一切变更","立即采用：厂商的 QA 已覆盖回归","升级必须过自家评测套件门禁，灰度上线并备好回滚","等一个季度，看社区反馈再决定"],a:[2],re:"Model versions are dependencies: evaluate on your workloads, stage the rollout, keep the exit. Why not: A defers to a forced, rushed end-of-life migration; B vendor QA measures general capability, not your tasks; D outsources evidence you can generate today.",rz:"模型版本就是依赖：用你的负载评测、灰度上线、留好退路。其余：A 把问题推迟到停服时被迫仓促迁移；B 厂商 QA 测的是通用能力、不是你的任务；D 把你今天就能生成的证据外包给别人。"},
{d:5,m:0,qe:"A loan-assistance model passed its pre-launch fairness audit. Nine months later, applicant demographics have shifted substantially. What keeps fairness claims valid?",qz:"贷款辅助模型通过了上线前公平性审计。九个月后，申请人人群结构发生明显变化。什么能让公平性主张持续成立？",oe:["Re-run the audit at the annual recertification","Rely on complaint channels to surface any disparities","Freeze the model so the original audit remains applicable","Continuous cohort-level monitoring with drift alerts"],oz:["等年度复审时重跑一次审计","依靠投诉渠道来暴露差异","冻结模型，让原审计持续适用","持续的分群体监控+漂移告警"],a:[3],re:"Fairness is a property of the system in its environment; when the population moves, static audits expire. Why not: A leaves months of blind operation; B complaints lag and undercount those affected; C freezing the model does not freeze the world.",rz:"公平性是「系统×环境」的属性；人群一移动，静态审计就过期。其余：A 留下数月盲驶；B 投诉滞后且低估受影响者；C 冻结模型冻结不了世界。"},
{d:5,m:0,qe:"Chat logs are retained indefinitely because they might be useful. The DPO objects. Which retention design answers the objection while keeping operations viable?",qz:"聊天日志因「可能有用」被无限期保留，DPO 提出异议。哪种保留设计既回应异议、又保住运维可行性？",oe:["Delete all logs after seven days across the board","Purpose-bound retention tiers with TTLs, plus legal-hold exceptions","Restrict log access to the security team only","Hash the user identifiers within the retained logs"],oz:["一刀切：所有日志七天后删除","按目的分级保留+TTL，另设法律保全例外","日志访问权只留给安全团队","对留存日志中的用户标识做哈希"],a:[1],re:"Minimisation means retention justified by purpose, with holds carved out where law requires. Why not: A real minimisation that breaks debugging and audit obligations; C access control is not retention; D pseudonymised identifiers still sit beside personal content.",rz:"最小化=按目的证成的保留期，法定保全另行豁免。其余：A 是弄断排障与审计义务的真最小化；C 访问控制不等于保留策略；D 标识伪名化了，旁边的内容还是个人数据。"},
{d:5,m:2,qe:"(Select TWO) A moderation agent takes 5,000 automated decisions daily under a human-oversight mandate. Which TWO mechanisms deliver meaningful oversight?",qz:"（多选，选2项）内容审核代理在人工监督要求下每天自动做出 5000 个决定。哪两种机制能构成有意义的监督？",oe:["Full human review of every automated decision","Risk-tiered routing so only high-impact cases require pre-approval","Sampled quality audits over the auto-approved tail","Approve-all defaults with monthly retrospectives","Hourly reviewer rotation to keep attention fresh"],oz:["每个自动决定都全量人工复核","风险分层路由：只有高影响案例需要事前批准","对自动通过的长尾做抽样质量审计","默认全部放行，每月做一次回顾","审核员每小时轮换，保持注意力"],a:[1,2],re:"Tier the gate, audit the tail — attention goes where stakes are, and the automated bulk stays verified. Why not: A collapses into rubber-stamping at this volume; D removes the control entirely; E a real vigilance tactic that fixes fatigue, not queue composition.",rz:"闸门分层、长尾抽审——注意力流向高风险处，自动化的大头仍被验证。其余：A 在这个量级必然退化为盖章；D 干脆取消了控制；E 是治疲劳的真战术，治不了队列构成。"},
{d:5,m:2,qe:"(Select TWO) Which TWO credential practices most reduce risk for production agents?",qz:"（多选，选2项）哪两种凭证实践最能降低生产代理的风险？",oe:["Short-lived, scoped tokens issued per session","One shared organisation-admin service account for simplicity","Annual rotation of long-lived static keys","Distinct identities per agent enabling audit attribution","Credentials embedded in the system prompt for availability"],oz:["按会话签发短时效、限定范围的令牌","为简单起见共用一个组织管理员服务账号","长效静态密钥按年轮换","每个代理独立身份，支持审计归因","把凭证内嵌进系统提示以便随取随用"],a:[0,3],re:"Short-lived scoped credentials bound the exposure window; distinct identities make actions attributable. Why not: B maximal blast radius, zero attribution; C the key stays exposed for the whole year between rotations; E prompts are extractable and are never a secret store.",rz:"短时效+限范围压缩暴露窗口；独立身份让动作可归因。其余：B 爆炸半径最大、归因为零；C 两次轮换之间整年都在暴露；E 提示词可被套取，永远不是保险库。"},
{d:5,k:"x",qe:"Identify the compliance regime each scenario triggers. Options: GDPR, HIPAA, FedRAMP.",qz:"识别每个场景触发的合规体系。选项：GDPR、HIPAA、FedRAMP。",scenE:["An EU customer demands erasure, including embedding copies of their data.","A hospital sends discharge summaries through a third-party model API under a signed agreement.","A federal agency requires the service to operate inside an authorised boundary.","EU marketing analytics must be pseudonymised and minimised before leaving the system.","A clinician assistant writes patient identifiers into its application logs."],scenZ:["欧盟客户要求删除数据——包括其数据的嵌入副本。","医院通过第三方模型 API 发送出院摘要，且已签署协议。","联邦机构要求服务运行在授权边界之内。","欧盟营销分析数据出系统前必须假名化并最小化。","临床助手把患者标识写进了应用日志。"],sopE:["GDPR","HIPAA","FedRAMP"],sopZ:["GDPR","HIPAA","FedRAMP"],a:[0,1,2,0,1],re:"EU personal-data rights and minimisation are GDPR (1, 4). PHI flowing to processors under agreements — and leaking into logs — is HIPAA territory (2, 5). Federal boundary authorisation is FedRAMP (3).",rz:"欧盟个人数据权利与最小化归 GDPR（1、4）；PHI 经协议流向处理方、以及泄进日志，都是 HIPAA 地界（2、5）；联邦授权边界是 FedRAMP（3）。"},
{d:6,m:0,qe:"Mid-build, the sponsor asks to add three more languages to the assistant's scope. What is the professional handling?",qz:"项目进行中，发起人要求给助手的范围再加三种语言。专业的处理方式是？",oe:["Absorb the additions quietly to preserve goodwill","Defer all additions until after the original launch","Assess impact against the agreed baseline and re-plan with the sponsor","Extend the team so the additions fit the current dates"],oz:["默默吸收新增，维系好感","一律推迟到原定上线之后再说","对照商定基线评估影响，与发起人重排计划","扩充团队，让新增塞进现有工期"],a:[2],re:"Change control preserves trust precisely because nothing is absorbed invisibly: impact is priced, and the sponsor re-decides. Why not: A erodes quality and schedule in the dark; B is real discipline applied bluntly — it refuses even cheap, high-value changes unexamined; D spends money before the impact is even known.",rz:"变更控制之所以保住信任，恰因没有任何东西被无声吸收：影响先定价，发起人再拍板。其余：A 在暗处侵蚀质量与工期；B 是被用钝了的真纪律——连便宜又高价值的变更也不加审视地拒绝；D 影响还没算清就先花钱。"},
{d:6,m:0,qe:"A three-month pilot ends this week. Exit criteria were agreed up front; two of five metrics missed. What does the architect present to the steering group?",qz:"三个月试点本周结束。出口标准事先已商定；五项指标中两项未达。架构师向指导委员会呈现什么？",oe:["Results versus the predefined criteria, misses included, with a recommendation","A showcase of the strongest user stories from the pilot","A proposal to extend the pilot until every metric is green","The raw dashboards, letting the group draw its own conclusions"],oz:["对照预定标准的结果——含未达项——附明确建议","试点中最亮眼的用户故事集锦","延长试点直到五项指标全绿的提案","原始看板数据，请委员会自行解读"],a:[0],re:"Pilots exist to end in a decision; the criteria were agreed for exactly this moment, and misses are findings, not failures to hide. Why not: B curates the evidence — the demo trap in reporting form; C moves the goalposts and burns the calendar; D abdicates the synthesis the architect owes the room.",rz:"试点的存在就是为了收敛成决策；标准正是为此刻商定的，未达项是发现、不是要藏的失败。其余：B 是报告形态的「演示陷阱」——筛选证据；C 挪动球门柱、烧日历；D 放弃了架构师欠这间会议室的综合判断。"},
{d:6,m:0,qe:"Legal insists every AI reply be human-reviewed before sending; product insists review-first kills the value. The teams are deadlocked. What breaks it properly?",qz:"法务坚持每条 AI 回复先人工审再发出；产品坚持「先审后发」毁掉全部价值。双方僵持。怎样正确破局？",oe:["Escalate to the CEO for a ruling","A documented risk-acceptance decision by the accountable owner, with tiered mitigations priced in","Prototype both modes and let usage data decide","Default to legal's position, since compliance outranks features"],oz:["上升到 CEO 裁决","由担责的负责人做成文的风险接受决策，配上定过价的分级缓解措施","两种模式都做原型，让使用数据说话","默认采纳法务立场——合规高于功能"],a:[1],re:"Risk decisions need an accountable owner choosing among priced options — tiered review by risk is usually where this lands. Why not: A skips the structured conversation and teaches teams to escalate; C ships the risk while deferring the decision; D a real instinct, but unowned blanket conservatism has costs too, and it is not legal's call alone.",rz:"风险决策需要一个担责的人，在定过价的选项中做选择——按风险分级审核通常是落点。其余：A 跳过结构化对话，教会团队凡事上交；C 决策还没做、风险先上线；D 是真实直觉，但无人担责的一刀切保守同样有代价，且这也不是法务一家说了算的事。"},
{d:6,m:0,qe:"Anthropic announces a new capability at a keynote; the CEO wants it in production this month. The current system meets its targets. How does the architect respond?",qz:"Anthropic 在发布会上宣布新能力；CEO 要求本月就上生产。现有系统各项指标达标。架构师如何回应？",oe:["Adopt immediately to maintain competitive posture","Decline: production systems should not chase releases","Wait for the first patch release so it can stabilise","Evaluate it against your workloads and roadmap criteria; adopt where evidence lands it"],oz:["立即采用，保持竞争姿态","拒绝：生产系统不应追逐新发布","等第一个修复版本发布、稳定后再说","按你的负载与路线图标准评测；证据落在哪就在哪采用"],a:[3],re:"A new capability is a dependency proposal: measure it on your tasks, then slot it by evidence — which also gives the CEO a real answer within weeks. Why not: A and B are reflexes in opposite directions; C substitutes a calendar heuristic for measurement.",rz:"新能力就是一份依赖提案：在你的任务上测，证据落在哪就排在哪——这也让 CEO 在几周内得到真实答案。其余：A、B 是方向相反的两种条件反射；C 用日历启发式替代了测量。"},
{d:6,m:0,qe:"An assistant's usage has fallen 70% since launch and cost per interaction has quadrupled. Leadership asks what to do with it. The mature move is:",qz:"某助手上线后使用量下降 70%，单次交互成本翻了四倍。管理层问怎么办。成熟的做法是：",oe:["A structured sunset review: value evidence, migration path, and a communication plan","Relaunch it with an internal awareness campaign","Keep it running — the investment is already made","Shut it down immediately to stop the losses"],oz:["结构化退役评审：价值证据、迁移路径、沟通计划","内部宣传造势，重新推广一波","继续运行——投资已经花出去了","立即关停止损"],a:[0],re:"Lifecycle management includes deliberate endings: decide on evidence, migrate remaining users, communicate. Why not: B invests before diagnosing why usage fell; C is the sunk-cost fallacy wearing a badge; D strands the remaining 30% without a path.",rz:"生命周期管理包含「体面的退场」：以证据决策、迁移存量用户、做好沟通。其余：B 还没诊断使用量为何下滑就先投入；C 是佩戴工牌的沉没成本谬误；D 把剩下 30% 的用户扔在原地。"},
{d:6,m:0,qe:"Two years from now, a new team will ask why this system uses RAG instead of fine-tuning. Which artefact answers them, and what must it contain?",qz:"两年后，新团队会问：这个系统为什么用 RAG 而不是微调。哪种产物能回答他们？它必须包含什么？",oe:["The vote tally from the meeting where it was decided","The full minutes of the architecture review meetings","An ADR: context, options considered, trade-offs, and consequences","The final choice together with its implementation steps"],oz:["当年决策会议的投票结果","架构评审会的完整会议纪要","一份 ADR：背景、被考虑过的选项、取舍与后果","最终选择及其实施步骤"],a:[2],re:"Future readers need the reasoning and the rejected paths, not the ceremony. Why not: A and B are process artefacts that record who and when, not why; D gives the what without the why — guaranteeing the debate is reopened from scratch.",rz:"未来的读者需要的是推理过程和被否掉的路径，不是仪式记录。其余：A、B 是过程性产物，记下了谁与何时、没记下为什么；D 只有「是什么」没有「为什么」——保证这场争论从零再来一遍。"},
{d:6,m:2,qe:"(Select TWO) The support organisation must be ready for launch week. Which TWO artefacts matter most to them?",qz:"（多选，选2项）支持团队必须为上线周做好准备。哪两种交付物对他们最重要？",oe:["The system architecture diagrams","Benchmark comparisons for the underlying model","A known-limitations document with expected failure modes","The full prompt library used by the system","Escalation paths and a rollback communication plan"],oz:["系统架构图","底层模型的基准对比","已知局限文档：预期的失效形态","系统使用的完整提示词库","升级路径与回滚沟通预案"],a:[2,4],re:"Frontline readiness is knowing what breaks and what to do when it does. Why not: A and D are engineering artefacts, not operational guidance; B is irrelevant to a support conversation.",rz:"一线的就绪=知道什么会坏、坏了怎么办。其余：A、D 是工程产物、不是操作指引；B 与支持场景无关。"},
{d:6,m:2,qe:"(Select TWO) Before an executive demo, which TWO practices keep expectations anchored to reality?",qz:"（多选，选2项）高管演示之前，哪两种做法能把期望锚定在现实上？",oe:["Show only the strongest cherry-picked interactions","Demo on samples drawn from the production input distribution","Avoid demos entirely until the system is polished","Pair the demo with the evaluation scorecard, limitations included","Promise parity with human experts within the next quarter"],oz:["只展示精挑细选的最强交互","用取自生产输入分布的样本来演示","在系统打磨完美前完全避免演示","演示随附评测记分卡——包括局限性","承诺下季度内达到人类专家水平"],a:[1,3],re:"Honest demos use representative inputs and measured claims. Why not: A manufactures expectations the median case cannot meet; C real caution that cedes the narrative to imagination; E writes a cheque the evidence has not cashed.",rz:"诚实的演示=有代表性的输入+有测量支撑的表述。其余：A 制造出中位数根本接不住的期望；C 是把叙事让位给想象的真谨慎；E 开出了证据尚未兑付的支票。"},
{d:6,k:"x",qe:"Match each situation to the artefact that serves it. Options: ADR, runbook, SLA, postmortem.",qz:"为每个情境匹配对应的产物。选项：ADR、runbook、SLA、事后复盘（postmortem）。",scenE:["Recording why retrieval was chosen over fine-tuning, with the trade-offs weighed.","The 3 a.m. page: steps to diagnose the alert and when to escalate.","The contractual commitments, including service levels during degraded mode.","Last week's outage: timeline, root cause, and corrective actions.","A customer asks what response latency they can rely on."],scenZ:["记录为何选检索而非微调，以及权衡了哪些取舍。","凌晨三点的告警：诊断步骤与何时升级。","合同承诺，包括降级模式期间的服务水平。","上周的故障：时间线、根因、整改措施。","客户询问可以依赖怎样的响应延迟。"],sopE:["ADR","runbook","SLA","postmortem"],sopZ:["ADR","runbook","SLA","事后复盘"],a:[0,1,2,3,2],re:"Decision reasoning lives in ADRs (1). Operational response lives in runbooks (2). Commitments — including degraded mode and reliable latency — live in SLAs (3, 5). Incident learning lives in postmortems (4).",rz:"决策推理在 ADR（1）；操作响应在 runbook（2）；承诺——含降级模式与可依赖延迟——在 SLA（3、5）；事故学习在复盘（4）。"},
{d:7,m:0,qe:"Developers keep pasting API keys into prompts and config files despite policy. Which control fixes this durably?",qz:"尽管有政策，开发者仍不断把 API key 粘进提示词和配置文件。哪种控制能长效解决？",oe:["Quarterly training on credential handling","A CI secrets scanner that blocks commits containing keys","A shared team vault document with copy-paste values","Environment-scoped injection so secrets never enter files, with scanning as the backstop"],oz:["每季度一次凭证处理培训","CI 密钥扫描器：拦截包含 key 的提交","团队共享保险库文档，随取随粘","环境注入：机密永不进文件，扫描只作兜底"],a:[3],re:"Make the safe path the default path: if secrets never enter files, there is nothing to leak or scan for. Why not: A knowledge decays under deadline pressure; B catches at commit — after the secret entered a file and possibly a prompt; C institutionalises the exact anti-pattern.",rz:"让安全路径成为默认路径：机密根本不进文件，就无处可泄、无需可扫。其余：A 知识在赶工压力下必然衰减；B 在提交时才拦——机密已进文件、也许已进提示词；C 把反模式本身制度化了。"},
{d:7,m:0,qe:"Leadership asks whether the AI development tooling rollout is working. Which measurement answers the question?",qz:"管理层问：AI 开发工具的推广到底有没有成效。哪种测量能回答这个问题？",oe:["Tool adoption rate across the organisation","Cycle time and defect rates on AI-assisted work versus the baseline","Lines of AI-generated code merged per week","Developer satisfaction scores from the quarterly survey"],oz:["全组织的工具采用率","AI 辅助工作的交付周期与缺陷率，对照基线","每周合入的 AI 生成代码行数","季度调研中的开发者满意度"],a:[1],re:"Outcomes over activity: faster cycles at equal-or-better defect rates is what working means. Why not: A and C measure usage and volume — vanity metrics that rise even when value does not; D a real signal worth tracking, and the softest of the four on its own.",rz:"看结果不看动作：在缺陷率持平或更好的前提下周期变快，才叫「有成效」。其余：A、C 量的是使用量和产量——价值不涨它们也能涨的虚荣指标；D 是值得跟踪的真信号，单独看也是四个里最软的。"},
{d:7,m:2,qe:"(Select TWO) Scaling agentic coding tools to 300 engineers, which TWO controls bound the operational risk?",qz:"（多选，选2项）把代理式编码工具推广到 300 名工程师，哪两个控制能框住运营风险？",oe:["Sandboxed execution environments for agent-run commands","Unrestricted credentials so friction never blocks work","A ban on all automated code changes","Restricting agent features to senior engineers only","Approval gates on destructive actions: force-push, deletion, production deploys"],oz:["代理执行命令的沙箱环境","不设限的凭证，让摩擦永不挡路","禁止一切自动化代码变更","代理功能只开放给资深工程师","破坏性动作设审批门：强推、删除、生产部署"],a:[0,4],re:"Bound the blast radius, gate the irreversible. Why not: B maximises the blast radius instead; C and D are safety by exclusion — they forfeit the value the rollout exists to create.",rz:"框住爆炸半径、给不可逆动作上闸。其余：B 反而把爆炸半径开到最大；C、D 是「靠排除求安全」——牺牲的恰是推广本要创造的价值。"},
{d:7,m:2,qe:"(Select TWO) A 40-person team's AI-assisted output varies wildly in style and quality. Which TWO practices create consistency?",qz:"（多选，选2项）40 人团队的 AI 辅助产出在风格与质量上差异巨大。哪两种实践能建立一致性？",oe:["A style lecture during onboarding","Per-developer configurations tuned to individual taste","Version-controlled shared standards that the tooling loads automatically","Reusable prompt and workflow templates for recurring task types","A weekly manual consistency review of merged code"],oz:["入职时上一堂风格课","按个人口味调校的每人独立配置","版本控制中的共享标准，工具自动加载","面向高频任务类型的可复用提示与工作流模板","每周对合入代码做一次人工一致性评审"],a:[2,3],re:"Consistency ships as configuration and templates, not exhortation. Why not: A decays within weeks; B is the inconsistency, institutionalised; E real QA that scales poorly and catches problems after merge.",rz:"一致性要以配置和模板的形态交付，不靠口头号召。其余：A 几周内就衰减；B 就是把「不一致」制度化；E 是真实的 QA，但扩展性差、且发现问题已在合入之后。"}
]}
];
boot();
</script>

{id:"III",ne:"Set III · Hard sprint",nz:"Set III · 高难冲刺卷",time:45,qs:[
{d:1,m:0,qe:"An evaluator-optimizer loop raised content quality 15% but averages 4 iterations per item; at full volume the cost is untenable. Preserve most of the gain while cutting most of the cost:",qz:"Evaluator-optimizer 循环把内容质量提升了 15%，但平均每条要迭代 4 轮；放到全量上成本不可接受。如何保住大部分收益、砍掉大部分成本？",oe:["Confidence-gated routing: a light scorer screens outputs; only low-scoring or high-risk items enter the optimization loop","Cap the loop at one iteration for every item","Reserve the loop for a random 20% sample of items","Batch the optimization iterations through the discounted async API"],oz:["置信度门控路由：轻量评分器先筛，只有低分/高风险条目进入优化循环","把所有条目的迭代上限压到 1 轮","随机抽 20% 的条目走优化循环","把优化迭代改走折扣异步批处理 API"],a:[0],re:"A — most items pass on the first try; gating spends iterations only where the scorer detects deficiency, keeping most of the 15% at a fraction of the cost. B is a real cost cap that hits every hard item equally — exactly the items needing multiple rounds lose the most. C cuts cost proportionally but selects blindly: 80% of deficient items ship unimproved. D is a genuine price lever when latency allows; it discounts the waste instead of eliminating it.",rz:"A——多数条目一次即过；门控只在评分器发现缺陷处花迭代，用一小部分成本保住大部分 15%。B 是真实的成本上限，但对所有难例一视同仁——恰恰是需要多轮的条目损失最大；C 成本按比例降，选择却是盲的：80% 有缺陷的条目原样出厂；D 是延迟允许时的真实价格杠杆——它给浪费打折，而不是消灭浪费。"},
{d:1,m:0,qe:"Two agents collaborate via a shared free-form scratchpad. Incidents show overwritten conclusions and decisions made on stale reads. The architectural fix:",qz:"两个 Agent 通过一块共享的自由读写便签协作。事故记录显示结论被互相覆盖、决策基于过期读取。架构级修复是：",oe:["Replace shared mutable state with ownership: partitioned state per agent, explicit versioned messages between them (or an orchestrator merging)","Instruct both agents to re-read the scratchpad immediately before every write","Grow the scratchpad so entries are appended rather than overwritten","Serialize all access through a locking mechanism on the scratchpad"],oz:["取消共享可变状态，改为所有权模型：各自持有分区状态，交互走显式的带版本消息（或由编排者统一合并）","在提示中要求两个 Agent 每次写入前都立刻重读一遍便签","扩大便签容量，让内容以追加代替覆盖","为便签加锁机制，把所有访问串行化"],a:[0],re:"A — this is a distributed-systems problem; ownership plus message passing removes the race by construction. B is check-then-act with a window still open between read and write — the same race, politely requested. C prevents overwrites but not stale reads, and unbounded append burns context while burying the current truth. D is a real concurrency tool: locks serialize access yet stale-read decisions persist, and lock discipline across LLM turns is fragile.",rz:"A——这是分布式系统问题；所有权+消息传递从构造上消灭竞态。B 是 check-then-act：读与写之间窗口依旧敞开——同一个竞态，只是被礼貌地请求了一下；C 防了覆盖防不了过期读取，无界追加还烧上下文、把「当前事实」埋进历史；D 是真实的并发工具：锁能串行化访问，但基于过期读的决策照旧，而且跨 LLM 轮次维持锁纪律非常脆弱。"},
{d:1,m:0,qe:"An agent pilot succeeded; scaling it 10x reveals unpredictable per-task cost (some tasks loop 40+ steps). Finance demands predictable unit economics. Architectural evolution?",qz:"Agent 试点成功；放大 10 倍后暴露出单任务成本不可预测（部分任务循环 40+ 步）。财务要求可预测的单位经济性。架构应如何演进？",oe:["Mine the transcripts for the stable majority paths, carve them into fixed workflows, and reserve the agent for the genuinely open-ended tail","Set a hard step budget per task and terminate at the cap","Negotiate committed-use pricing so cost per token drops","Fine-tune the model on successful transcripts to shorten trajectories"],oz:["从运行转录中挖出稳定多数路径，固化为固定工作流，Agent 只留给真正开放式的长尾","设定每任务硬性步数预算，到顶即终止","谈判承诺用量折扣，降低单 token 价格","用成功轨迹微调模型，让路径变短"],a:[0],re:"A — at scale, most agent traffic follows repeated patterns; converting them to workflows makes the majority deterministic in cost while agency survives where it earns its keep. B creates predictability by truncating exactly the tasks that need more steps — cost certainty purchased with failure. C lowers the price of unpredictability without reducing it; a real procurement lever, orthogonal to the architecture. D is a real optimization with real cost — trajectory-shortening is neither guaranteed nor a substitute for structural predictability.",rz:"A——规模化后多数 Agent 流量走的是重复模式；把它们固化为工作流，多数成本变为确定，自主性留在它真正创造价值的长尾。B 用截断「恰好需要更多步数的任务」来制造可预测——拿失败换确定性；C 降低了不可预测性的单价，却没减少不可预测性——真实的采购杠杆，与架构正交；D 是真实但有代价的优化——轨迹缩短既无保证，也替代不了结构性可预测。"},
{d:1,m:0,qe:"A travel agent completes flight, hotel, then payment; a run fails after payment succeeded but confirmation write failed. Users get charged with no booking. Correct pattern?",qz:"旅行 Agent 依次完成机票、酒店、支付；某次运行在支付成功后、确认写入失败时中断。用户被扣款却没有订单。正确的模式是？",oe:["Saga-style compensation: each step registers a compensating action (refund, release hold) executed on downstream failure, with idempotent retries","Retry the whole flow from the beginning when any step fails","Wrap all four steps inside one atomic transaction","Alert operations to manually reconcile failed runs"],oz:["Saga 补偿模式：每一步登记补偿动作（退款、释放占位），下游失败即执行补偿，重试保持幂等","任一步失败就从头重试整个流程","把四个步骤包进一个原子事务","失败运行告警给运维人工对账"],a:[0],re:"A — cross-system multi-step flows cannot be atomic; sagas make partial failure a designed state with an exit. B re-executes payment on retry — the double-charge amplifier, unless idempotency was designed in, which is the actual work A does. C is the correct instinct inside one database; airlines, hotels, and processors share no transaction coordinator. D is a real operational backstop that turns a design gap into permanent toil at scale.",rz:"A——跨系统多步流程做不到原子性；Saga 把部分失败变成有出口的设计内状态。B 重试会再次执行支付——双重扣款放大器，除非幂等已被设计好，而那正是 A 在做的工作；C 在单库内是正确直觉——航司、酒店、支付方之间不存在共享的事务协调者；D 是真实的运维兜底，会把设计缺口固化成规模化的重复劳动。"},
{d:2,m:0,qe:"A 60k-token stable knowledge base is cached, yet cache hit rate is near zero. Inspection finds the request template injects the current timestamp at the top of the system prompt. Explain and fix:",qz:"6 万 token 的稳定知识库已配置缓存，但命中率接近 0。检查发现请求模板会在系统提示最顶部注入当前时间戳。解释并修复：",oe:["Caching matches byte-stable prefixes; a changing first line invalidates everything after it — move volatile fields after the static blocks (or coarsen their granularity)","The knowledge base exceeds the cacheable size limit — split it into two cached segments","The TTL is too short for your traffic pattern — request a longer-lived cache","Timestamps are fine but the format is non-deterministic — standardize the format"],oz:["缓存按字节级稳定前缀匹配；首行一变，其后全部失效——把易变字段移到静态区块之后（或粗化其粒度）","知识库超过了可缓存的大小上限——拆成两段分别缓存","TTL 相对你的流量模式太短——申请更长的缓存存活期","时间戳没问题，是格式不确定——把格式标准化"],a:[0],re:"A — prefix matching is positional: the earliest changing byte poisons every subsequent token; volatile-last ordering (and per-hour rather than per-second granularity if the timestamp is needed early) restores hits. B misattributes: size limits would cap what caches, not zero out hits. C — TTL explains decay between sparse requests, not near-zero hits under active traffic. D standardizing format still changes the value every request; determinism of format is not stability of content.",rz:"A——前缀匹配是位置性的：最早变化的字节污染其后全部 token；易变内容后置（若确需时间戳，可把粒度粗化到小时级）即可恢复命中。B 归因错了：大小上限会限制「能缓存多少」，不会把命中清零；C——TTL 解释的是稀疏请求间的缓存衰减，解释不了活跃流量下的近零命中；D 把格式标准化后，值仍然每次请求都在变；格式确定≠内容稳定。"},
{d:2,m:0,qe:"Growing few-shot examples from 6 to 30 improved eval accuracy 0.4% while adding 9k tokens per request. The professional decision process is:",qz:"few-shot 示例从 6 个加到 30 个，评测准确率只提升 0.4%，每请求却多花 9k token。专业的决策过程是：",oe:["Measure the accuracy-per-token curve, find the knee, and keep the smallest diverse set near it — reallocating context budget to higher-value content","Keep all 30 since any accuracy gain compounds at scale","Cut to zero examples since the marginal value has clearly collapsed","Move the examples into the cached prefix so their cost stops mattering"],oz:["测出「准确率-token」曲线，找到拐点，保留拐点附近最小且多样的示例集——把上下文预算重配给更高价值的内容","30 个全留——任何准确率提升在规模化后都会复利","裁到零示例——边际价值显然已经崩塌","把示例挪进缓存前缀，让它们的成本不再重要"],a:[0],re:"A — curve, knee, smallest diverse set: the decision is empirical, and context is an opportunity-cost budget. B misapplies compounding: 0.4% may be inside eval noise, while the token cost is real on every request. C overcorrects from diminishing marginal value to zero total value — the first few examples carried most of the gain. D is a real cost mitigation that leaves latency, context ceiling, and attention dilution untouched; cached tokens still occupy the window.",rz:"A——曲线、拐点、最小多样集：这是个经验性决策，而上下文是有机会成本的预算。B 错用了复利：0.4% 可能就在评测噪声带内，而 token 成本每次请求都真实发生；C 从「边际价值递减」过度修正到「总价值为零」——最初几个示例贡献了大部分收益；D 是真实的成本缓解，但延迟、上下文上限、注意力稀释一个都没解决；缓存的 token 依然占据窗口。"},
{d:3,m:0,qe:"Retrieval metrics: recall@20 is 96% (right passage almost always in the top 20), but the model receives top-5 and answer quality is poor. The missing component is:",qz:"检索指标：recall@20 达 96%（正确段落几乎总在前 20），但供给模型的是 top-5，答案质量差。缺的组件是：",oe:["A reranker that reorders the top-20 candidates so the right passages reach the top-5 window","A stronger embedding model to improve first-stage retrieval","Expanding the supply window from top-5 to top-20","Query expansion to diversify the candidate pool"],oz:["Re-ranker：对 top-20 候选重排，让正确段落进入 top-5 供给窗口","更强的 embedding 模型，提升第一段检索","把供给窗口从 top-5 直接扩到 top-20","查询扩展，让候选池更多样"],a:[0],re:"A — the diagnosis is precise: candidates are recalled but misordered; reranking is the component built for exactly this gap. B strengthens a stage already performing at 96% — spend where the failure is. C is a real workaround that feeds 4x more tokens, adds distractor passages, and degrades grounding — treating a ranking problem as a bandwidth problem. D diversifies recall, which was never the deficient property.",rz:"A——诊断已经很精确：候选被召回了，只是排序不对；精排正是为这个缺口而生的组件。B 强化的是一个已经做到 96% 的阶段——钱要花在失败发生处；C 是真实的绕法，但供给 token 翻 4 倍、混入干扰段落、劣化 grounding——把排序问题当带宽问题治；D 让召回更多样，而多样性从来不是短板。"},
{d:3,m:0,qe:"Contract chunks are dense with anaphora (the Company, said Agreement, such date); retrieval frequently surfaces passages about the wrong party. Embedding-side remedy?",qz:"合同文本块里充满指代（「本公司」「该协议」「上述日期」）；检索经常召回讲错主体的段落。嵌入侧的对症补救是？",oe:["Contextual retrieval: prepend each chunk with a short generated summary of its document and section before embedding, so referents resolve","Increase chunk overlap so referents appear alongside their pronouns more often","Add a keyword index over party names as a hybrid signal","Instruct the answering model to double-check party identity before responding"],oz:["Contextual retrieval：嵌入前为每个块前置一段所属文档/章节的简短生成摘要，让指代得以消解","加大块间重叠，让先行词更常与代词同块出现","为主体名称建关键词索引，作为 hybrid 信号","要求作答模型在回复前二次核对主体身份"],a:[0],re:"A — the chunk embeds without knowing whose contract it belongs to; prepended context injects the identity into the vector itself. B helps borderline cases probabilistically but referents defined pages earlier stay unresolved regardless of overlap. C is real and useful when queries contain party names — it does not fix the vectors, and generic queries still mismatch. D operates after retrieval already surfaced the wrong party's clauses; the model verifies against the wrong evidence.",rz:"A——文本块在嵌入时并不知道自己属于谁的合同；前置上下文把主体身份注入向量本身。B 对临界情况有概率性帮助，但几页之前定义的先行词无论怎么重叠都解不了；C 在查询里含主体名时真实有用——但它修不了向量，泛化查询照样错配；D 发生在检索已经召回错误主体条款之后；模型是在对着错误证据做核对。"},
{d:3,m:2,qe:"(Select 2) A multi-tenant gateway calls downstream services with its own powerful credential on behalf of tenants; a crafted request just read another tenant's data (confused deputy). Which two changes fix the class of vulnerability?",qz:"（多选，选2项）多租户网关用自己的高权凭证代表租户调用下游服务；一次构造请求刚刚读到了别家租户的数据（confused deputy）。哪两项改动能修复这一类漏洞？",oe:["Per-request token exchange: the gateway trades the caller's identity for a downstream token scoped to that tenant","Short-lived, audience-restricted downstream tokens that each service validates","Enforce TLS on every hop between gateway and services","Rotate the gateway's master credential on a tighter schedule"],oz:["请求级令牌交换：网关用调用方身份换取限定该租户范围的下游令牌","短时效、受众（audience）受限的下游令牌，且每个服务各自校验","网关与服务间每一跳强制 TLS","更高频地轮换网关的主凭证"],a:[0,1],re:"The deputy is confused because downstream sees one omnipotent identity; A restores per-tenant identity per request, B makes tokens unusable outside their intended audience and window. C secures the channel — the legitimate channel was used in the attack. D shortens the life of a credential that remains omnipotent while alive.",rz:"代理人之所以「混淆」，是因为下游只看到一个全能身份；A 让每次请求恢复租户级身份，B 让令牌出了预期受众与时窗即失效。C 保护的是信道——攻击走的恰是合法信道；D 缩短的是一个「活着时依旧全能」的凭证的寿命。"},
{d:3,m:0,qe:"A third-party MCP server marks its tools readOnlyHint: true. Your security team asks whether agents may therefore call them without restriction. Correct position?",qz:"某第三方 MCP 服务器给自家工具标注了 readOnlyHint: true。安全团队问：是否因此可以让 Agent 不受限制地调用它们？正确立场是？",oe:["Annotations are the server's self-declaration, not an enforced boundary — apply your own policy controls and verify actual behavior before trusting","Yes for read-only tools, since the protocol guarantees the hint's accuracy","Yes if the server is fetched over TLS from the vendor's official registry","No third-party MCP servers should be used in any environment"],oz:["注解是服务方的自我声明，不是被强制执行的边界——先套用自己的策略控制并验证实际行为，再谈信任","可以：协议保证了只读注解的准确性","可以：只要通过 TLS 从官方注册表获取该服务器","任何环境都不应使用第三方 MCP 服务器"],a:[0],re:"A — hints are metadata supplied by the party you are deciding whether to trust; enforcement must live client-side, with behavioral verification for anything sensitive. B misstates the protocol: hints are advisory by design, nothing validates them. C authenticates provenance and transport — a real supply-chain control that says nothing about what the code does. D is a real posture for high-security enclaves, but as a general answer it discards the ecosystem instead of governing it.",rz:"A——hint 是「你正在决定是否信任的那一方」提供的元数据；强制力必须在客户端一侧，敏感场景还要做行为验证。B 说错了协议：hint 在设计上就是建议性的，没有任何机制校验它；C 认证的是来源与传输——真实的供应链控制，但对「代码实际做什么」一言不发；D 是高安环境的真实姿态，作为一般答案它是抛弃生态而不是治理生态。"},
{d:4,m:2,qe:"(Select 2) After three months of tuning against the same frozen eval set, offline scores rose 12 points while production quality is flat. Which two changes restore the eval's meaning?",qz:"（多选，选2项）对着同一套冻结评测集调了三个月，离线分涨了 12 分，线上质量纹丝不动。哪两项改动能恢复评测的意义？",oe:["Maintain a held-out set that is never used for tuning decisions, rotated periodically","Continuously sample fresh production cases into the evaluation pool","Enlarge the existing frozen set with more items of the same vintage","Raise the pass threshold so the suite is harder to satisfy"],oz:["维护一套从不用于调优决策的保留集（holdout），并定期轮换","持续从生产流量采样新鲜案例进评测池","把现有冻结集扩充更多「同一年代」的题目","抬高通过阈值，让套件更难被满足"],a:[0,1],re:"Twelve offline points with flat production is Goodhart in action: the team optimized the artifact, not the ability. A restores an untouched yardstick; B keeps the eval anchored to today's distribution. C adds more of what is already overfit to. D makes an invalid measure harder to pass — rigor applied to the wrong instrument.",rz:"离线涨 12 分、线上纹丝不动，就是活生生的 Goodhart：团队优化的是那件测量工具，不是能力本身。A 恢复一把未被污染的尺子；B 让评测锚定在今天的分布上。C 往已被过拟合的东西里加更多同款；D 让一个失效的度量「更难通过」——把严格用在了错误的仪器上。"},
{d:4,m:0,qe:"An A/B test shows the new prompt winning 52% of pairwise comparisons after 180 samples. The PM wants to declare victory. Statistically sound reading?",qz:"A/B 显示新 prompt 在 180 个成对比较中胜率 52%。产品经理想宣布获胜。统计上站得住的解读是？",oe:["A 2-point edge at n=180 is well within noise; run a power analysis for the detectable effect size and collect accordingly before deciding","The lead is real but small — ship it since any improvement counts","Extend the test by one more week and decide on whichever side leads then","Declare victory: 52% beats 50% and the sample exceeds 100"],oz:["n=180 时 2 个点的领先完全在噪声带内；先做功效分析确定可检测效应量，按需收集样本再决策","领先虽小但是真实的——有提升就该上","再延长一周，届时谁领先就选谁","可以宣布获胜：52% 大于 50%，样本也超过了 100"],a:[0],re:"A — the confidence interval on 52% at n=180 spans 50% comfortably; power analysis tells you what sample the decision actually needs. B assumes the direction is signal; at this n, direction is a coin still spinning. C adds time without a stopping rule — the same noise will wander across 50% repeatedly. D applies folk thresholds; sample size adequacy depends on effect size, not on a round number.",rz:"A——n=180 时 52% 的置信区间从容地横跨 50%；功效分析告诉你这个决策实际需要多少样本。B 把方向当成了信号；这个样本量下，方向是一枚还在旋转的硬币；C 加时间不加停止规则——同样的噪声会在 50% 两侧反复游走；D 用的是民间阈值；样本量是否充足取决于效应量，不取决于某个整数。"},
{d:4,m:0,qe:"Monthly quality tracking became incomparable: the LLM judge is set to always use the provider's latest model, which updated twice this quarter. Fix the measurement system:",qz:"月度质量追踪失去了可比性：LLM judge 被配置为始终使用服务商最新模型，而本季度它更新了两次。如何修好这套测量系统？",oe:["Pin the judge to a specific model version; when intentionally upgrading, re-score a reference set to re-baseline before comparing across the boundary","Keep using the latest judge since newer models evaluate more accurately","Average scores from the old and new judges during transition months","Switch to human review for all monthly scoring"],oz:["把 judge 锁定到特定模型版本；确需升级时，先在参照集上重跑、重建基线，再做跨界比较","继续用最新 judge——新模型评得更准","过渡月份取新旧 judge 分数的平均值","月度打分全部改为人工评审"],a:[0],re:"A — a measuring instrument must hold still while the measured thing changes; version pinning plus deliberate re-baselining preserves comparability across upgrades. B optimizes judge quality while destroying the time series — accuracy of an instrument is useless if the instrument keeps changing mid-experiment. C averages two different scales into a number on neither. D is the gold standard priced out of monthly full-volume use; the fix for drift is stabilization, not abandonment.",rz:"A——被测对象在变，测量仪器就必须稳住；版本锁定+有意升级时在参照集上重建基线，跨界仍可比。B 优化了 judge 的质量，毁掉了时间序列——实验中途不断更换的仪器，再准也没用；C 把两把不同的尺子平均成一个哪把尺都不属于的数；D 是被月度全量成本劝退的金标准；漂移的解法是把仪器稳定下来，不是把它扔掉。"},
{d:5,m:0,qe:"High-risk actions require human approval; approvers now face 400 requests daily and approve 99.7% within seconds. The control has decayed. Redesign?",qz:"高危动作需人工审批；审批人现在每天面对 400 条请求，99.7% 在数秒内点过。这道控制已经失效。如何重设计？",oe:["Re-tier by risk: automate the low-risk bulk with post-hoc sampling audits, batch similar mid-risk items, and reserve mandatory slow review for the genuinely high-risk few","Add a second approver so every request needs two sign-offs","Introduce a mandatory 60-second review timer per request","Rotate approvers weekly to keep attention fresh"],oz:["按风险重新分层：低危大头自动化+事后抽样审计，中危同类合并呈批，真正高危的少数保留强制性慢审","增加第二审批人，每条请求双人会签","每条请求强制 60 秒最短审看时间","审批人每周轮换，保持注意力新鲜"],a:[0],re:"A — a 99.7% seconds-fast approval rate means the queue is mostly noise; tiering returns human attention to the few decisions that deserve it. B doubles the cost of rubber-stamping: two tired signatures on the same unread request. C manufactures friction, not scrutiny — people wait 60 seconds and click the same button. D is a real freshness tactic for vigilance decay, but 400 daily requests will exhaust any rotation.",rz:"A——99.7% 秒批意味着队列里绝大多数是噪声；分层把人的注意力还给少数配得上它的决策。B 让盖章的成本翻倍：同一条没被读过的请求上多了一个疲惫的签名；C 制造的是摩擦不是审视——人们等完 60 秒点的还是同一个按钮；D 是对警觉衰减的真实换防战术，但每天 400 条会耗尽任何轮换。"},
{d:5,m:0,qe:"Your EU customers' data is processed through a US-region subprocessor that your DPA never mentions. Legal exposure and fix?",qz:"欧盟客户的数据经由一家美国区域的子处理商处理，而你的 DPA 从未提及此事。法律暴露与修复是？",oe:["Cross-border transfer without safeguards plus subprocessor transparency failure: map data flows, pin EU-region processing or implement valid transfer mechanisms (e.g., SCCs), and update the DPA disclosures","Encrypt the data in transit to the US so the transfer becomes compliant","Anonymize logs after processing so no personal data is retained abroad","Add a consent checkbox at signup covering international processing"],oz:["无保障的跨境传输+子处理商披露缺失：梳理数据流、锁定欧盟区域处理或落实有效传输机制（如 SCC），并更新 DPA 披露","对传往美国的数据做传输加密，让传输合规","处理完成后对日志匿名化，境外不留个人数据","注册时增加一个覆盖国际处理的同意勾选框"],a:[0],re:"A — two distinct violations need structural remedies: lawful transfer mechanics and honest subprocessor disclosure. B protects data in motion; GDPR governs where and under what safeguards processing happens, not just channel security. C addresses residue after the unlawful processing already occurred abroad. D — consent for cross-border transfers is a fragile, revocable basis and does not cure the disclosure failure; real lawyers reach for it last, not first.",rz:"A——两个独立的违规需要结构性补救：合法的传输机制+诚实的子处理商披露。B 保护的是传输中的数据；GDPR 管的是「处理发生在哪里、在什么保障下」，不只是信道安全；C 处理的是「违法处理已在境外发生之后」的残留；D——以同意作为跨境传输依据既脆弱又可随时撤回，也治不了披露缺失；真正的法务把它排在最后，不是最前。"},
{d:5,m:2,qe:"(Select 2) Which two items belong in the incident playbook for a production AI agent, prepared before launch?",qz:"（多选，选2项）生产 AI Agent 的事故手册（上线前就要备好）应包含哪两项？",oe:["A tested deactivation path: kill switch or capability flags with named owners authorized to pull them","A communication decision tree: who informs which customers and regulators, with pre-drafted templates","A blameless postmortem template for use after resolution","A technical-debt backlog of components to refactor"],oz:["经过演练的停用路径：kill switch/能力开关，及被授权执行的具名负责人","沟通决策树：由谁通知哪些客户与监管方，附预先起草的模板","事故解决后使用的免责复盘模板","待重构组件的技术债清单"],a:[0,1],re:"During an incident you need to stop the harm (A) and manage the disclosure (B) — both fail if improvised. C is a genuinely valuable practice for after resolution; putting it in the live playbook confuses response with retrospection. D is real engineering hygiene on a different timescale entirely.",rz:"事故进行中你需要止损（A）和管理对外披露（B）——两者一旦临场即兴都会失败。C 是真实且宝贵的实践，但属于解决之后；把它放进临战手册是把响应与回顾混为一谈；D 是完全另一个时间尺度上的真实工程卫生。"},
{d:5,m:0,qe:"Before launch, the release gate must cover safety measurably. Which formulation is actually operational?",qz:"上线前，发布门禁必须把「安全」变成可测量项。哪种表述真正可操作？",oe:["Defined thresholds on an adversarial suite: jailbreak success below X%, 100% block rate on the exfiltration red-team corpus, all high-risk tools behind approval — measured on every release candidate","The security team reviews the system and signs off that it feels ready","The model vendor's safety documentation is on file and current","No security incidents were observed during the beta period"],oz:["对抗套件上的明确阈值：越狱成功率低于 X%、外泄红队用例 100% 拦截、高危工具全部走审批——每个候选版本都测","安全团队评审系统并签字确认「感觉可以上了」","模型供应商的安全文档已归档且为最新","Beta 期间未观察到任何安全事件"],a:[0],re:"A — a gate is a measurement with a threshold, run on every candidate; anything else is ceremony. B contains real expertise expressed unfalsifiably — feels ready cannot be regression-tested. C documents the vendor's diligence about their model, not your system's behavior with your tools and data. D is survivorship evidence: absence of observed incidents under friendly beta traffic bounds nothing about adversarial conditions.",rz:"A——门禁=带阈值的测量，且每个候选版本都要跑；除此之外都是仪式。B 里有真实的专业性，却以不可证伪的方式表达——「感觉可以」没法做回归测试；C 记录的是供应商对其模型的尽职，不是你的系统带着你的工具和数据的行为；D 是幸存者证据：友好流量下「没观察到事件」对对抗条件不构成任何上界。"},
{d:6,m:0,qe:"The CEO saw a launch keynote and wants the flagship model swapped in this quarter. Your task-level evals show the current model equal or better on your workloads at 40% lower cost. The architect's strongest play:",qz:"CEO 看了发布会主旨演讲，要求本季度换上那款旗舰模型。你的任务级评测显示：现有模型在你们的负载上持平或更好，成本还低 40%。架构师最有力的打法是：",oe:["Present the task-level comparison (quality, cost, latency) with two live examples, recommend staying, and commit the new model to a quarterly re-evaluation list — recorded in an ADR","Switch as directed and monitor for regressions","Run the swap as a 50/50 production A/B for a quarter and let the data decide","Decline the request, citing the evaluation results"],oz:["呈上任务级对比（质量/成本/延迟）+两个现场实例，建议维持现状，并把新模型列入季度复评清单——以 ADR 记录","照办切换，上线后监控回归","把切换做成 50/50 生产 A/B 跑一个季度，让数据说话","援引评测结果，直接拒绝该要求"],a:[0],re:"A — evidence plus a face-saving path: the re-evaluation list honors the executive's interest while the ADR records why not now. B abandons the architect's evidentiary duty; monitoring finds regressions after customers do. C sounds rigorous but spends a quarter of production traffic and integration cost re-answering a question your evals already answered. D may be factually right and politically final — a no with no path forward converts a data conversation into a power conversation.",rz:"A——证据+台阶：季度复评清单尊重高管的关注，ADR 记下「为何此刻不换」。B 放弃了架构师的呈证职责；监控发现回归时客户已先发现；C 听着严谨，实则花一个季度的生产流量与集成成本，去重答一个评测已经答过的问题；D 事实上可能对、政治上是终局——没有出路的「不」，会把一场数据对话变成一场权力对话。"},
{d:6,m:0,qe:"A four-hour outage breached a customer's SLA last night. Their leadership is furious. The postmortem communication that rebuilds trust contains:",qz:"昨夜四小时故障导致某客户 SLA 违约，对方高层震怒。能重建信任的复盘沟通应包含：",oe:["A blameless factual timeline, root cause, why existing safeguards missed it, corrective actions with dates, and the compensation per contract — delivered proactively","An explanation that the root cause was the upstream model provider's degradation","A goodwill service credit exceeding the contractual requirement","Assurance that the team has been reminded to be more careful"],oz:["无指责的事实时间线、根因、现有防线为何漏过、带日期的整改项、按合同的补偿——主动送达","说明根因是上游模型服务商的服务劣化","超出合同要求的善意服务抵扣","保证团队已被提醒要更加小心"],a:[0],re:"A — trust rebuilds on transparency plus verifiable commitments; the why-safeguards-missed-it section is what distinguishes learning from apology. B may be factually true and remains your accountability — customers bought your SLA, not your vendor chain. C is a real goodwill gesture that, alone, prices the outage instead of preventing the next one. D promises vigilance, the one corrective that decays by next quarter.",rz:"A——信任靠透明+可验证的承诺重建；「防线为何漏过」那一节是学习与道歉的分水岭。B 可能属实，但责任仍是你的——客户买的是你的 SLA，不是你的供应链；C 是真实的善意，但单独使用等于给故障定价，而不是防止下一次；D 承诺的是「警觉」——所有整改项里衰减得最快的那种。"},
{d:6,m:0,qe:"Ops signed the handoff receipt; two weeks later the first incident still escalated straight back to the build team. What was missing from the handoff?",qz:"运维已在交接单上签收；两周后第一起事故仍然直接升级回了研发团队。交接缺了什么？",oe:["Verified capability transfer: a shadow on-call rotation with the build team backing, and a game-day drill proving ops can execute the runbook alone","A more detailed runbook with screenshots for every procedure","A recorded architecture walkthrough for asynchronous reference","A stricter SLA on ops response times"],oz:["经过验证的能力转移：研发陪跑的影子值班轮换+故障演练（game day），证明运维能独立跑通 runbook","一份更详细、每步都带截图的 runbook","一段可供异步查阅的架构讲解录像","对运维响应时效定更严格的 SLA"],a:[0],re:"A — handoff completes when the receiving team demonstrates independent execution under realistic pressure; documents transfer information, drills transfer capability. B and C improve the material without testing whether anyone can act on it at 3 a.m. D holds ops accountable for a capability nobody verified they received — stricter targets do not create competence.",rz:"A——交接的完成标准是接收方在真实压力下演示过独立处置；文档转移的是信息，演练转移的才是能力。B、C 改进的是材料，却没检验有没有人能在凌晨三点据此行动；D 用更严的指标去追责一项从未被验证已经交付的能力——收紧目标不会长出胜任力。"},
{d:7,m:0,qe:"Security wants outbound-network tools disabled by default across the whole org's Claude Code fleet; three platform teams have a legitimate need. Governance mechanism?",qz:"安全团队要求全组织的 Claude Code 默认禁用出站网络类工具；但三个平台团队有正当使用需求。治理机制？",oe:["Centrally managed policy sets the default-off baseline; exceptions are declared in the three repos' committed configuration, approved via PR review and auditable","Grant senior engineers discretion to enable the tools when they judge it safe","Enable org-wide but add monitoring and alerts on outbound calls","Keep the tools disabled for everyone until a quarterly security review"],oz:["集中管控策略设定默认禁用基线；例外由三个仓库在其提交的配置中声明，经 PR 评审批准、全程可审计","授权资深工程师自行判断安全时启用","全组织开启，但对出站调用加监控与告警","对所有人保持禁用，等季度安全评审再议"],a:[0],re:"A — default-safe with a governed, auditable exception path: security gets its baseline, the three teams get their tools, and every deviation has a review trail. B is trust-based governance that leaves no audit trail and scales exactly as far as individual judgment does. C inverts the control: everything allowed, violations noticed afterward — monitoring is evidence collection, not prevention. D achieves safety by blocking legitimate work for a quarter; a pause pretending to be a policy.",rz:"A——默认安全+受治理、可审计的例外通道：安全团队拿到基线，三个团队拿到工具，每个偏离都有评审痕迹。B 是基于信任的治理：不留审计痕迹，可扩展性止步于个人判断力；C 把控制反转了：先全放行、事后再发现——监控是取证不是预防；D 用封锁正当工作一个季度的方式实现安全；那是伪装成政策的暂停键。"},
/*S3*/
]}
];
boot();
